; 2026-10-23 RELEASE 1023 ini patch. Apply with
;   python tools/kl_ini_patch.py "<DD>\KLHook.ini" KLHook.release1023.patch.ini --dry-run
; Part 1 = balance pass 2, copied exactly from <work>\build\balance2_1023\KLHook.balance2.patch.ini (basis: re/balance2_1023.md).
; Part 2 = the [QoL] keys of klhook/klqol.c (names match; the keys are read live, but the flash and the cursor release
; themselves are NOT proven live - re/qol_1023.md lists them as GUESS). BackgroundMs stays 0 and no [QoL2] key is written.
; NOTE: no "Enable" line on purpose. The whole [Balance] module does nothing while [Balance] Enable=0 (klbalance.c klr_init).
; Run the installer with -BalanceOn to add Enable=1. Risk/Tough/CopToCrew/YouToCop/Regen* are NOT touched by this patch.
[Balance]
; a guard at arm's length: a step worth 4.5 bullets on you (pass 1: 6.0; game: 100)
PointBlankToYou=4.5
; police hit you x0.7 (pass 1: 0.9)
CopToYou=0.7
; an AI heister's bullet on you x0.6 (was the Risk=2 dial's 1.0): 24 % of the knock-down hits in the owner's logs were crew
CrewToYou=0.6
; 1.0 = the game's 550 (pass 1: 0.9 = 495)
PlayerHealth=1.0
; NEW KEY (needs the balance2 hook; an older hook ignores it): police bullets from far away cost less: x1 within 12 m,
; x0.6 from 40 m on, linear between
CopToYouFar=0.6
CopToYouNearAt=12
CopToYouFarAt=40
[QoL]
; the taskbar button flashes when a load ended / the FA lobby countdown starts / the round is over, while another window is in front
FlashOnReady=1
; ClipCursor(NULL) once when the game loses the foreground
ReleaseCursor=1
; 0 = no frame cap while backgrounded (NOT proven live: left off)
BackgroundMs=0
