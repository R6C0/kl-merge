; KLGfx - graphics proxy for Kane & Lynch 2: Dog Days (installed as d3d9.dll next to kl2.exe).
; Source and notes: gfx/ in the kl-merge repository. Remove: "REMOVE KLGfx from Dog Days.bat".
[KLGfx]
; 0 pass-through, 1 wrap (log + capture + bridge), 2 wrap on Direct3D 12 (experimental)
Mode=1
StatsEvery=10
CaptureKey=121
CaptureAt=
CaptureDumpTargets=1
CaptureMaxDumps=80
CaptureConstRegs=32

[NR]
; every frame through klnr.exe (OpenDLSS-NR's network) before it is shown; F9 on/off, F8 split view in game
Enable=1
Helper=KLNR\klnr.exe
; empty: KLNR\model if you put a model directory there (none ships with this), else none; or none / zero
Model=zero
; 1 = the right half comes back grey: proves the round trip without any model
Test=0
Split=0
ToggleKey=120
SplitKey=119
Temporal=1
Intensity=1
Style=0
LocalTone=1
LocalStructure=1
SkinStructure=-1
ColorStrength=1
PaperWhite=1
TimeoutMs=100
MaxMisses=30
