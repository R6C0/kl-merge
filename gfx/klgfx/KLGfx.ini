; KLGfx - graphics proxy for Kane & Lynch 2: Dog Days (installed as d3d9.dll next to kl2.exe).
; Delete or rename d3d9.dll to remove it. Source and design: gfx/ in the kl-merge repository.
[KLGfx]
; 0 = pass-through (the game uses Windows' Direct3D 9 exactly as without this DLL)
; 1 = wrap the device on native Direct3D 9: performance lines in KLGfx.log, frame capture
; 2 = as 1, running on Direct3D 12 through Windows' D3D9On12 layer (the bridge for DLSS)
Mode=1
; seconds between performance / memory lines in KLGfx.log (0 = none)
StatsEvery=10
; frame capture: this key in game (virtual-key code; 121 = F10), and/or seconds after the
; Direct3D device was made, e.g. CaptureAt=90,105
CaptureKey=121
CaptureAt=
; save each render target as it is left (PNG for 8-bit targets, DDS otherwise), at most this many
CaptureDumpTargets=1
CaptureMaxDumps=80
; shader constant registers printed per upload in calls.txt
CaptureConstRegs=32
