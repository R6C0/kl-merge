; KLGfx - graphics proxy for Kane & Lynch 2: Dog Days (installed as d3d9.dll next to kl2.exe).
; Delete or rename d3d9.dll to remove it. Source and design: gfx/ in the kl-merge repository.
[KLGfx]
; 0 = pass-through (the game uses Windows' Direct3D 9 exactly as without this DLL)
; 1 = wrap the device on native Direct3D 9: performance lines in KLGfx.log, frame capture
; 2 = as 1, running on Direct3D 12 through Windows' D3D9On12 layer (experimental)
Mode=1
; seconds between performance / memory lines in KLGfx.log (0 = none)
StatsEvery=10
; frame capture: this key in game (virtual-key code; 121 = F10), and/or seconds after the
; Direct3D device was made, e.g. CaptureAt=90,105
CaptureKey=121
CaptureAt=
; save each render target as it is left (PNG for 8-bit targets, DDS otherwise), at most this many
CaptureDumpTargets=1
CaptureMaxDumps=80
; shader constant registers printed per upload in calls.txt
CaptureConstRegs=32

[NR]
; Neural rendering bridge (gfx/klnr): every frame goes through klnr.exe, a 64-bit helper running OpenDLSS-NR's
; network, before it is shown. 0 = off (default). Needs Mode 1 or 2 (Enable=1 turns Mode 0 into 1).
Enable=0
; the helper, relative to the game folder (or a full path)
Helper=KLNR\klnr.exe
; empty: KLNR\model if it holds a model directory (supplied by you; none ships with this), else none.
; none = the frame only makes the round trip; zero = synthetic zero weights: the full network cost, no visible change
Model=
; Test=1 greys the right half of the screen in klnr.exe: shows the round trip works without any model
Test=0
; left half untouched, right half processed (F8 toggles it in game); F9 switches the bridge on and off
Split=0
ToggleKey=120
SplitKey=119
; blend with the previous output (no motion vectors yet: the network's own per-pixel weight rejects stale history)
Temporal=1
; network controls (OpenDLSS-NR demo defaults): Style 0 off, 1 natural, 2 cinematic
Intensity=1
Style=0
LocalTone=1
LocalStructure=1
SkinStructure=-1
ColorStrength=1
PaperWhite=1
; per-frame wait for klnr.exe, and how many frames in a row without a result before it is switched off
TimeoutMs=100
MaxMisses=30
