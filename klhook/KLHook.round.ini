; KLHook.ini for an unattended ARCADE ROUND in the F01 slot (Subway's menu entry), started from the
; menu. Copy as <Dog Days>\KLHook.ini next to a dinput8.dll built by klhookuild_auto.bat.
; Explained in rea_round.md sections 3, 6 and 7. This is the script of run ESC3 (2026-10-09), the
; first COMPLETE round: "FRAGILE ALLIANCE ARCADE - ROUND 1" -> loot $650,000 -> the escape van ->
; "You jumped into the getaway car" -> "All surviving criminals escaped", $723,625 -> Ready -> "Round: 2".
; The round is scripted by POSITION (klauto 'goto'; way points from the level's navigation mesh and,
; from the yard on, from tools\kl_escape.py): plaza -> bank door -> behind the counter, E at cash drawer
; 06 ($100,000) -> down to the garage, E at money boxes 11 and 10 -> west door -> the yard -> through
; the opened wall piece -> the exit box (the van is called) -> east along the street -> the SOUTH side
; of the van's boarding box (never stand on its stop: 2970, 41) -> tap E + hold E until the score page
; ('onwin') -> RETURN = Ready. The way points are for F07 + M03_FA_A (the Dead Men bank) in the F01 slot.
; ESC3 ran on the build WITHOUT the map's guards (kl_graft.py build F07 M03_FA_A --m-drop "AI_Enemies!*");
; on the full build the scripted player, who never shoots, is killed in the garage (run RN13).
; For another map: keep lines 1 - 26 and replace the rest (a walk, 'waitwin HeistStatusLeaderboard').
; To go back to the plain direct-boot test: [Auto] Enable=0 (or the stock KLHook.ini).
;
; RULES THIS FILE KEEPS (rea_round.md 5.3, 7.1; rentitamper.md):
;  1. Hooks=0 and no [Engine] section. kl2.exe carries Steam CEG's code-integrity check: with hashed
;     bytes of its code changed (eight of the breadcrumb detours, the vtable entry, the [Engine] push
;     operand) the process ends itself 30 ms after the level of a real session has loaded
;     (ExitProcess(0x8000dead) from 0x794ed6). Engine keys go in through the command line in memory
;     (CmdAdd). SAFE in a session, run live (X1 - X3): import-table wrappers (EndHooks=1, [Expansion]),
;     data writes, and the five detours in unhashed pages (Detours=NODE,CTRL,SCNBLK,REFFIX,GINIT).
;  2. DisableSplashScreens. With it the frontend opens MainMenu > CampaignMenu at once and never
;     shows the press-start page, so the profile is never loaded and NOTHING IS SAVED (the save
;     reader 0x47c5f0 and writer 0x6587c0 both need the press-start flag 0x156b742).
;     Never send RETURN on CampaignMenu: it is 'Story Mode', and two RETURNs start the story (L00).
;  3. LbFix (default 1): klauto zeroes the leaderboard service's unwritten row count once per boot
;     (the RN11 score-page crash, re\crash_scorepage.md).

[KLHook]
ContinueAsserts=1
MaxDumps=4
MaxAsserts=200
[Auto]
EndHooks=1
Enable=1
Hooks=0
Nodes=0
CmdDrop=DefaultScene,AutoExit
CmdAdd=-o DisableSplashScreens -o AutoExit=1500
StallMs=240000
MaxRunMs=1500000
LoadedMs=0
Unfocused=1
BlockReal=1
FirstChance=1
PosLogMs=2000
[Script]
1=waitwin CampaignMenu 180000
2=wait 1500
3=tap ESCAPE
4=waitwin MainMenu 8000
