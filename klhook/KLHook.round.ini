; KLHook.ini for an unattended ARCADE ROUND in the F01 slot (Subway's menu entry), started from the
; menu the way a player does. Copy as <Dog Days>\KLHook.ini next to a dinput8.dll built by
; klhook\build_auto.bat. Explained in re\fa_round.md section 3; nothing here has run in the game.
; To go back to the plain direct-boot test: [Auto] Enable=0 (or the stock KLHook.ini).

[KLHook]
ContinueAsserts=1
MaxDumps=4
MaxAsserts=200

[Auto]
Enable=1
Hooks=1
Nodes=0
; the Steam launch options force DefaultScene=Locations/F01/F01_Main.gms and AutoExit=120; both are
; blanked out of the process command line so that the game boots into its menu (the baked
; DefaultScene=KaneAndLynch.gms) and the run is not cut after 120 engine seconds
CmdDrop=DefaultScene,AutoExit
StallMs=180000
MaxRunMs=1200000
LoadedMs=0
Unfocused=1
BlockReal=1
FirstChance=1

[Engine]
; backstop only: the script ends the run. AutoExit counts engine ticks; 120 took 205..324 s of wall time
1=AutoExit=900
2=DisableSplashScreens

[Script]
1=waitscene kaneandlynch 180000
2=wait 8000
; AttractMode: ZPressStart takes ZW_SELECT (kl2 0x418d1e); its first press may only load the profile
; (0x418d5a..0x418d85), so RETURN is sent twice. If the first one already opened the disclaimer the
; second one skips it; if not, the disclaimer leaves by its own 15 s timer during the wait below.
3=tap RETURN
4=wait 2500
5=tap RETURN
6=wait 18000
7=log main menu expected; DOWN = from Story to Arcade Mode
8=tap DOWN
9=wait 800
10=tap RETURN
11=wait 2500
12=log Arcade page expected; RETURN = Start (first entry)
13=tap RETURN
14=wait 4000
15=log map page expected; stepping the selector to position 0 = Subway = slot F01
16=sel HeistLevel 0xceceec 0
17=wait 500
18=expect 0xceceec 0
19=msg HeistLevel StartGame
20=waitload 300000
21=log level loaded: the round should be starting
22=wait 20000
23=peek 0x168c630 settings-singleton (0 = no OnlineFragileAllianceSettings was initialised)
24=peek 0x168cc00 escape-monitor-singleton (0 = no OnlineEscVehicleMonitor)
25=peek 0x168a254 AIMonitor-count
26=peek 0x168a200 AIMonitor-events-sent (bytes 0,1,2; 00010000 = the round-start event 2 was raised)
27=peek 0x168e598+0x5c session-game-mode (4 = an Arcade / Fragile Alliance session; a direct boot has no 4)
28=peek 0x168e59c FA-sub-mode (0 in Arcade, set at kl2 0x502bee)
29=pass 240000
