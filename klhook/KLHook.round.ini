; KLHook.ini for an unattended ARCADE ROUND in the F01 slot (Subway's menu entry), started from the
; menu. Copy as <Dog Days>\KLHook.ini next to a dinput8.dll built by klhook\build_auto.bat.
; Explained in re\fa_round.md section 3. RUN LIVE 2026-10-09 (runs RN5, RN6 in tools\kl_graft.py):
; this route reaches a real round - "FRAGILE ALLIANCE ARCADE - ROUND 1", session game mode 4.
; To go back to the plain direct-boot test: [Auto] Enable=0 (or the stock KLHook.ini).
;
; TWO RULES THIS FILE KEEPS (both found the hard way, see re\fa_round.md 3.1):
;  1. Hooks=0 and no [Engine] section. kl2.exe has an anti-tamper check that runs when a real
;     session starts: with any byte of its code or import table changed (the breadcrumb detours,
;     the [Engine] push operand) the process ends itself 30 ms after the level has loaded
;     (ExitProcess(0x8000dead) from 0x794ed6, stack wiped). A direct boot never runs that check.
;     Engine keys therefore go in through the command line in memory (CmdAdd).
;  2. DisableSplashScreens. With it the frontend opens MainMenu > CampaignMenu at once and never
;     shows the press-start page, so the profile is never loaded and NOTHING IS SAVED (the save
;     reader 0x47c5f0 and writer 0x6587c0 both need the press-start flag 0x156b742).
;     Never send RETURN on CampaignMenu: it is 'Story Mode', and two RETURNs start the story (L00).

[KLHook]
ContinueAsserts=1
MaxDumps=4
MaxAsserts=200

[Auto]
Enable=1
Hooks=0
Nodes=0
CmdDrop=DefaultScene,AutoExit
CmdAdd=-o DisableSplashScreens -o AutoExit=900
StallMs=240000
MaxRunMs=1100000
LoadedMs=0
Unfocused=1
BlockReal=1
FirstChance=1

[Script]
; every key is followed by a wait for the window it must open; a wrong page ends the run (exit 26)
1=waitwin CampaignMenu 180000
2=wait 1500
3=tap ESCAPE
4=waitwin MainMenu 8000
5=wait 1500
; MainMenu opens with the focus on Story Mode; one DOWN = Arcade Mode (Button_Heist)
6=tap DOWN
7=wait 1200
8=tap RETURN
9=waitwin HeistModeMenu 8000
10=wait 2000
; HeistModeMenu opens with the focus on its Start button (-> HeistPlayMenu)
11=tap RETURN
12=waitwin HeistPlayMenu 8000
13=wait 2500
; the map selector to position 0 = Subway = slot F01, then what the gamepad layout's Accept sends
14=sel HeistLevel 0xceceec 0
15=wait 500
16=expect 0xceceec 0
17=msg HeistLevel StartGame
18=waitload 300000
19=log level loaded: the round should be starting
20=wait 15000
21=peek 0x168c630 settings-singleton (0 = no OnlineFragileAllianceSettings was initialised)
22=peek 0x168cc00 escape-monitor-singleton (0 = no OnlineEscVehicleMonitor)
23=peek 0x168a254 AIMonitor-count
24=peek 0x168a200 AIMonitor-events-sent (bytes 0,1,2; 00010000 = the round-start event 2 was raised)
25=peek 0x168e598+0x5c session-game-mode (4 = an Arcade / Fragile Alliance session; a direct boot has no 4)
26=peek 0x168e59c FA-sub-mode (0 in Arcade, set at kl2 0x502bee)
27=wait 12000
28=log walk: W 12 s
29=down W
30=wait 12000
31=up W
32=wait 6000
33=windows
34=pass 360000
