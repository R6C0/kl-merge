PuppetSpeed=300
PuppetTeam=3
; SnapKeepHook (recommended on): a snap of a hooked cop keeps its hook (pass / goal / lastSnap) instead of being released as "not seen" in the same pass.
;SnapKeepHook=1
; Track (recommended on, needs Puppet): every frame each hooked cop farther than TrackTol from the host's place (moved on by the list age + TrackLeadMs, speed from consecutive lists, clamp 900 u/s) is
;   placed there with the game's teleport; at most TrackMax per frame, once per TrackMs per cop. TrackBound=0 (recommended off) leaves 0xbb42ac-bound followers to the stock steer while nearer than SnapDist.
;Track=1
;TrackMs=50
;TrackMax=8
;TrackTol=40
;TrackLeadMs=60
;TrackBound=0
; CompareLead (recommended on): the 'vs host' line adds awake / >150 / >60 / p50 / p90 / worst against the lead-corrected host place.
;CompareLead=1
; BindFix (recommended off until measured): write [A+0x50c] := [A+0x8e0] for a cop whose two controller fields differ (TEST).
;BindFix=0
; TrackLocal (recommended on): Track placements call the teleport with both flags 0 (no animation reset, no send to the peers; the 2 s snaps keep 1,1). GUESS from the code reading, not live-proven.
;TrackLocal=1
; TrackKeepRot (recommended on): Track keeps the cop's own facing (the node's nine floats at +0) instead of the identity matrix; falls back to identity if they do not look like a rotation. GUESS.
;TrackKeepRot=1
; TrackBoundStall (recommended on): a hooked cop whose controller is a bound follower is left to the stock steer only while it converges (nearer than TrackBoundDist, or at least 15 units closer within TrackBoundStallMs); a stalled one (SP1g slot 574 sat 230 units off for 25 s) is placed. 3 reverts in 3 s hold it back to the steer for 3 s. 0 = old behaviour (skip below SnapDist).
;TrackBoundStall=1
;TrackBoundDist=100
;TrackBoundStallMs=1000
; TrackKeepY (recommended on): a placement keeps the cop's own y when the host's y is within TrackYTol units (same floor); removes the 30-110 unit Y pop from list age x vertical speed.
;TrackKeepY=1
;TrackYTol=150

[BotGate]
; Enable (recommended on): ONLINE ONLY (never offline / Arcade). A level whose Ally squads were staged with eAllTypes (tools/kl_botsonline.py) must still look stock online unless the HOST wants bots.
;   The hook swaps the level archive the game opens for a sibling of it: Fxx_Main.bots.zip when the host's [BotFill] OnlineHost=1, Fxx_Main.nobots.zip when 0 (a missing sibling = that archive as it is, logged).
;   The host's value reaches clients in klx_opts / UDP 27413 as b<n> ([HostOpts] Enable=1 is a PREREQUISITE on both peers; not heard = OFF (stock) + a WARNING line, never the client's own ini). Log lines start 'botgate:'. klslot.c.
Enable=1

[BotFill]
; OnlineHost (recommended off until the two-instance test passes): online the HOST is the only authority over the AI heisters (team Ally): it shares their places (UDP 27415, forces [Sync] Share on),
; a client mirrors them with the [Sync] Puppet code and owns none. It does NOT activate them: the level must keep the heister squads online (tools/kl_botsonline.py zip). klbotfill.c, re/bots_online_host.md.
OnlineHost=0
; OnlineTactics (recommended off until BO2 passes; needs OnlineHost=1; HOST only, a client never runs it): hook "puppeteer" for the Ally bots online, where the game builds no loot/board
;   tactics (0x7f6850 false for roles 2/3). Per bot: walk to the nearest money object, then to the escape van, with the soldier's own order 0x760e50. The loot tally is the hook's own (log only,
;   not replicated to clients; the stock round money is not touched). klbotfill.c, re/bots_online_fill.md.
OnlineTactics=0
; OnlineTacticsCarry (recommended 2): money stacks a bot takes before it heads for the van
OnlineTacticsCarry=2
; OnlineTacticsNear (recommended 150): game units within which a bot counts as having reached a stack / the van (van uses 2x)
OnlineTacticsNear=150
; OnlineTacticsTake (recommended off, GUESS): on a grab also write 0 to the money object's amount on the HOST (clients are not told, so they still see it)
OnlineTacticsTake=0
; OnlinePointBlank (recommended on: 2; 0..100 bullets per step, 0 = off; the value 2 is a GUESS): online a cop standing within 160 units hits with the point-blank step (~7560 hp, the police->crew factor is skipped
;   online), which kills a bot even at OnlineHealthMul 20. On the HOST of an online FA round the step on a BOT is scaled to this many bullets of the cop's gun (klbalance.c's point-blank wrapper, a vtable copy +
;   one float, SHIP-safe). Only the bots the puppeteer's census lists are touched (so it needs OnlineHost=1 + OnlineTactics=1); the list is what keeps human heisters (ZFFPlayer victims) out of it;
;   a human's step stays at the game's own. Works with [Balance] Enable=0. Log: 'botfill: online point-blank step x2 bullets on'.
OnlinePointBlank=2
; OnlineCopToBot (recommended on: 5; 0..100 PERCENT of a cop's ordinary bullet that a bot takes, 0 = off; 5 = the owner's CopToCrew 0.05 = Arcade level 2, 1 = stock Arcade level 1; the 5 is a GUESS for 'survives like Arcade'):
;   online a cop bullet costs a bot its full ~65 hp (Arcade multiplies it by the police->crew float 0x591b60, skipped online because 0x7f6850 is false for roles 2/3), so a squad killed 5600-hp bots in 3.5 s (BO8c).
;   On the HOST of an online FA round every bot of the puppeteer's census gets a private copy of the ZFFActor vtable whose slot 423 (0x61a980, the hit handler) scales the hit by this percent when the attacker is a
;   non-Ally ZFFActor (data writes only, SHIP-safe). Humans, bot-vs-bot, Arcade and the point-blank step (OnlinePointBlank) are untouched. Needs OnlineHost=1 + OnlineTactics=1. Works with [Balance] Enable=0.
;   With this on, OnlineHealthMul can come down: bot hits-to-kill = 280 x HealthMul / (65 x pct/100); stock Arcade level 1 = ~430 hits (HealthMul 20 + pct 5 = ~1720 hits, 4x tougher; HealthMul 5 + pct 5 = ~430).
;   Log: 'botfill: cop->bot factor ARMED' once, then 'cop->bot factor 5 s:' with hits scaled and bot hp lost (and ~ without the factor).
OnlineCopToBot=5
; OnlinePointBlankCap (recommended on: 250; hp per bot per second, 0 = off; 250 is a GUESS): BO10 showed bots (1400 max hp) losing 870-1100 hp in 0.2-0.5 s to 5-8 point-blank steps in a row (OnlinePointBlank).
;   Inside OnlineCopToBot's slot-423 wrapper the hp a bot takes from point-blank steps is summed per bot over a 1 s window; once the cap is reached the next steps' hit scale is cut (to a token 0.001) and restored after
;   the call. hp per unit of scale is measured from the bot's health before/after (starts at a GUESS of 75). Needs OnlineCopToBot > 0 and OnlinePointBlank > 0. Data writes only, SHIP-safe.
;   Log: 'botfill: OnlinePointBlankCap=' once, 'N point-blank capped' in the 'cop->bot factor 5 s:' line.
OnlinePointBlankCap=250
; OnlinePointBlankRefund (recommended on): BO11 let 869 hp through one 1 s window (the step's hp per scale unit jumped from ~75 to ~250). A step that still overshoots the window's budget while the bot
;   lives gets the excess back: health is written to (hp before the step - budget left), never above the hp before. A kill is not undone. Data write only. Log: 'hp refunded' in the 5 s line.
OnlinePointBlankRefund=1
; OnlineGuardTake (recommended off): 1 = a bot that has held 30 s with every free stack guarded (a live cop within OnlineTacticsGuard) walks to the nearest guarded one.
;   BO8c: all 5 holding bots were released into the squads at the same second and all 7 died within 71 s. Off = it holds until a stack is clear.
OnlineGuardTake=0
; OnlineVanCall (recommended on): the bots' van call (OnlineTacticsVan) accepts the hook's private rules vtable copy (klroundkeep.c). BO8c: the strict 0xbd2eb4 compare failed
;   against the copy, spent the call and the van never appeared. 0 = the old strict compare. Log: 'botfill: tactics: van: ... CALLED' or '... vtable ... vok 0 ...'.
OnlineVanCall=1
; OnlineVanState (recommended on): the bots decide "the van is here / I am aboard" from the vehicle state [rules+0x1dc] (3/4 = waiting) while standing at the exit trigger, not from the van's node
;   position (BO9: the ZAnimatedVehicle node stays at (0,0,0), so no bot ever boarded though the van cycled 1,3,5,7,0). The 60 s wait counts from the call; a van that left (7) ends it. 0 = old position test.
;   Log: 'van state A -> B (clock left ...)', 'BOARDED by van state'.
OnlineVanState=1
; OnlineLateExit (recommended on): seconds of round clock left at or below which a bot that carries money takes no new stack and goes to the van (0 = off). BO9: van call to leave is 24 s,
;   walks 2-3 m/s. GUESS 75 = 30 s door cutoff + 25 s walk + 20 s slack. Log: 'clock left ... <= OnlineLateExit'.
OnlineLateExit=75
; OnlineVanGather (recommended on): the first bot at the exit trigger no longer calls the van at once. Every living bot (also those still on a stack) walks to the box, and the van is called when all walking
;   bots are within OnlineGatherM of the box centre, or OnlineGatherMaxS seconds have passed, or the clock is at or below OnlineLateExit + 20 s. BO11: the carrier called at 189.8 s, the others were 28-41 m away and none boarded.
;   0 = the old rule (call at once). Log: 'van: gather: ...'. Calls and orders only.
OnlineVanGather=1
; OnlineGatherM (metres, GUESS 12): how close every walking bot must be to the box centre before the van is called. OnlineGatherMaxS (seconds, GUESS 25): the longest the gather waits.
OnlineGatherM=12
OnlineGatherMaxS=25
; OnlineVanHold (recommended on): online the game sees an empty box (the AI heisters have no crew records), so the waiting van (state 3, about 8 s) ran out or was shot empty (BO11: state 3 -> 6 after 1 s; [VanBlow] EmptyDelay also blows
;   an empty van on purpose). While a walking bot is within OnlineHoldM of the box the van's 'Invulnerable' byte (+0x21) is set to 1 and VanBlow's empty clock is paused; within OnlineHoldNearM the state timer [rules+0x1d8] is
;   kept at 3.0 s or more. Capped at OnlineHoldMaxS seconds per visit (then the van goes as the game decides), never when the clock is below 20 s, the byte is restored on any state change. [rules+0x1ee] is never written.
;   Data writes only. 0 = off. Log: 'van: hold: ...'. NOT run live.
OnlineVanHold=1
; OnlineHoldM (metres, GUESS 30): a walking bot this close to the box shields the van. OnlineHoldNearM (metres, GUESS 18): this close it also keeps the timer up. OnlineHoldMaxS (seconds, GUESS 15): the total hold per visit.
OnlineHoldM=30
OnlineHoldNearM=18
OnlineHoldMaxS=15
; OnlineGiveUpRetry (recommended on): a stack a bot gave up on (no 2 m of progress) is skipped for OnlineGiveUpRetryS seconds only, not for the whole round (BO12: 4 stacks blacklisted, bots idled 3 min). A stack with a live cop within OnlineTacticsGuard of it at give-up is not blacklisted at all (the guard rule holds the bots off it). 0 = permanent blacklist.
OnlineGiveUpRetry=1
OnlineGiveUpRetryS=45
; OnlineIdleVan (recommended on): a bot with nothing carried and no stack left at all for OnlineIdleVanS seconds (or any bot with no stack once the clock is at or below OnlineLateExit + 20 s) walks to the exit trigger and the van is called through the normal OnlineVanGather path. BO12: 0 grabs, so nobody ever called the van. A bot with no money aboard changes no tally. 0 = off.
OnlineIdleVan=1
OnlineIdleVanS=20
; OnlineFireStall (recommended on): the 12 s no-progress give-up clock pauses while a live cop is within OnlineTacticsGuard of the walking bot (pinned down by the game's combat, not stuck). The 90 s cap per stack still applies. 0 = off.
OnlineFireStall=1
; OnlineSkipDoorStacks (recommended on): stacks still behind a shut kick door (ZOnlineMoneyCtrl +0x5c, stock vault cases like DD01's) are not handed out; while only such stacks are left the bots get no order (their squad script may kick the door) and do not idle-call the van. 0 = off.
OnlineSkipDoorStacks=1
; OnlineBoxForce (recommended on): while the van waits (state 3) a bot that is walking to the escape box but is still outside it gets, after 4 s and every 4 s, an order straight to the box centre (BO13: the carrier stood at the exit trigger 3 m outside the box for the whole wait and never boarded). One log line per bot. 0 = off.
OnlineBoxForce=1
; OnlineBoxSlack (recommended 100): while the van waits (state 3), a bot that has stood within this many cm outside the escape box's frame for 8 s counts as inside and boards (BOS_DD02x2: bot 0 stood 0.5 m outside for the whole wait, the box centre is off the nav). 0 = off.
OnlineBoxSlack=100
; OnlineJoinCalled (recommended on): a bot carrying money whose van another bot already called walks to the exit while the van comes or waits (states 1-4), instead of waiting where it stands for the next call (BOS_DD04: 4 carriers stood 100 m off for the whole visit, 3/7 boarded). 0 = off.
OnlineJoinCalled=1
; OnlineExitSprint (recommended on): a bot walking to the exit or the escape box SPRINTS (the Defend move style stock levels give the last dash to the vehicle); undone when it goes back to looting. BOS_DD06: the bots walked the 180 m to the exit at ~0.7 m/s and missed the van, 0/7 boarded. 0 = off.
OnlineExitSprint=1
; OnlineExitCrowd (recommended 1200, cm): on a map with no escape box, a bot within this distance of the exit trigger for 5 s while the van waits counts as aboard (BOS_DD07: 7 bots crowd the trigger, 3 stood 2-10 m off its centre for the whole wait and missed the 3 m test). 0 = off.
OnlineExitCrowd=1200
; OnlineExitKeepGoal (recommended on): while a bot's Defend goal still runs toward the exit, the hook does not repeat the order every 6 s (a repeat re-pushes the running goal; BOS_DD06s: bots ran ~5.9 m/s but stood ~70% of the walk). 0 = off.
OnlineExitKeepGoal=1
; OnlineExitTrace (recommended off): log each walking bot's goal state, block place and flags every 6 s. 1 = on.
OnlineExitTrace=0
; OnlineExitDy (recommended 1200; BOS_DD06w: DD06's trigger floats ~10 m over its floor): how far (units, 100 = 1 m) above or below the exit trigger's centre a bot may stand and still count as at the exit (calls the van, boards). BOS_DD02r: DD02's trigger floats 6.2 m above its floor, so 400 never counted the bots that stood on it.
OnlineExitDy=1200
; OnlineVanRecall (recommended on): when the van has come and gone (state 7 -> 0) while a live bot is still out carrying money, that bot may call it again (at most 2 recalls per round, only with 40 s or more on the clock). BO14: a bot grabbed 800k 3 s after the call and was left behind. 0 = off.
OnlineVanRecall=1
; OnlineWaypoints (recommended on): when the ini has a section [BotFillWay_<SLOT>] with P1..P8 = "x y z" (floats, y = height), the AI heisters' walk to the exit trigger goes through those points in order first (next point within 3 m horizontally or after 15 s). <SLOT> = the slot the level plays in (DD02 installed through KLExpansion is F02). No section = no change. BOS_DD02: 7 bots stalled 139-166 m short of the exit. 0 = off.
OnlineWaypoints=1
; Example (commented out until a run shows it helps), DD02 ramp route from re/stock_map_bots.md:
;[BotFillWay_F02]
;P1=-333 5160 -13250
;P2=-727 5489 -10972
;P3=-483 5959 -8288
;P4=-24 6010 3262
; DD06 (slot F06) has a live route: see [BotFillWay_F06] at the end of this file.
; OnlineRampFire (recommended on): stock DD02's TriggerBox_make_the_ramp builds the ramp when a COUNTED player is inside; online bots are not counted, so the ramp never builds unless a human goes there (Arcade: the first bot above y 4646 fires it). With a section [BotFillRamp_<SLOT>] the host finds that ZTriggerBox ~5 s into the round (by Name substring or by Centre in its first 0x400 bytes), logs the candidates, and when an AI heister stands inside Centre +/- Half calls the trigger's fire routine 0x45f5d0 ONCE. Host only, NOT synced (clients may not see the ramp build: GUESS). No section = nothing happens. 0 = off. Log: 'botfill: ramp:'.
OnlineRampFire=1
; OnlineRampDry (recommended off): 1 = only log 'DRY would fire'; 0 = really call the fire routine (proven live by BOS_DD08r: F08's TriggerBox_Guards, 7/7 boarded).
OnlineRampDry=0
; Example (commented out until tested), DD02 ramp trigger from re/stock_map_bots.md (Centre / Half in world units, y = height):
;[BotFillRamp_F02]
;Name=make_the_ramp
;Centre=3 5846 -10822
;Half=2400 1200 10809
; OnlineBoxWalk (recommended on): once the bots called the van they walk to the middle of the level's ZAllyEscapeBox (found once per round by a read-only memory scan; the one nearest the
;   exit trigger) instead of standing at the trigger, ~570 cm from the DM01 box in BO9. "Boarded" (hook tally) then means: van state 3/4 and the box's own inside test (0x758cb0) is true.
;   0 = the old test (state 3/4 and the bot within 2*Near of the trigger). Without a box found it falls back to that too. Log: 'box scan:', 'walks to the escape box', 'BOARDED in the escape box'.
OnlineBoxWalk=1
; OnlineBoard (recommended off until the live test): a bot that is inside the escape box while the van waits is also removed with the game's own boarding call 0x89c890(actor) (what the
;   Arcade box does; it hides the bot's one-man squad). NOT run live: GUESS ~60% that it behaves online on the host, ~35% that the clients' copy vanishes too. Does not touch money, crew records or
;   [actor+0x8f0]. Needs OnlineBoxWalk=1. Log: '0x89c890 called' or 'refused'. Turn on for BO10 and watch the census ('N live Ally bot(s)') and the clients.
OnlineBoard=0
; OnlineBoxProbe (recommended on; log only): 'box probe:' per bot every 5 s while it walks to the box (distance, the game's inside test, van state) and 'van probe:' at every van state change
;   (positions of the vehicle group [rules+0x1e4] and boarding object [rules+0x1e0], distance to the box centre).
OnlineBoxProbe=1

; the TEST build only (klauto.c, needs [Auto] Enable=1): PollLossMs (recommended on) = no keyboard poll for this many ms -> ONE "pollloss:" log line per episode (ms since the last poll, foreground window, our window iconic/visible/enabled,
;   keyboard acquire + cooperative-level state, the last DirectInput calls, the main thread EIP and stack returns), then "pollloss: back after N ms" when polls resume. 0 = off. Diagnostic for bench N9_DM01d (polling stopped on 5 instances at once).
[Auto]
PollLossMs=5000

