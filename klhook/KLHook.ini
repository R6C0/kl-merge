; OnlineGetUpBeacon (recommended on; proven live: BP18 + BP19 11-01, shipped ship1101; 0 = off): 1 = the DOWNED machine tells the host it is down (UDP 27415 'KLSYD', once a second while down, 3x on getting up) so the host's OnlineGetUp pass sees a joiner go down:
