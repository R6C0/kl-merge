OnlineFillSquads=0
; the crew records (who is a bot, in play / aboard / dead, heist stage, money, traitor) in KLHook.log:
; 0 = none, 1 = when something changed and every 10 s, 2 = every second
;Log=1
; BACKSTAB, the game's own rule. Stock: no bot may betray on Arcade levels 1-3 (1 on 4-5, 2 on 6-8, 3 on 9-10, 4 on
; 11) and it needs 7 points of 9 (far into the heist + the bot rich + you poor). Tune=1 writes: at least Traitors
; allowed on every level and Limit points; Retaliate = damage you may do to a bot before it turns on you (0 = stock:
; 100 on level 1 down to 25 from level 7). Per level: Traitors.<1..11>= and Limit.<1..11>=
;Tune=1
;Traitors=1
;Limit=6.0
;Retaliate=0
; BACKSTAB on demand: percent per round that one bot is picked; it turns when it has reached heist stage
; BackstabStage (1 in the bank, 2 out of it, 3 at the vehicle) with BackstabMoney or more, for BackstabDelay seconds
;Backstab=25
;BackstabStage=2
;BackstabMoney=250000
;BackstabDelay=20
; PAY THE DRIVER: percent that a bot aboard for BribeDelay seconds with BribeMoney or more pays half of it and the
; vehicle leaves at once - only while you are in play and not aboard
;Bribe=30
;BribeMoney=500000
;BribeDelay=4
; LEAVE WITHOUT YOU: percent (once per vehicle) that it leaves when every bot still in play is aboard and you are
; farther than LeaveDistance (100 = 1 m) from the boarding point for LeaveDelay seconds
;Leave=50
;LeaveDistance=4000
;LeaveDelay=3
; BLOW THE VAN UP - the one part that CALLS a game rule; try Van=1 first. 1 = 'heavily damaged' (it drives off at
; once), 2 = destroyed (everybody aboard dies). A traitor bot standing at the waiting vehicle with somebody aboard,
; for VanDelay seconds, VanChance percent; VanLeftBehind=1: also a bot left behind while the vehicle drives out
;Van=0
;VanChance=50
;VanDelay=5
;VanLeftBehind=0
; ESCORT (klescort.c; NOT RUN IN THE GAME): 1 or 2 AI heisters stay near YOU and fight beside you, the others keep
; their routes. One game call per order (the soldier's own 'defend this place'), no write, never a teleport. The
; escort is called when you are farther than EscortFar (100 = 1 m) from it, to a place EscortSide beside you; it is
; let go when the vehicle waits (EscortUntil=1: already while it drives in) and then sent to the boarding place.
; EscortDry=1 chooses and logs but calls nothing - the first live check. Needs Enable=1 above.
;Escort=0
;EscortDry=0
;EscortFar=800
;EscortSide=300
;EscortRetarget=500
;EscortEvery=2
;EscortUntil=3
;EscortStage=0
;EscortBoard=1
;EscortRefill=0
;EscortRecord=-1
;EscortLog=1
; BoardAll=1: nobody is left held by loot - while the escape vehicle waits, an AI heister at heist stage 1 or 2 that has
; neither moved 1 m nor earned anything for BoardAllStill seconds gets heist stage 3 (ONE byte of its crew record; the
; game's loot tactic lets go at stage 3 and its board tactic takes the bot to the vehicle). BoardAllStill=0: every bot
; at stage 1 or 2. BoardAllStage=0: nothing is written, the pass only logs. BoardAllOrder=1: also one order to the
; boarding place per visit. Works without Escort. EscortDry=1 logs only. DO NOT combine with Van / VanLeftBehind.
;BoardAll=0
;BoardAllStill=15
;BoardAllStage=1
;BoardAllOrder=0
; FollowOut=1: THE CREW FOLLOWS YOU OUT (klescort.c section 3, re\bots_follow_out.md; NOT RUN IN THE GAME). Stock Arcade
; shoots every AI heister that is not aboard while the vehicle drives out with you (one about every second). With
; this key, once YOU have heist stage 3 (you stood in the exit trigger: the vehicle is called) and carry FollowOutMoney,
; every AI heister in play that is no traitor gets heist stage 3 (one byte: its loot tactic lets go while the vehicle
; waits, its board tactic runs to it) and, while the vehicle drives in and is 2 s or more away, one order to the
; boarding place. FollowOutAfter = seconds between your stage 3 and the call. FollowOutOrder=0: the byte only.
; FollowOutHold=N: the driver waits for them - while you sit aboard and called crew still COMES (2 m nearer to the
; boarding place in 2 s; a bot that stands, fights or walks the other way does not count), the vehicle's timer
; gets up to 5 s more each time it falls under 2 s, N seconds a visit at most (the float and the 5 s of the game's own
; 'hold the driver' rule, written more often than that rule's once; 0 = never; 25 is what the bank's crew needs
; once BoardNear makes it walk to the van - first bot aboard 24 s after your call, live runs N1 / N1b).
; FollowOutShield (default 2): A HELD VAN WAS SHOT TO PIECES WITH THE HUMAN ABOARD in the hold's first two live runs
; (2026-10-11: destroyed 21 s after it began to wait; the game then kills everybody aboard - stock lets it stand
; 8 s, and even that is not always enough). So from the first held second the vehicle takes no hit: 2 = until it is
; gone (after a hold the van cannot be lost: less risk than stock), 1 = until it drives out (the drive-out is the
; game's again, with a van the game's scripted hits may have worn to a tenth: more risk than stock for 8 s),
; 0 = no shield, the form that killed. YOUR CHOICE between 2 and 1. The first ~6 s of a wait, before the first hold,
; are as in stock either way. One byte of the vehicle's own health object (its 'Invulnerable' flag), taken back
; 3 = from the first half second of EVERY wait, held or not, anybody aboard or not, until it is gone (the Vault and the club:
; the arriving police destroyed the waiting van; NOT RUN IN THE GAME).
; afterwards; if it cannot be set - or the van's health object is not found - the driver is not held. Also for
; WaitForYouHold. 25 is the bank's value (the only map measured). NOT RUN IN THE GAME.
; FollowOutSpare=1 (works alone): whoever is still not aboard when it drives out is NOT shot - left in play; the
; round ends 3 s after your escape as ever. FollowOutDry=1: every line, nothing written or called - the first live
; check. Needs Enable=1 above. Not with VanLeftBehind=1. Your stage is never taken back: step into the exit box, go
; back inside, and the crew leaves without you.
; TWO PRICES of FollowOut / FollowOutHold (FollowOutSpare has neither):
; - YOUR CUT: at the round's end the game pays every heister who escaped and is no traitor the SAME share - what they
;   carried together, over their number. Every bot these keys get aboard joins that split: more for you if it carried
;   more than the rest, less if less. (Those shot or left in play get nothing, with or without the keys.)
; - TRAITORS: a called bot counts as 'at the vehicle' for the game's own traitor tactic. On Arcade level 4 and up
;   a bot that was inside the building, where it could not turn, now can (with Tune=1: on every level, with less money).
;FollowOut=0
;FollowOutDry=0
;FollowOutMoney=1
;FollowOutAfter=0
;FollowOutOrder=1
;FollowOutEvery=2
;FollowOutHold=0
;FollowOutShield=2
;FollowOutSpare=0
; THE CREW KEEPS MOVING, WAITS FOR YOU, WALKS TO THE CAR (klmove.c, re\bots_move.md; NOT RUN IN THE GAME). Needs Enable=1.
; Restless=N (seconds; try 5): an AI heister that has stood N s without moving 1 m or earning -
;   on a money object that pays nothing (within RestlessLootNear of it, RestlessLoot seconds): FED UP - the object is
;   no loot candidate for any AI heister for RestlessLootBack seconds (doubled each time it sours again; back at once
;   when a case is opened or somebody takes a part; YOU can always take it; only a bot inside the heist - stage 1 or
;   more - that is not under fire and has no grab running is judged);
;   more than 3 m from the place its route ordered and not under fire: that order is given again (the third time:
;   beside you; six orders for one place at most).
;   A bot AT its ordered place is on a meant wait (a gate, a cover hold, the place beside the van) and is left alone -
;   unless RestlessHold=N: then it shifts RestlessPace round that place every N s (not under fire, not in an escape box).
; WaitForYou=1: no vehicle is called before you have heist stage WaitForYouStage (3 = only YOUR step into the exit
;   box calls it, 2 = once you have left the building, 1 = once you are inside) - a bot in the exit box gets its stage
;   and waits; released after WaitForYouMax s from the first bot that stood ready, and when you are dead / a fed /
;   aboard. WaitForYouFloor=N: no vehicle in the round's first N s whatever your stage. WaitForYouHold=N: while a
;   vehicle waits and you COME (2 m nearer in 2 s, or within 15 m), its timer gets up to 5 s more under 2 s, N s a
;   visit at most. THE ROUND CLOCK IS RED while the crew waits (the byte is also the HUD's 'last vehicle' colour), and
;   the crew stands in the open at the vehicle's stop meanwhile. The owner did not ask for this key.
; BoardNear=N (100 = 1 m): an 'ally escape box' farther than N from the vehicle's boarding place takes no AI heister
;   aboard (today a bot in such a box 43 m away in the bank's yard is 'aboard' at once). 1500 = the boxes beside the
;   van still work; 300 = no box works, a bot must run to the vehicle's doors (its own board tactic, within 3 m).
;   BoardNearVisits=N: from the Nth visit of a vehicle on every box works again (nobody is stranded for good).
;   BoardNearStage=1: a bot under heist stage 3 standing at a denied box gets stage 3, so that it walks.
;   BoardScanEveryRound=1: the boxes are looked for (a 125 - 140 ms standstill) at EVERY round's start, as before
;   2026-10-23; default 0 = the first round's result is kept while the scene stays and no level archive is opened.
;   COST: a bot the far box used to save has 8 s a visit to walk; when the vehicle leaves WITH YOU ABOARD the game
;   shoots whoever is still in play. LIVE 2026-10-11 (the bank): in a plain visit nobody of the crew arrives. Use
;   it with FollowOutHold=25 (the driver waits for them; shielded, see FollowOutShield) and FollowOutSpare=1.
; BoardReach=N (100 = 1 m; proposed 100; least 50): an 'ally escape box' takes an AI heister aboard only when THAT BOT
;   is within N of the vehicle's boarding box - the box YOU press 'get in' in (the van's rear doors, 1.9 x 1.6 m; the
;   helicopter's pad). N is measured from that box's EDGE, on any side: you must stand inside it, a bot may stand N
;   outside it (200 = the 3 m from the doors' middle at which the game's own board tactic takes a walking bot anyway).
;   BoardNear looks at a box's centre: the boxes beside the vans reach 8 - 13 m from the doors, and a bot vanished
;   there. With BoardReach set, BoardNear is NOT needed (leave it 0).
;   BoardReachDoors=1: a called bot (heist stage 3) that near the doors (3 m at most, whatever N) is taken aboard
;   there (the game's own board tactic may be off for a bot that already stands on the doors' piece of floor).
;   BoardReachOrder=1: a called bot that stands within 30 m of the doors is sent to them, once a visit.
;   BoardReachVisits=N: from the Nth visit on the boxes work as in stock again (default 3; 0 = never). The round's
;   last vehicle always works as in stock. Until then a traitor, a bot at heist stage 0 and one more than 30 m off
;   are moved by nothing of this key and may stand in the box. Acts for a police human too.
;   A bot in a box beyond the reach gets heist stage 3 if it has less (BoardNearStage=1). COST as BoardNear's: the
;   walk takes longer than the vehicle's 8 s - use it with FollowOutHold=25 and FollowOutSpare=1. NOT RUN IN THE GAME.
; MoveDry=1: every line of the four, nothing written, called or wrapped - the first live check. MoveLog=2: more lines.
;Restless=0
;RestlessLoot=
;RestlessLootBack=30
;RestlessLootNear=200
;RestlessHold=0
;RestlessPace=350
;RestlessSkipDowned=0 ; 1 = (NOT RUN IN THE GAME) a DOWNED heister (actor+0x64c, as klbotdown.c) gets no Restless order / snap / hop, and its stand-still clock restarts
;                      ; when it is up. 3f saw bot 4 ordered while down (02:09:14) and downed/up cycles followed. Recommended default: 1 (an order to a downed bot has no use).
;RestlessSnap=0 ; 1 = (audit 1018 E2.2, NOT RUN IN THE GAME) a bot whose chain place was ordered 6 times (the 'left until its chain orders another place' state of
;                 ; Restless) without arriving is put AT that place with the game's own actor teleport. Needs Restless. Refused when the human is near,
;                 ; the bot is held as a shield, klt_refuse() says no, or the place is on another floor / out of range.
;RestlessSnapRange=4000  ; GUESS (game units, 100 = 1 m): farthest place a bot is snapped to
;RestlessSnapHuman=1500  ; GUESS: not when the human is within this of the bot or the place
;RestlessSnapMax=2       ; GUESS: snaps per bot and round
;RestlessHop=0   ; seconds (5 or more; try 6): a bot at its own hold place that long goes to a COVER PLACE of its gate (the level's KLJoin.ini [Hops],
;                 ; tools/kl_fa_bots_rt.py hops <source> <build> --hops 8) instead of a random side; not under fire, not in an escape box. Needs Restless.
;                 ; NOT RUN IN THE GAME (re/bots_active.md). Without [Hops] in the level's file it does nothing; RestlessHold=N is then the old shift.
;WaitForYou=0
;WaitForYouStage=3
;WaitForYouFloor=0
;WaitForYouMax=150
;WaitForYouHold=15
;BoardNear=0
;BoardNearVisits=3
;BoardNearStage=1
;BoardScanEveryRound=0
;BoardReach=0
;BoardReachDoors=1
;BoardReachOrder=1
;BoardReachVisits=3
;MoveDry=0
;MoveLog=1

; One dial for what a bullet costs whom in an Arcade round (klbalance.c; re\balance.md). Off as shipped. Arcade only,
; and never on a stock level: the game's own numbers are kept and come back when the session ends or the level is
; stock. IN THE OWNER'S GAME since 2026-10-10: the six factors and the health part. NOT RUN YET: CrewOffStage, the
; PointBlank keys.
[Balance]
Enable=0
; 0 = no log, 1 = once per round object: the stock table, the player blocks, your health object, what was written;
; 2 = also a line for every loss of health ('you lost 6.1')
;Log=1
; 0 = stock, the default (Arcade level 1: a policeman's bullet costs you a tenth, yours costs him double), 1 = less
; lopsided, 2 = the same for everybody + your health 550 -> 400, 3 = the same + your health 280 (an AI heister's)
;Risk=2
; 1 = a later Arcade level is never easier than stock, 0 = the dial's numbers on every level
;Ramp=1
; single numbers, each beats the dial: damage factors ...
;CopToYou=1.0
;YouToCop=1.0
;CopToCrew=1.0
;CrewToCop=1.0
;CrewToYou=1.0
;YouToCrew=1.0
; ... and what is LEFT of an AI heister's hits on police while he is at another heist stage than you (stage: not in
; yet / inside / out again / at the vehicle - so with you outside and the crew inside, or the crew gone ahead to the
; van). The game: 0.5 on Arcade levels 1-3, falling to 0.1 on 10-11. 1.0 = he hits the same wherever you are;
; -1 = the game's own, also under a Risk. Risk=1 sets 0.75, Risk=2 and 3 set 1.0. With Ramp=1 it is lowered on later
; levels so that CrewToCop x this is never more than in the stock game (Risk=2: 1.0 on levels 1-3, 0.76 / 0.48 / 0.39
; on 4-6, the game's own from 7); set alone, without a Risk or a lower CrewToCop, it then changes nothing: add Ramp=0.
; One number of 0 .. 20 with a decimal POINT: '0,75' or any other text is ignored (the log says so), not read as 0
;CrewOffStage=1.0
; ... your health as a factor of what the game gives (550 + armour), and how it comes back (seconds)
;PlayerHealth=0.73
;RegenDelay=8
;RegenTime=8
; ... and the POINT-BLANK RULE (re\melee_damage.md; NOT RUN YET). What looks like a guard's melee is the game's own
; rule for a soldier whose target stands within 1.6 m: at every step of his burst (0.1 .. 0.2 s) the target gets one
; hit of his gun TIMES 100. The factors above multiply it like any bullet - CopToYou=0.02 still leaves a Type 79
; guard 151 a step, Risk=2's 1.0 makes it 7,560 - so it has keys of its own, by VICTIM: how many ordinary bullets of
; his gun one step is worth. 100 = the game's own (the steps are then only seen and logged), 1 = one bullet,
; 0 = none; no key or a negative number = left alone. No Risk sets them, Ramp does not touch them. One number of
; 0 .. 100 with a decimal point. ToCop = what an AI heister's own step costs a policeman. Needs [KLHook] Tick=1.
;PointBlankToYou=2
;PointBlankToCrew=2
;PointBlankToCop=100
; ... LogCrewHits=1 (default 0): one KLHook.log line for every drop of an AI heister's health in an Arcade round (stock
; level or not; nothing is written): record, health before -> after, place, your distance, the nearest other heister,
; and WHO COULD HAVE DONE IT: the soldiers whose target is that heister (crew / TRAITOR / Enemy, metres), the nearest
; living non-Ally soldier, the nearest Ally aiming at him (friendly fire?), 'NO AIMER' on a big loss (blast / fall / script?
; or YOUR shots). Also a line at a death; at most 6 lines a second and 400 a round, then a sum. A guess from targets, NOT
; who really shot or with what (re\crew_hits.md 6). Needs Enable=1 and [KLHook] Tick=1.
;LogCrewHits=0
; ... EVERYBODY A BIT MORE HEALTH, AND A FED WHO IS NOT A ONE-MAN ARMY (track X2, 2026-10-11; re\balance.md 11; NOT RUN YET).
; Tough = one factor on every maximum health of the round: every NPC (police, guards, AI heisters, civilians), you as
; a heister and you as a fed. No damage factor moves, so who needs how many hits against whom keeps its ratio and
; every fight takes Tough times the hits (1.5: you 550 -> 825, an AI heister 252 -> 378, a policeman 90..158 ->
; 135..237). 0.25 .. 10; 1 or no key = off. The log says 2 s into a round what the AI heisters really got.
; NOT scaled by it (absolute numbers): the knock-down's trigger ([Down] DownHealth: set it x Tough yourself, 120 at
; 1.5), [Down] MinHit / Burst, a point-blank step, fixed-damage blasts. With FedMirror=0 a fed alone gets no Tough.
;Tough=1.5
; While YOU are police (come back as a fed; FedMirror=1): what YOUR bullet costs an AI heister (no key = YouToCrew's
; number) and what a heister's bullet costs YOU (no key = CrewToYou's). Today (Risk=1) that is 1.0 against 0.5 with 550
; health against 252: at 5 / 15 / 30 / 50 m you kill a heister with 4 / 4 / 5 / 7 body hits of the rifle or ONE head
; shot, he needs 19 / 22 / 27 / 37 on you. 0.4 against 1.0 makes it 9 / 10 / 13 / 18 against 10 / 11 / 14 / 19.
; NOT SEEN YET that an AI heister shoots a police human at all (it is read in the exe only): live check TH of
; re\balance.md 11.7 comes first - if they do not, CrewToFed changes nothing and [Fed] Hunted is owed.
;FedToCrew=0.4
;CrewToFed=1.0
; What a head counts for YOUR bullet on an NPC (the game: 10 = one shot kills anybody; an NPC's bullet never gets a
; head factor at all). FedHeadShot while you are police, HeadShot while you are a heister (police, guards and turned
; heisters alike). 1 .. 10; no key = the game's 10. With FedToCrew=0.4, 3 = 3 / 4 / 5 / 6 head shots at 5 / 15 / 30 / 50 m.
;FedHeadShot=3
;HeadShot=10

; The expansion's Fragile Alliance / Arcade HUD, Version 2 (klhud.c; re\hud_hook.md) = the owner's draft: top left the
; crew list ('DEAD MEN  5 / 8', a row a heister with the cash he carries: you blue, a traitor orange, dead faded red,
; escaped grey), top right under the game's own clock 'ROUND n  LIVES n' and the money box TOTAL / LOOT / REWARDS; the
; stock top-left block hidden while ours draws. Arcade only, and only on a level that is not stock unless Stock=1.
; VERSION 2 HAS NOT RUN IN THE GAME (re\hud_hook.md 5 has the live checks in order). Off as shipped.
[HUD]
; HideSrc=1: the old (stock) player list is skipped at its Render (Tab / Alt+Tab cannot restore it). HideOnline=1: also in online matches (no crew list there until the online reader exists).
HideSrc=1
HideOnline=1
; OnlineProbe=1 (TEST build only): read-only dump of the online FA records, lines 'hudprobe:'. OnlineCrew=1: online reader handles (records/count/score), off until the layout is proven.
OnlineProbe=0
OnlineCrew=0
; 2026-10-26 online ports on klonline_read.c (all default 0 = off until benched; need [Online] Read=1): OnlineNames=1 heister character names in the crew list, OnlineKilled=1 killer's name in KILLED BY, OnlineRound=1 'ROUND n OF m'.
OnlineNames=0
OnlineKilled=0
OnlineRound=0
; OnlineFeed=1 kill-feed line under REWARDS from seat deaths (KillerIndex), OnlineSkulls=1 death-mark skulls on your row + lives digits in the round line, OnlineLoot=1 loot bar under TOTAL,
; OnlineTab=1 the Tab card online, OnlineVan=1 the Arcade van/escape card from the rules' mirrors. All 0 (recommended off until benched); all need [Online] Read=1 and OnlineCrew=1.
OnlineFeed=0
OnlineSkulls=0
OnlineLoot=0
OnlineTab=0
OnlineVan=0
; 2026-10-26 arcade port step 2 (all 0 = off, recommended off until benched; need [Online] Read=1 and Scoreboard=1 / Board=1 BoardCard=1):
; OnlineBoard=1 the Arcade round-over card (klhud_board2.c) in an online round: ROUND n OF m, your result, KILLED BY the killer's heister name, every seat's fate and payout, kills, rewards, total, the continue ring.
; OnlineIntro=1 two lines under the pre-round card: ROUND n OF m, players, minutes, YOUR HEISTER <name>.
OnlineBoard=0
OnlineIntro=0
; UccHide (recommended on): in Undercover Cop rounds our crew list does not show the undercover cop as a fed to heisters (his own row and police-side viewers still see it). 0 = off.
UccHide=1
; Online=1: in a private match / online FA round (net role 2 or 3) draw the LOCAL, cosmetic parts only (the round watch, the weapon dial; the stock player list stays).
; Default 0: never run in a live lobby (re/hud_online.md). Needs a Dead Men level baked with the HUD pictures; Steam stats stay blocked as before.
Online=0
; the vehicle marker in the world (klhud_tracker.c): Tracker=1 shows it only within TrackerNear metres (0 = always). TrackerScale stays 1.0
;   (below 1 it pulls the marker apart rather than shrinking it); the ball itself is baked smaller (tools/kl_hud_marks.py VEHICLE_DISC)
Tracker=1
TrackerNear=30
TrackerScale=1.0
; every marker of the element (ball / escape vehicle / pictures) obeys TrackerNear; TrackerBand = m inside the limit before a hidden one shows again;
; TrackerDeclutter=1 = when two markers overlap on screen only the nearer one draws (TrackerSepW=48 / TrackerSepH=56 = the box in virtual px)
TrackerBand=2
TrackerDeclutter=1
Enable=0
; 1 = also on a stock level (the layout only: the look - font, brush pictures - is level data)
;Stock=0
; 0 none, 1 on / objects made / stock block hidden / faults, 2 + every text change and the render counters
;Log=1
;Crew=1
;Money=1
;Round=1
; 1 = the stock top-left block is hidden while ours draws (0 = both drawn on one place: the first test run, comparisons)
;HideStock=1
; how a text is drawn: 1 = the hook's own Draw call (the 16:34 fix, not run), 2 = through the stock clock's Render (seen
; in the owner's probe round; every text gets a shadow; draws only from GO on, the stock block stays in the countdown)
;Draw=1
; drop shadows under the texts (the clock has them)
;Shadow=1
; 'TRAITOR' / 'OUT' / 'FED' after the name; the rows' cash as $540K / $1.2M (0 = $540,000)
;Tags=1
;CashShort=1
; 1 = the TOTAL value in the game's headline font (its size on screen was never seen)
;TotalFont=0
; THE PICTURE PARTS (never run; PicTest / Grid decide them): 1 = the painted rule, the own row's chalk block and a
; traitor's orange block with dark letters, the strike-through of a dead row, the framed bar under TOTAL
;Plates=0
; 1 = a picture's place is its middle (a guess), 0 = its top-left corner
;PicAnchor=1
; 1 = three test pictures at y 500: a coral bar 200 x 24 asked for at x 400, a chalk square at 700, the car icon at 900
;PicTest=0
; 1 = every box of the layout labelled with its corners (virtual 1280 x 720 pixels), marks at (640, 360), (0, 500),
; (1280, 698); with Plates=1 also 1 px outlines and a cross at (640, 360). 2 = and the draft's eight sample rows
;Grid=0
; 1 = every 5 s the render instance of the stock clock beside our first text's ('SAME SHAPE' = ours is on the HUD plane)
;Probe=0
; places on the game's 1280 x 720 virtual screen; -1 = from the game's inset (5 % = 64 / 36 px): the crew list's top-left
; corner and width, pixels a row; the money box's RIGHT edge, top and width; the round line's top
;CrewX=-1
;CrewY=-1
;CrewW=211
;Row=24
;Rows=12
; Rows12=1 (default 1, recommended on): the in-round crew list (and the Arcade round-end scoreboard) shows up to 12 players instead of 8, as many rows as there are
; players present; the local player always has a row. 0 = the old 8-row cap. Scoreboard with 9..12 rows: row pitch shrinks (GUESS layout, not seen live).
;Rows12=1
;MoneyX=-1
;MoneyY=-1
;MoneyW=211
;RoundY=-1
; the texts' layer byte (shadows one below, plates two below; 15 = the clock's)
;Layer=13
; -1 = the game's 5 % inset stays; 0.026 = the draft's margin, written to [0xceeebc] once per level: the game's own
; clock and ammo panel move with it, and so do our blocks; the game's value is put back at the next scene change
;Inset=-1
; 1 = a gun that shows a Dead Men look (KLGuns.ini beside the level: MP5 on the Zastava ...) is named as the look under the
; weapon dial, as the shop sells it (tools\kl_hud_shop.py). Needs Weapon=1; works with [Guns] on or off (klgun.c)
