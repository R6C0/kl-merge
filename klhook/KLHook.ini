;   50 m he dies of 4 / 4 / 5 / 7 body hits of your rifle (one head shot at any range), you of 7 / 8 / 10 / 14 of his.
;   0.6 = 6 / 7 / 9 / 12. The police's hits on the crew are CopToCrew: not touched by this.
;YouToCrew=0.6
