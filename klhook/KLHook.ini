OnlineNames=1   ; (recommended on) proven live: CE27_ALL2D..G
OnlineKilled=1   ; (recommended on) proven live: CE27_ALL2D..G
OnlineKilledAI=1   ; (recommended on) proven live: CE27_ALL2D..G
