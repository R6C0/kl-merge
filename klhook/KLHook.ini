; yet / inside / out again / at the vehicle - so with you outside and the crew inside, or the crew gone ahead to the
; van). The game: 0.5 on Arcade levels 1-3, falling to 0.1 on 10-11. 1.0 = he hits the same wherever you are;
; -1 = the game's own, also under a Risk. Risk=1 sets 0.75, Risk=2 and 3 set 1.0. With Ramp=1 it is lowered on later
; levels so that CrewToCop x this is never more than in the stock game (Risk=2: 1.0 on levels 1-3, 0.76 / 0.48 / 0.39
; on 4-6, the game's own from 7); set alone, without a Risk or a lower CrewToCop, it then changes nothing: add Ramp=0.
