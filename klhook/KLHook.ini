;PlayerHealth=0.73
;RegenDelay=8
;RegenTime=8
; ... and the POINT-BLANK RULE (re\melee_damage.md; NOT RUN YET). What looks like a guard's melee is the game's own
; rule for a soldier whose target stands within 1.6 m: at every step of his burst (0.1 .. 0.2 s) the target gets one
; hit of his gun TIMES 100. The factors above multiply it like any bullet - CopToYou=0.02 still leaves a Type 79
; guard 151 a step, Risk=2's 1.0 makes it 7,560 - so it has keys of its own, by VICTIM: how many ordinary bullets of
; his gun one step is worth. 100 = the game's own (the steps are then only seen and logged), 1 = one bullet,
