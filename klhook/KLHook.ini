[Grades]
; klhud_grades.c + klgrades.h (2026-10-27, NOT run in the game): the player's RANK (Dog Days' criminal ranks, experience -> rank = kl2.exe 0x5103e0) and an end-of-round letter GRADE.
; 0 = off (recommended off until benched). Badge/RankUp/Letter each need Enable=1; RankUp and Letter draw on the round-over card ([HUD] Scoreboard=1, online also OnlineBoard=1 and [Online] Read=1).
Enable=0
; a badge before every crew name (R5 or [THUG]); your rank is from your profile, the others online from the server's Experience (GUESS: S+0xc8)
Badge=0
; 'RANK UP <rank>' on the round-over card when your rank rose during the round
RankUp=0
; a GRADE column: S / A / B / C / D per player (table below)
Letter=0
; 0 = R5 (the game's Rank 1 = Mastermind ... Rank 8 = Mugger), 1 = [THUG]
BadgeStyle=0
; 0 = Dog Days' rank names, 1 = Dead Men's Seven (Kane at the top)
NameSet=0
; online others: 0 = from Experience (S+0xc8) through the thresholds, 1 = S+0x17c Rating as the rank (GUESS both)
Source=0
; rank 0..7 shown for AI heisters; -1 = no badge for bots
BotRank=-1
; 1 = LOG ONLY: every online seat's raw Experience / Rating every 5 s, so a bench decides Source
Probe=0
