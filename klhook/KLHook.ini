;     PromptPulse=0   1 = the bar flashes the game's red for 0.12 s at every press; 0 = always white, as the game's
;                     break-free bar. (The game's own look exactly: PromptStyle=2 PromptPulse=0)
;   WHILE YOU ARE KNOCKED DOWN: NO SHOOTING, NOT INVULNERABLE, POLICE HURT YOU LITTLE, HEISTERS IN FULL (track R8,
;   re/player_down.md 14; NOT RUN IN THE GAME). NoFire, Vulnerable and DownFromCop are on by themselves when Flop
;   is set; with Flop=0 the game's own down (you crawl and shoot, full price) stays unless a key is set.
;     NoFire=1        while you are down - the dive, lying, the rise - the fire button and the precision aim are not
;                     read (the two mask bits the game itself sets on a player held as a human shield). You can
;                     still look round and tap to get up. 2 = you may aim, not fire. 0 = fire is open (as it was:
;                     the game's fall never masked it). Melee is off for a downed man by the game itself; a THROW
;                     (the grenade button) has no mask bit of its own and is NOT gated - not read whether one can
;                     start on the floor (NoThrow below)
;     Vulnerable=1    Flop=1 / 3 only. 1 = hits COST in the knock-down (the flop had stretched the game's 0.7 s of
;                     'the fall is free' over the whole clip). 0 = nothing can hurt you until you stand, as before.
;                     It WAITS for the two factors and the point-blank cap below to stand; if one cannot (the
;                     log says which) hits stay swallowed, as before
;     DownFromCop=0.15  what a POLICE bullet costs you while you are down, as a share of what it costs you standing
;                     (a GUESS; 0.25 at first). The owner's Risk=1 (police -> you 0.5, health 550): a rifle / SMG
;                     bullet is 28 - 48 standing = 4 - 7 on the floor; you go down with 80 .. 220 health, so a
;                     typical rifle (36 standing, 5.4 on the floor) needs 15 - 41 bullets to finish you there
;                     instead of 3 - 7; a police pistol 3 - 14 instead of 1 - 2 (0.25 = 9 - 24 / 2 - 8, 0.1 =
;                     23 - 62; worked out, not seen). 1 = the standing price
;     DownFromCrew=1.0  the same for an AI HEISTER's bullet (a traitor, a backstabber, a grudge): 1 = full, he can
;                     finish a downed man as if he stood. The game picks one of the two by the attacker's team at
;                     every bullet
;     DownPointBlank=0.5  POINT-BLANK: a guard firing within 1.6 m deals a HUNDRED bullets in one step, 5 - 8 steps
;                     a second; even x 0.15 that kills a lying man at once. While you are down a step on you is
;                     worth this many bullets instead (a GUESS: half a bullet a step = about a guard who fires).
;                     -1 = the hundred stays. Needs [Balance] Enable=1: the hit is re-scaled by klbalance.c's
;                     point-blank wrapper, which this key switches on (it has NEVER RUN in the game)
;     CooldownCredit=1  the pause before you can be floored again (Cooldown) counts from when you WENT DOWN, as it
;                     did before Vulnerable. 0 = it starts when you are up (a hurt man who stands cannot be
;                     floored for the whole Cooldown: the next hits kill)
;     NoThrow=0       a TEST key: 1 = the throw button is written 'up' while you are down (only if a throw turns
;                     out to start on the floor; not known to work)
;                     A blast costs what it always did. Close combat's flat 50 is not scaled by any of these.
;                     WITH [Balance] KEYS SET (Risk ...) klbalance.c owns the damage table and must carry the FIVE
;                     hand-over lines of re/player_down.md 14.5 - else the start line says 'CANNOT STAND' and
;                     Vulnerable does nothing (hits stay swallowed, as before)
