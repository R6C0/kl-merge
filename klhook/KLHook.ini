; One dial for what a bullet costs whom in an Arcade round (klbalance.c; re\balance.md). Off as shipped. Arcade only,
; and never on a stock level: the game's own numbers are kept and come back when the session ends or the level is
; stock. IN THE OWNER'S GAME since 2026-10-10: the six factors and the health part. NOT RUN YET: CrewOffStage, the
; PointBlank keys.
[Balance]
Enable=0
; Online (recommended off; HOST of an online FA round with bots only): the Arcade factors that can act on the host for an AI heister as victim.
; 0 = off, 1 = apply (OnlineYouToCrew: a human's hit on a bot x this, 0 .. 20, 1.0 = unchanged; [Balance] CopToCrew, when set, replaces [BotFill] OnlineCopToBot),
; 2 = dry run: counts and logs what it would change, writes no hit scale (the bots still move to the private ZFFActor vtable as with OnlineCopToBot; that pointer write is real). A human cop's hit gets CopToCrew, a human heister's YouToCrew; CopToCrew is ignored while OnlineCopToBot=0; a factor of 0 = no damage. Needs [BotFill] OnlineHost=1 and OnlineTactics=1. Works with Enable=0.
Online=0
;OnlineYouToCrew=1.0
; 0 = no log, 1 = once per round object: the stock table, the player blocks, your health object, what was written;
; 2 = also a line for every loss of health ('you lost 6.1')
;Log=1
; 0 = stock, the default (Arcade level 1: a policeman's bullet costs you a tenth, yours costs him double), 1 = less
; lopsided, 2 = the same for everybody + your health 550 -> 400, 3 = the same + your health 280 (an AI heister's)
;Risk=2
; 1 = a later Arcade level is never easier than stock, 0 = the dial's numbers on every level
;Ramp=1
; single numbers, each beats the dial: damage factors ...
;CopToYou=1.0
;YouToCop=1.0
;CopToCrew=1.0
;CrewToCop=1.0
;CrewToYou=1.0
;YouToCrew=1.0
; ... and what is LEFT of an AI heister's hits on police while he is at another heist stage than you (stage: not in
; yet / inside / out again / at the vehicle - so with you outside and the crew inside, or the crew gone ahead to the
; van). The game: 0.5 on Arcade levels 1-3, falling to 0.1 on 10-11. 1.0 = he hits the same wherever you are;
; -1 = the game's own, also under a Risk. Risk=1 sets 0.75, Risk=2 and 3 set 1.0. With Ramp=1 it is lowered on later
; levels so that CrewToCop x this is never more than in the stock game (Risk=2: 1.0 on levels 1-3, 0.76 / 0.48 / 0.39
; on 4-6, the game's own from 7); set alone, without a Risk or a lower CrewToCop, it then changes nothing: add Ramp=0.
; One number of 0 .. 20 with a decimal POINT: '0,75' or any other text is ignored (the log says so), not read as 0
;CrewOffStage=1.0
; ... your health as a factor of what the game gives (550 + armour), and how it comes back (seconds)
;PlayerHealth=0.73
;RegenDelay=8
;RegenTime=8
; ... and the POINT-BLANK RULE (re\melee_damage.md; NOT RUN YET). What looks like a guard's melee is the game's own
; rule for a soldier whose target stands within 1.6 m: at every step of his burst (0.1 .. 0.2 s) the target gets one
; hit of his gun TIMES 100. The factors above multiply it like any bullet - CopToYou=0.02 still leaves a Type 79
; guard 151 a step, Risk=2's 1.0 makes it 7,560 - so it has keys of its own, by VICTIM: how many ordinary bullets of
; his gun one step is worth. 100 = the game's own (the steps are then only seen and logged), 1 = one bullet,
; 0 = none; no key or a negative number = left alone. No Risk sets them, Ramp does not touch them. One number of
; 0 .. 100 with a decimal point. ToCop = what an AI heister's own step costs a policeman. Needs [KLHook] Tick=1.
;PointBlankToYou=2
;PointBlankToCrew=2
;PointBlankToCop=100
; ... LogCrewHits=1 (default 0): one KLHook.log line for every drop of an AI heister's health in an Arcade round (stock
; level or not; nothing is written): record, health before -> after, place, your distance, the nearest other heister,
; and WHO COULD HAVE DONE IT: the soldiers whose target is that heister (crew / TRAITOR / Enemy, metres), the nearest
; living non-Ally soldier, the nearest Ally aiming at him (friendly fire?), 'NO AIMER' on a big loss (blast / fall / script?
; or YOUR shots). Also a line at a death; at most 6 lines a second and 400 a round, then a sum. A guess from targets, NOT
; who really shot or with what (re\crew_hits.md 6). Needs Enable=1 and [KLHook] Tick=1.
;LogCrewHits=0
; ... EVERYBODY A BIT MORE HEALTH, AND A FED WHO IS NOT A ONE-MAN ARMY (track X2, 2026-10-11; re\balance.md 11; NOT RUN YET).
; Tough = one factor on every maximum health of the round: every NPC (police, guards, AI heisters, civilians), you as
; a heister and you as a fed. No damage factor moves, so who needs how many hits against whom keeps its ratio and
; every fight takes Tough times the hits (1.5: you 550 -> 825, an AI heister 252 -> 378, a policeman 90..158 ->
; 135..237). 0.25 .. 10; 1 or no key = off. The log says 2 s into a round what the AI heisters really got.
; NOT scaled by it (absolute numbers): the knock-down's trigger ([Down] DownHealth: set it x Tough yourself, 120 at
; 1.5), [Down] MinHit / Burst, a point-blank step, fixed-damage blasts. With FedMirror=0 a fed alone gets no Tough.
;Tough=1.5
; While YOU are police (come back as a fed; FedMirror=1): what YOUR bullet costs an AI heister (no key = YouToCrew's
; number) and what a heister's bullet costs YOU (no key = CrewToYou's). Today (Risk=1) that is 1.0 against 0.5 with 550
; health against 252: at 5 / 15 / 30 / 50 m you kill a heister with 4 / 4 / 5 / 7 body hits of the rifle or ONE head
; shot, he needs 19 / 22 / 27 / 37 on you. 0.4 against 1.0 makes it 9 / 10 / 13 / 18 against 10 / 11 / 14 / 19.
; NOT SEEN YET that an AI heister shoots a police human at all (it is read in the exe only): live check TH of
; re\balance.md 11.7 comes first - if they do not, CrewToFed changes nothing and [Fed] Hunted is owed.
;FedToCrew=0.4
;CrewToFed=1.0
; What a head counts for YOUR bullet on an NPC (the game: 10 = one shot kills anybody; an NPC's bullet never gets a
; head factor at all). FedHeadShot while you are police, HeadShot while you are a heister (police, guards and turned
; heisters alike). 1 .. 10; no key = the game's 10. With FedToCrew=0.4, 3 = 3 / 4 / 5 / 6 head shots at 5 / 15 / 30 / 50 m.
;FedHeadShot=3
;HeadShot=10

