Thr1=25
Thr2=100
Thr3=400
Thr4=700
Thr5=1500
Thr6=2100
Thr7=2800
; points = kills*KillPts + police kills*PolicePts + loot/LootUnit*LootPts + rewards/RewardUnit*RewardPts (steps capped at LootCap)
