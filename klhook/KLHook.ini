; OnlineVanHold (recommended on): online the game sees an empty box (the AI heisters have no crew records), so the waiting van (state 3, about 8 s) ran out or was shot empty (BO11: state 3 -> 6 after 1 s; [VanBlow] EmptyDelay also blows
;   an empty van on purpose). While a walking bot is within OnlineHoldM of the box the van's 'Invulnerable' byte (+0x21) is set to 1 and VanBlow's empty clock is paused; within OnlineHoldNearM the state timer [rules+0x1d8] is
