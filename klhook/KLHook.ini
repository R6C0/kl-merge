; Arcade only. A Dead Men body and the mix of masks need a level built with `kl_chars.py wardrobe` (KLWardrobe.ini
; beside its archive); on any other level Char 1..8 and Mask 1 / 2..9 = off / the heister's own mask still work.
[Character]
