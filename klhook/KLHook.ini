; ONLINE (2026-10-26, re\down_online_built.md): the same down in an online Fragile Alliance round (FA, Undercover Cop, Cops and Robbers; System
; Link, Steam, private match; the 9 stock maps and the expansion maps), for THIS machine's own non-police player only.
; Needs Enable=1 above. SHIP 1026f: online plays like Arcade for THIS machine's own body, with these honest differences: the OTHER players see the
; stock fall and the stock-speed get-up (the clip and its speed are writes on your own machine, not messages); a SINGLE hit bigger than your whole
; health still kills you (the factors below scale what a hit already took, they do not stop it being applied); Bots and DownPointBlank stay Arcade-only.
; The process-wide switch (Vulnerable) and the damage table are never written online. Every key below acts only with Online=1, EXCEPT OnlineBotDown / OnlineBotDownDry:
; those two do not read [Down] Enable or Online (they follow [Down] OnlineBotDown only).
;OnlineBotDown=1    ; (recommended on) HOST ONLY: the AI heisters of an online round (only there when the level keeps the Ally squads) go DOWN and get up like Arcade's
;                  ; (klbotdown.c; the tuning is the [BotDown] numbers). Never on a client, never on police. Clients follow through the actor dataset (GUESS: UNBENCHED).
;                  ; No adrenaline / revive of a bot online (needs a host message, not built). Independent of [BotDown] Enable (the Arcade switch) and of [Down] Enable / Online.
;                  ; It calls a game function and writes health, default ON with every network claim UNBENCHED (role 2 = host is a GUESS), like OnlineFlop. Runs only in round state 0x19.
;                  ; Cops turned into bots by OnlineCopToBot (team Ally, ZFFActor) count as bots here. No LieFar online (only the local human is known).
;OnlineBotDownDry=0 ; (recommended off) 1 = LOG ONLY for the online bots: botdown prints what it WOULD do, nothing is called or written
;OnlineFlop=1       ; (recommended on) your own body plays the Flop above (1 or 3) online, and the game's own GettingUp message is sent when it rises so the
;                  ; others' copy of you stands up too (UNBENCHED: Log=1 prints every send; the pool [+0x78] may be shared with other bodies on this machine - ReplicaProbe=1 logs it, read it after the first 2-player bench; set 0 if bots/replicas fall oddly). 0 = the stock fall online
;OnlineFreeFall=1   ; (recommended on) the fall is Arcade's: with Vulnerable=0 nothing costs in it (the loss is given back); with Vulnerable=1 the factors apply on the floor, BUT in a Flop=1/3 fall the game's own trigger stays on online (never written), so that fall (~2 s) is free
;OnlineFactors=1    ; (recommended on) DownFromCop / DownFromCrew apply while you are down (fall, lying, getting up): the health a hit took is given back by
;                  ; (1 - factor) - a victim-side write of your own health. Log=1 says per hit which path fired (a single hit bigger than your health still kills: the game applies it before it can be priced)
;OnlinePreScale=1   ; (recommended on; needs [Down] Enable=1, Online=1 and OnlineFactors or OnlineFreeFall =1, else it does nothing) OnlineFactors / OnlineFreeFall are applied BEFORE a hit lands (the FA rules' damage hook, slot 15 - the same call the [Ucc] DownOnly clamp uses), so a
;                  ; single hit bigger than your health is priced first and no one sees a dip. The after-the-hit give-back above becomes the FALLBACK, used only if that hook is not reached in a round
;                  ; (Log=1 says per hit "price path: SLOT 15" or "GIVE-BACK"). NOT priced online either way: the Flop=1/3 fall's bullets under Vulnerable=1 (the game's trigger swallows them first), DownPointBlank. UNBENCHED. 0 = give-back only
;OnlineMashSpeed=1  ; (recommended on) Arcade's get-up mash: GET UP presses go through at once and the clip speeds up with your mashing (Base / PerPress / Top, or the
;                  ; Flop's FlopBase / FlopPerPress). The others see the stock-speed get-up. 0 = MashHold's meter below instead (the clip stays stock speed)
;OnlineNoFire=1     ; (recommended on) the NoFire setting above follows you online (no shooting / aiming while you are down). 0 = you can shoot online
;ReplicaProbe=1     ; (recommended on for now) LOG ONLY: once per fall, what the other bodies' animation words are (settles whether they read what your flop wrote)
;OnlineFlopMirror=1 ; (recommended on) the OTHERS see your flop: you announce the clip of your next knock-down (and, while you lie, your get-up speed) through the hook's message channel and they
;                  ; write it into the animation pool + fall words of YOUR body on THEIR machine (only a body that is not the local master, not police, in D state 0, whose pool no other body wears - a shared pool is REFUSED and logged).
;                  ; Needs the same ini (Flop, FlopCarrier, FlopMix, FlopReach) on every machine. 0 = off, 1 = messages, and with OnlineFlopMirrorAssume=1 ALSO the clip drawn from a hash of (your table index, fall number) so a machine can guess it (without Assume=1, 1 behaves as 2: your draw stays random like Arcade),
;                  ; 2 = messages only (your draw stays random). The messages travel by UDP broadcast (LAN / System Link ONLY) and the Steam lobby member data (internet only while the lobby exists: UNPROVEN in a started match).
;                  ; UNBENCHED (re/down_mirror.md): read the 'down: mirror:' lines - 'MIRROR OK' / 'MIRROR MISSED' per fall, 'REFUSED' per body, the counters every 60 s with Log=1.
;OnlineFlopMirrorSpeed=1  ; (recommended on) the sped get-up too: while you lie after the landing, your clip speed is sent (every 0.7 s) and the copy of you on their machine follows it (channel speed + end ticks, GUESS: a replica's channel is writable like yours)
;OnlineFlopMirrorAssume=0 ; (recommended off) arm the copies of EVERY heister with NO message, by the same hash (needs identical ini, sets and fall counts on all machines; a wrong guess = the stock fall or a wrong clip). The only route that can reach Steam internet play if the messages do not
; The camera key above (Camera=) now also works on the stock fall online.
;Online=1        ; (recommended on) 0 = Arcade only, as before
;MashHold=1      ; (recommended on) online, ONLY WITH OnlineMashSpeed=0: the get-up waits for the mash meter. 0 = the stock one press frees him at once. Arcade ignores it
;MashNeed=8      ; presses' worth the meter must hold (GUESS for the owner's hands: 6 presses a second free him in about 2 s, 3 a second in 5 s)
;MashPer=1.0     ; meter one press adds
;MashDecay=1.5   ; meter lost a second (under about 1.5 presses a second he never gets up on his own: another player has to save him, or MashMax)
;MashMax=25      ; seconds of lying after which the hold gives up and lets the stock press through (0 = never). A hold must not be a trap
;MashKey=0x43    ; the Cover key the meter counts (virtual-key code; 0x43 = C, the game's default TapCover). Rebound it? put its code here. 0 = no keyboard key
;MashHoldHow=2   ; (recommended on) 2 = hold ONLY the Cover (get-up) key / pad button while he lies: he can still crawl, aim and shoot, like Arcade.
;                 ; 1 = the old hold (input mask bit 0x80): every button but reload is off while he lies, he cannot shoot. Needs MashHold=1
;MashScan=0      ; DIK scan code of the Cover key the game reads (0x2e = C); 0 = derived from MashKey. Rebound Cover? set MashKey (and MashScan if the scan code differs)
;MashPad=1       ; also count the pad button below (XInput, pad 1)
;MashPadBtn=0x1000 ; XInput button mask; 0x1000 = A (GUESS: the pad's Cover button was not read). Log=1 prints every number at the round's start
;MashMenuGate=1  ; (recommended on) C / pad A pressed while a menu page is open (pause, shop, respawn) does not fill the meter

