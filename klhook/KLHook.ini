;                     held once the vehicle drives out (the game's kill of the crew left behind reaches him).
;                     0 = none; THE FIRST LIVE RUN GOES WITH 0 (most of the word's readers are not read)
;     BotsUpPct=0     his health when he is up, per cent of his maximum (0 = the game's 75: A HEAL - a bot with
;                     BotsMax=2 has 252 + 189 + 189 health a round; 25 = what the fall gave him). With [Bots]
;                     CrewHealth the maximum is that part's
;     BotsNear=-1     -1 = not written. 0 = a head hit from near floors him too - but for EVERY NPC, the police as well
;   THE CAMERA STAYS YOURS, AND THE GAME'S OWN 'TAP QUICKLY' PROMPT (track R7, re/player_down.md 13; NOT RUN IN THE
;   GAME). Both are on by themselves when Flop is set (Camera=0 / Prompt=0 = the game's own).
;     Camera=1        the fall masks the mouse's look (bit 0x10 of the input mask) and stock gives it back 0.72 s
