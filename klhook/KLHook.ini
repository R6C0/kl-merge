; KLHook.ini - next to kl2.exe, beside dinput8.dll. Every key is optional; what is written here are the defaults,
; so a file with only [KLHook] behaves as before. klhook.c's top comment explains each key; klslot.c the expansion.
[KLHook]
ContinueAsserts=1
MaxDumps=4
MaxAsserts=200
; (recommended on) kl2.exe offsets (the number after 'kl2.exe+' in an ASSERT line) of asserts that are stepped over silently: no dump, no ASSERT line,
; not counted toward MaxAsserts, counted as 'soft asserts' (log + KLHook.result soft_asserts=). These five are one reader of a cover point's kind on DM01
; online: the host builds runtime cover points the client never does, so the replicated index hits an empty slot; kind 0 is the harmless fall-through.
; Empty / absent = off. Hex, 0x optional, comma separated.
AssertSoft=0x6567e8,0x845a8b,0x51d049,0x555900,0x4ede1b
; (recommended off until benched) AssertSoftGuard=1: a listed site is stepped over silently only when its cover record lies inside the cover pool
; (0x1788 x 0x7c at [[0xdd265c]+0x15a0]+0x44); otherwise the ordinary visible assert path (log + one dump). Static analysis found all five fall-throughs read-only.
; It does NOT stop the read: the out-of-pool read happens before the int3, and with ContinueAsserts=1 (default) a refused hit still goes on; it only adds a log line + dump.
;AssertSoftGuard=0
; after a fatal fault was logged and dumped, end the process ourselves instead of leaving it to Windows Error
; Reporting (whose process snapshots linger as thread-less "kl2.exe" entries and keep dinput8.dll locked)
EndOnFatal=1
; log ExitProcess and the C runtime's exit / _exit; code 0x8000dead = the game's integrity check (a hashed byte
; was changed)
ExitLog=1
; drive the fixes from the game's main loop (import slot of SteamAPI_RunCallbacks); 0 = from a thread of our own
Tick=1
; the stall watch (klhook.c): the main thread gives no frame and no loader step for StallMs -> one log line with
; where it stands and KLHook_freeze.dmp; a silence over StallSayMs is logged with its length when it ends.
; StallEndMs (0 = never; at least 60000) ENDS the game after that much silence - a frozen full-screen game then
; gives the desktop back without a reset. Off: a level load without [Load] NudgeMs is silent for its whole length.
StallMs=30000
StallSayMs=3000
StallEndMs=0
; set the leaderboard row count the game never initialises (score-page crash); 0 = only log the value found
LbFix=1
; 1 = the STOCK levels count as modded in Arcade: every gameplay part of this hook ([Bots], [Balance], [Down], [Crew],
; [Talk], [HUD], ...) acts on them as on a Dead Men map, and the Steam guard blocks their leaderboard upload, stats and
; achievements exactly as for a Dead Men map (stats until the game is restarted). Online sessions are never touched.
; Parts that need a level's own files (KLJoin.ini hops / climbs / rappel / fed body, KLTalk.ini, KLWardrobe.ini,
; KLGuns.ini) do nothing on a stock level: it has none. 0 = only expansion maps (the default).
AllMaps=0
;FastExit=1   ; KL Mod Options row 'fastexit': Alt+F4 / close ends the game at once (recommended on)
; The Retomoto escape lift (kljoin.c boxes, kldoorclose.c doors). All four keys live in THIS section, not in [Join]: kljoin reads [Join] as a lift box.
; DoorCloseMs (recommended on at 8000; proven live: A1LIFT7 + A1LIFT8 10-28, shipped ship1029; 0 = off, up to 120000): that many ms after a lift door
;   opened, the closing half of the door clip (frames 75..160) is played on its leaves. Needs an active [Join] box with CarMin/CarMax on the scene;
;   postponed while a LOCAL player stands at the car or a ride runs; a close over 2 min overdue is given up. SHIP-safe: the proxies are found by
;   reading (entity walk, else a budgeted memory scan), only leaf data is written + one thiscall into 0x59dce0. One 'doorclose:' log line per close.
;DoorCloseMs=8000
; JoinOnline (recommended on; proven live: A1LIFTNET2F + A1LIFTNET3 10-29, shipped ship1030; 0 = old behaviour): the lift boxes (rides and jumps)
;   also fire in a network session, for the LOCAL players only (each seat moves its own player, nothing is written to a remote one). Before this
;   kljoin.c gated every ride online, so the Retomoto lift was dead for host and joiner.
;JoinOnline=1
; DoorCloseRemote (recommended on; proven live: A1HOLD1 10-29 'table player 1 (not ours) is at car 9: doors held', shipped ship1030; online only):
;   a close is also postponed while ANOTHER session player (the hero table 0x74ee24, entries that are not ours) stands at the car, so the host
;   does not shut the doors on a joiner. 0 = only the local players hold them.
;DoorCloseRemote=1
; DoorRemoteStillMs / DoorRemoteMaxMs (recommended on at 6000 / 30000; proven live: A1HOLD2 10-30, in the repo since c9-doorhold-1029, NOT yet in
;   the installed ship1030; only with DoorCloseRemote=1): a remote hold ends when that player's feet have not moved for StillMs (a departed joiner's
;   table entry keeps its last feet, which held the doors open for good in A1HOLD1) or after MaxMs in one stay; 0 = no limit. GUESS values: a live
;   rider shifts more often than every 6 s, 30 s = a ride plus margin; a live rider standing still 6 s gets the doors closed on the host's screen
;   (cosmetic, his own ride is local).
;DoorRemoteStillMs=6000
;DoorRemoteMaxMs=30000
; TEST build only (a SHIP build is always session-safe): 0 lets patches into hashed code, for direct-boot tests
;SessionSafe=1

; The expansion: maps in their own folders under KLExpansion\Maps, nothing stock replaced.
[Graphics]
; how the game looks. Each is read once at start: change it, then restart the game.
; Look: 0 = Off (ReShade is not loaded at all: the stock frame rate), 1 = KL (a cool overcast grade), 2 = LiveLeak (camcorder)
Look=1
; Neural: 1 = load the GITC Uplift add-on (DLSS / DLAA through the neural renderer; F10 switches it in game).
;   0 = the add-on file is set aside so it costs nothing (with it loaded, even with F10 off, 106 .. 178 fps were measured against 188 .. 190)
Neural=0
; Textures: 1 = anisotropic filtering on the game's textures (floors, roads, walls at an angle stay sharp; no memory cost),
;   0 = the game's own filtering.
;   TextureLevel = 2..16. TextureSharpen = a mip bias, -1.0 .. 0 (e.g. -0.3; more shimmer)
Textures=1
TextureLevel=16
TextureSharpen=0
; ResetDrain: 1 = after the screen is rebuilt (monitor off/on, resolution change, alt-tab in fullscreen) the frame recorded before it
;   is thrown away instead of drawn with freed buffers, which crashed the game in d3d9.dll (recommended on), 0 = stock
ResetDrain=1

[FrameLimit]
; An RTSS-style frame limiter against stutter (same settings as RivaTuner: frametime measured at frame presentation, front edge sync,
; passive waiting off). Read once at start. Timing only, nothing of the game is changed.
; Enable: 1 = on (recommended on), 0 = off (nothing is wrapped)
Enable=1
; Fps: 0 = auto (recommended): the screen's refresh rate; skipped while the game's own vsync is on. Or a number, 10 .. 1000, always applied.
Fps=0
; FrontEdge: 1 = wait right before the picture is presented (recommended on, least input lag), 0 = right after
FrontEdge=1
; PassiveWait: 0 = busy wait, exact (recommended off; uses one core while waiting), 1 = Sleep for the long part of the wait
PassiveWait=0
; Log: 1 = a line in KLHook.log every 10 s: fps, frametime average / min / max, frames over 33 ms (recommended off)
Log=0
;Adaptive=0   ; KL Mod Options row 'adaptive': Limiter: adaptive pacing (follow the machine own frame time) - experimental (recommended off)
;MapCap=DM05A:60   ; KL Mod Options row 'mapcap': Limiter: cap Last Call (DM05A) at 60 fps so it does not run out of memory (recommended on)
; with [ReShade] Bridge=1 these are LIVE from the Mod settings rows too (and Look as well):
; CameraFX: 0 off / 1 subtle / 2 raw (uniform KL_CamFX; [ReShade] TechCamFX = a technique switched with it)
;CameraFX=1
; Glare: 0 / 1 lens glare (uniform KL_Glare; [ReShade] TechGlare = a technique switched with it)
;Glare=1
; AA: 0 off / 1 SMAA / 2 FXAA (KL_FXAA.fx)
;AA=1
; LensCrack: 1 = a cracked camera lens when you are shot a lot (needs [ReShade] Bridge=1 and reshade-shaders\Shaders\KL_LensCrack.fx; ini only;
;   cosmetic and local, also online). A burst of LensCrackHits hits within LensCrackWindow s (or health under LensCrackHealth with 2 hits)
;   rolls LensCrackChance percent for ONE crack; at most LensCrackMax (1..3), LensCrackCooldown s apart. Cleared on death / respawn / new round.
;LensCrack=1
;LensCrackHits=6
;LensCrackWindow=4
;LensCrackChance=35
;LensCrackMax=3
;LensCrackCooldown=8
;LensCrackHealth=0.35

[Stall]
; klhook.c: where the main thread's window-message time goes (the 2026-10-25 stutter: hitch-probe samples standing in NtUserPeekMessage under
; ReShade / the Steam overlay / Medal). Diagnostic only, nothing of the game changes: the game window's outermost procedure and the USER32
; PeekMessageA / W import slots are timed, 'stall:' lines every 10 s, a message of StallMsgMs or more is logged at once (40 per run).
; Trace: 1 = on (default; two QueryPerformanceCounter reads per message and per Peek), 0 = nothing wrapped, nothing timed
;Trace=1
; StallMsgMs: a window message that takes this many ms or more gets its own log line (id, wparam, lparam, depth, sent from another thread)
;StallMsgMs=20

[Input]
; klhook.c, the game's message pump (0x82dfb0). Both wrap the PeekMessage import slots themselves: they work with [Stall] Trace=0 too.
; MouseMoveMs: 0 = off (default). 8 .. 16 = the pump gets WM_MOUSEMOVE at most once every N ms (the hook chain of ReShade / gameoverlayrenderer
;   runs per returned message: 190 moves/s cost 10 s of Peek time per minute in the 10-25 log). GUESS, not run live: that the cost is per
;   returned message; whether the game reads WM_MOUSEMOVE at all is unknown (mouse look goes through GetCursorPos).
;MouseMoveMs=0
; PumpNoBlock: 1 = the game's GetMessageA never waits: a message the keep-Peek saw but the remove-Peek cannot take (a WM_MOUSEMOVE at the
;   window seam) is answered WM_NULL instead of waiting for forever in ReShade's MsgWaitForMultipleObjects - the CE27_HUD5 / P2P4C client
;   freeze (background window, watchdog 300 s, no fault). Log: 'pump: GetMessageA would have blocked ...'. GUESS: why the two Peeks
;   disagree. 0 = stock (the DLL default). (recommended on) proven live: C27_PNB1 / HUD6 10-27, both seats, 0 faults
PumpNoBlock=1

[Menu]
; TableLog=1: one log line 'menu: table N of 5096 entries ...' after each menu XML load (the main menu, a level): the live count of
;   the menu manager's table (every window / element / colour set / button graphic takes a slot; past 5096 = asserts at
;   kl2 0x7fad8d, past 5000 the mouse can fault). Reads only. Needed before any new menu element (re\hud_menu.md 1.1).
;TableLog=0

[ReShade]
; the ReShade bridge (klreshade.c): KLHook registers itself as a ReShade add-on, so the Mod settings rows switch the look, camera FX,
; lens glare and anti-aliasing WITHOUT a restart, and the shaders get KL_Fire / KL_Hurt / KL_Down / KL_Speed / KL_Health every frame.
; It runs its own preset ReShadePreset_KLLive.ini (made from ReShadePreset_KL.ini / _LiveLeak.ini, which it never writes).
; 0 = as before: the look is read once at start.
Bridge=0
;ReloadFx=1   ; KL Mod Options row 'reloadfx': Reload camera effects: keep the shot look through a reload (recommended on)
; LoadWhenOff=1: load ReShade with Look=0 too (every effect off) so a look can be switched on in the menu; 0 = Look=0 loads no ReShade
;LoadWhenOff=0
;Log=1
;LivePreset=ReShadePreset_KLLive.ini
;PresetKL=ReShadePreset_KL.ini
;PresetLiveLeak=ReShadePreset_LiveLeak.ini
; the techniques it manages (name@file.fx; empty = none) and Extra = techniques that are always on
;TechFXAA=KL_FXAA@KL_FXAA.fx
;TechSMAA=SMAA@SMAA.fx
;TechUplift=Uplift@Uplift.fx
;TechKL=KL_Look@KL_Look.fx
;TechLiveLeak=KL_Camcorder@KL_Camcorder.fx
;TechGlare=
;TechCamFX=
;TechCrack=KL_LensCrack@KL_LensCrack.fx
;Extra=
; the uniforms: KL_Fire +FirePerShot a round, falls in FireSeconds; KL_Hurt +HurtGain x the share of health lost, falls in HurtSeconds;
; KL_Speed = metres a second / SpeedFull
;FirePerShot=0.25
;FireSeconds=1.5
;HurtGain=4
;HurtSeconds=2
;SpeedFull=6

[Expansion]
Enable=0
;Root=KLExpansion
;Overlay=1
;Fallback=1
;Log=1
; -1 = the menu decides: the hook reads which map page is open (window HeistPlayMenu<N>) and keeps it until the
; frontend shows another page again; 0..9 = always that page (direct-boot tests, which have no menu)
;Page=-1
;
; Private Match / System Link map set (klslot.c, 2026-10-25; NOT run live; NOT sent to the other players: every peer needs the same ini;
; never use in Quick Match). OnlineSet: 0 = off, 2 = Dead Men maps, 3 = Dead Men campaign, 9 = RANDOM per slot (stock + every page with a map for the slot, seeded from the lobby id, same on all peers) - the page used for a load while this machine is in a
; network session. KeepPageOnline=1: with OnlineSet=0, the last expansion page opened in the Arcade menu is used for the next online session
; (forgotten when the frontend shows a 'MainMenu' window, KeepClear=1).
;OnlineSet=0
;OnlineRandomRound=0   ; 1 with OnlineSet=9: the round number joins the seed (a new draw every round; all players present from the lobby on)
;KeepPageOnline=0
;KeepClear=1

; <slot folder under Scenes\Locations> = <folder under KLExpansion\Maps>, on every menu page
[Redirect]
;F01=DM03

; the same for the expansion's own menu page 2 (built into KLExpansion\Overlay\Patch01.zip by mkoverlay.py)
;[Redirect.2]
;F01=DM03
;F02=DM01
;[Page.2]
;Title=Dead Men maps
;F01=Withdrawal
;F02=The Diner
;F01.Picture=LevelPicture_L09
; mkoverlay.py only: Icon= the button's icon (default Icon_Marketplace), Pictures=slot = each entry keeps the stock
; Arcade picture of its slot (default 'story': the story-mode picture LevelPicture_L0<slot>)
;Icon=Icon_Marketplace
;Pictures=story

; kllocname.c: an expansion map in a stock slot shows ITS name in the FA lobby and the lists (stock: "Subway"). Needs [Expansion] Enable=1
; and a [Redirect] rule. The name of a rule = [Names] <map folder>, else the [Page.N] entry title of its page. First live check: Override=0 Log=1.
[Names]
Enable=0
;Log=0
;Override=0
; OnlineLobby=1 (recommended off until proven live): private match / System Link map list shows the Dead Men map that will load
; (needs an [Slots] online map set; implies Enable and Override, online only; random set: exact map or a label of all maps)
;OnlineLobby=0
; LobbyPeekRound=1 (recommended off): with a new random draw every round, predict the next map (GUESS: all seats count rounds alike)
;LobbyPeekRound=0
; <folder under KLExpansion\Maps> = text (printable ASCII, 47 characters at most)
;DM01=Hot Coffee
;DM02=Late Night Opening
;DM03=Withdrawal
;DM06=A Walk in the Park
;DM09=Retomoto Tower

; name mode: the engine loads another scene name for a slot (level supplied through KLExpansion\Overlay)
[Slots]
;F09=Locations/F0M03/F0M03_Main

; Steam write guard (klsteam.c): no leaderboard upload, stat or achievement from a level that is not the stock
; level of its slot; a TEST build never writes at all. There is no off switch.
[Steam]
; 1 = block on levels that are not stock (stats then stay blocked until the game is restarted), 2 = block always
Block=1
; 1 = each blocked / passed write once per level, 2 = every one, 0 = none
Log=1
; 'session: state a -> b' lines; state 0x28 = the session ends and the game uploads
State=1
; 0 = while the upload is blocked, FindOrCreateLeaderboard fails too: the score page of an expansion map then shows
; no rows of the stock map's board (not run live yet: re\hook_live.md check S5)
StockRows=1

; Jump boxes (kljoin.c): a two-part level joined by the game's own jump request. Normally they come from
; KLJoin.ini beside the level's archive (klhook\KLJoin.retomoto.ini); here for tests, active on every level
; unless Scene= names one. [KLHook] Join=0 switches all boxes off.
;[Join]
;Min=2550 19500 800
;Max=2790 19800 1100
;Entry=5
;Name=06_Exit
;Target=6272 563 -6305
;Scene=F01
; Ride keys (all optional; usually in the level's KLJoin.ini): Delay Slack CarMin CarMax CarWait CarFallback CarStall CarNear FedRide (see kljoin.c).
; CarStall=1.5 jumps a player who stands that many seconds near the lift car without entering it (shut doors).
; CarStallAfterDoorMs=5000 (recommended on; 0 = old behaviour): the CarStall timer does not count until this many ms after the
; last lift-door proxy accept (only known to a TEST build with [Probe] DoorProxy=1); without one (SHIP build) CarStall acts as before.
;CarStallAfterDoorMs=5000
; The Retomoto lift door close ([KLHook] DoorCloseMs, DoorCloseRemote, DoorRemoteStillMs/MaxMs) and JoinOnline are documented in the
; [KLHook] section at the top of this file (they are NOT [Join] keys: kljoin reads this section as a lift box).
; [KLHook] JoinFeetNode=1 (recommended on; 0 = old behaviour): join boxes and lift rides read the player's place from the scene node,
; +0x460 only as a fallback. +0x460 stays at the doorway while the player stands in the Retomoto lift car (A1LIFT4d, 10-28).

; TEST builds only (klprobe.c; needs [KLHook] SessionSafe=0): the escape-lift door chain. Off by default; writes nothing when 0.
;[Probe]
;DoorProxy=0
;DoorAll=0
; DoorLeaves=1 (recommended off, TEST diagnostics): after each accepted door proxy, 6 s every 250 ms one 'probe: leaf' line per controller:
; node position, state byte [ctrl+0x21], raw dwords ctrl+0x20..0x3c (offsets GUESS, see klprobe.c). Needs DoorProxy=1.
;DoorLeaves=0

; The heister the player chose (klchar.c): written by the menu page 'Heister' of the expansion's overlay, or by hand.
; Arcade only. A Dead Men body and the mix of masks need a level built with `kl_chars.py wardrobe` (KLWardrobe.ini
; beside its archive); on any other level Char 1..8 and Mask 1 / 2..9 = off / the heister's own mask still work.
[Character]
Enable=1
; 0 = whoever the game gives, 1..8 = J.C. Tommy Pierre Liam Jean Elwood Bud Mitchel, 9..16 = Kane, Lynch, Dead Men crew 1..6
Char=0
; 0 = as 'Criminal Masks' in the game's options, 1 = no mask, 2..9 = the mask of heister 1..8
Mask=0
; 0 = standard, 1 = armoured (Dead Men bodies)
Outfit=0
;Settle=300
;Tries=3
;Log=1

; Hire a heister in the Arcade buy shop (klhire.c, re\shop_hire.md option B stage 1; NOT RUN IN THE GAME). Needs the Hire window baked into the
; level's online.xml (tools\kl_hire_bake.py, INSTALL hire window.bat). 1 = every round starts with a random heister (never Kane / Lynch) or the one
; you HIRED on the shop page of the round before (one round, price from your banked total, rank gate); the Heister page's Char= is then ignored.
[Hire]
Enable=0   ; (recommended on) proven live: CE27_HRF2 + CE27_HRP2 10-27, A1HIRE3 10-28; on in the owner's ini since 10-27; it replaces the Heister page's pick every round and needs the baked Hire window (or the F3 page)
;Rank=1
;Bots=0
; ONLINE (private match / Steam FA, klhire_online.c, re\shop_hire.md section 8): 1 = the client asks the host, the host checks
; rank / money / "nobody wears him" and spends with the game's own routines, the body travels by [CharOnline]. Needs Enable=1 here and [CharOnline] Enable=1,
; [Character] Enable=1, a baked Hire window. (recommended on with Enable=1) Benched 10-27, both seats, 0 faults: HRF2 host hires Tommy and wears him
; in round 2, client refused ("another player has hired him"); HRP2 client asks for Jean, host accepts, client wears Jean in round 2 and the host sees him.
;Online=0
; (recommended on) 1 = with Enable=1, online ignores the Heister page Char= and the F9 key like Arcade does (mask F11 / outfit Ctrl+F11 still work). 0 = old: the saved Char is worn online.
;OnlineIgnoreChar=1
;OnlineLog=1
;OnlineTestBuy=0
; (bench only, recommended off) 1..16 = once per round per peer, in the shop phase, press KLHire<n> through the real row path and log 'hire-online: TEST ...'. No faked money.
; HIRE PAGE (klshoppage.c, re\shop_hire.md section 9; built 2026-10-27; LC2 11-01 + SN1 11-02 PASS). Page=1 (with Enable=1; recommended on: cleared for the next ship): the PageKey turns the open Buy Weapons
; shop into 'HIRE A HEISTER' (tabs DOG DAYS CREW / DEAD MEN CREW, rows = heister names, the description = who, price, rank, your rank, state); BUY hires (offline klhire.c, online:
; the client asks the host, same wire as Online=1 above). Never buys a gun. PageKey again = the stock page back. Works with [ShopPage] Enable=0 too. Online it needs Online=1 above.
;Page=0
; Virtual-key code of the page key (decimal or the Windows number: 114 = F3, the default (was 123 = F12, which is Steam's screenshot key: every press made a screenshot; F3 is free in Steam, ReShade.ini and the mod); F7 = Unstick, F5 = Ucc, F8 = Inv/HostOpts, F9/F11 = CharOnline, F2 = page cycle are taken). Must differ from [ShopPage] Key. A name works too ("F3", "H", "End").
;PageKey=114
; (recommended on) 1 = the first BUY only arms the row for 4 s, the second BUY hires (a hire has no refund). 0 = one press hires.
;PageConfirm=1
; (recommended on) 1 = on the hire page the hire price is written on the heister's name line and the stock gun price is blanked (the stock price is the carrier gun's). 0 = stock price shown. NOT run live.
;PagePrice=1
; 'hirepage:' log lines (page shown/hidden, each press with its result, each text the first time it is served)
;PageLog=1
; (recommended off until tested live) 1 = on the hire page the highlighted heister's black and white card (<PagePicsDir>\char_NN.kmi, tools/kl_portraits.py gray + the INSTALL bat) is drawn over the big picture box with Direct3D 9 at the end of the frame. A missing file draws nothing. Needs [FrameLimit] Enable=1. NOT run live.
;PagePics=0
; DEAD ROUTE (2026-11-05): PagePics is the Direct3D overlay (klhirepic.c); Present is never wrapped on the owner's PC, so it cannot draw there. Use BakedPics below.
; Folder of the cards; empty = <game folder>\KLPortraits
;PagePicsDir=
; 'hirepic:' log lines (each card loaded / missing, the first draw)
;PagePicsLog=1
; (recommended off until tested live) 1 = on the hire page the highlighted heister's black and white card is shown by the game's OWN menu renderer: needs the map zips baked with tools/kl_shop_pics.py (INSTALL shop pics.bat in <work>\build\shop_pics_1105; adds 16 extra picture elements per big group). Works with FrameLimit on or off. A map that is not baked keeps the stock look. NOT run live.
;BakedPics=0
;Log=1
;Price1=45000
;Rank1=0
; Price1..16 / Rank1..16 = J.C. Tommy Pierre Liam Jean Elwood Bud Mitchel Kane Lynch Ashkanan Meldal Red Parker Standen Hutchison
; (defaults: 45000 x4 / 90000 x4 / Kane 450000 rank 6 / Lynch 540000 rank 7 / the six Dead Men heisters 180000..270000 ranks 4-5)

; Room for bigger levels (klmem.c): the game has 2 GB of address space and reads a level's models into one block.
[Memory]
Enable=1
; address space kept free in one piece from the start (klmem.c): a level's .prm block always lives in it, and so
; does any block of 1 MB or more that the heap can no longer place; 0 = off
ReserveMB=128
; NOT RUN IN THE GAME: RoomMB=128 together with ReserveMB=176 puts every block of 16 MB or more into the reserve
; once the largest free piece outside is under 128 MB (from the second level load on)
;RoomMB=0
; 0 = the game's threads keep their 4 MB stacks; 1 or 2 = that many MB for the threads the game starts itself
; (about 100 MB back with 1; not measured whether a game thread needs more - try it on purpose)
StackMB=0
; kld3.c back-buffer screenshots (TEST feature, a disk write every S seconds; needs [FrameLimit] Enable=1 SwapChain=1): a desktop grab of
; the game is all black with the monitor off, the back buffer is not. KLShot_<tag>_NN.<ext> in the game folder or D3dShotDir.
;D3dShotEvery=0   ; seconds between shots, 0 = off (recommended off)
;D3dShotFrom=0    ; seconds after the hook loads before the first interval starts
;D3dShotMax=40    ; shots per run, 1..400
;D3dShotFmt=0     ; 0 = JPG, 1 = PNG, 2 = BMP
;D3dShotDir=      ; folder (default: the game folder)
;D3dShotTag=run   ; file name part
; klquad.c (2026-10-25): the 4 screen-quad vertex buffers of the post-process passes get a ring of this many buffers each, so the
; graphics driver does not keep one small block per DISCARD lock (Last Call ran out of address space in round 1 without it: K50H;
; with 128: K50F2/I flat at 120 fps, picture unchanged). Needs [FrameLimit] Enable=1 (its Reset wrapper). 0 = off
QuadRing=128
;Log=1
; NOT RUN IN THE GAME (klhigh.c, 2026-10-25): the 4 GB flag made safe. High=1 MEASURES what the listed foreign modules
; hold through VirtualAlloc (no flag needed, placement unchanged); High=2 (kl2.exe WITH the large-address flag) reserves
; the whole upper 2 GB at start and carves those modules' reservations out of it, so the game, its heap, the stacks and
; the DLLs stay below 2 GB (the engine's bit-31 pointer tag) while the driver gets its own 2 GB. Measure first.
;High=0
;HighModules=nvd3dum.dll,nvwgf2um.dll,ReShade32.dll,gameoverlayrenderer.dll
;HighCount=d3d9.dll,dxgi.dll,d3d10.dll
;HighLog=1

; Load-time experiment E1 of re/loading.md (klnudge.c). Off as shipped.
[Load]
; 0 = off; 1000 = the game's cursor nudge (once per load step and per frame while it is in front) once a second only
NudgeMs=0
; 1 = control run: count the calls and log them, change nothing
Count=0

; Switchable looks of guns (klgun.c): Dead Men models on Dog Days guns, on a level built by tools/kl_guns.py (KLGuns.ini
; beside its archive). Written by the menu page 'Guns' of the expansion's overlay, or by hand.
[Guns]
Enable=1
; the starting rifle: 0 = Zastava, 1 = MP5 (Dead Men), 2 = AK-74
Start=0
; the other guns of the file: 0 = Dog Days, 1 = their Dead Men look
Set=0
;Log=1

; Random AI heisters (klcrew.c): each Arcade round the AI crew is a new draw from the level's wardrobe (the eight Dog
; Days mercenaries and the eight Dead Men heroes, outfit and mask at random), never the body the player wears or chose.
; NOTHING OF IT HAS RUN IN THE GAME. Off as shipped. Only on a level that is not the stock one of its slot, and it
; needs [Character] Enable=1 for the wardrobe (without one the level's own eight bodies are shuffled).
[Crew]
Random=0
; 0 = a new seed each start (logged); any other number repeats the same draws
;Seed=0
; weight of each Dog Days / Dead Men body (0 = none of that game)
;DogDays=1
;DeadMen=1
; characters that are always in the crew when free, e.g. 9,10 = Kane and Lynch
;Include=
; 0 = every Dead Men body in plain clothes
;Outfits=1
; 0 = faces only, 1 = each bot masked with MaskChance percent, 2 = all masked; PaydayMasks=0 = the eight Dog Days masks only
;Masks=1
;MaskChance=50
;PaydayMasks=1
; 0 = the voice table is left alone; Names=1 also renames the bots (two more game calls)
;Voice=1
;Names=0
;Settle=600
;Tries=3
;Log=1

; The AI crew follows the jump of a two-part level (klcrew_rt.c): on a level whose KLJoin.ini has a [CrewJoin] section
; (Retomoto with bots, tools\kl_fa_bots_rt.py) the AI heisters are put in front of the jump entry by the game's own
; actor teleport when the player's jump is requested. NOTHING OF IT HAS RUN IN THE GAME. Off as shipped. Needs
; [KLHook] Join=1 (the default). The full Retomoto bots build must not be played without it.
[CrewJoin]
Enable=0
; 1 = after a LATE teleport the entry's 'AITrigger' list is sent again
;Retrigger=0
;Log=1

; The AI crew gets over a place the navigation mesh does not carry it over (klhop.c): on a level whose KLJoin.ini has
; a [CrewHop] section (Withdrawal: the yard wall; tools\kl_fa_bots.py writes it) an AI heister that has stood at the
; gather place for the section's Wait seconds is put on a landing place beyond it by the game's own actor teleport.
; NOTHING OF IT HAS RUN IN THE GAME. Off as shipped. Arcade only, never on a stock level. re\bots_bank.md
[CrewHop]
Enable=0
; 1 = everything is watched and logged, nothing is called (the first live check)
;Dry=0
; 1 = half a second after a hop the soldier gets the order it already holds once more (if the bots land and stand)
;Reorder=0
; 2 = also, every 5 s, where every AI heister stands against every hop
;Log=1
; Online: 0 = off, 1 = on, 2 = dry log. ONLINE HOST only (never a client): the AI heisters found by the census are carried over the level's [CrewHop] places with the game's own teleport,
; the heist stage coming from the [BotFill] OnlineTactics puppeteer (loot carried = 2, aboard = 3), else OnlineStage. Works with Enable=0 (Arcade part off). (recommended off: not yet run live)
;Online=0
; the heist stage assumed for an online bot the puppeteer does not track (0 .. 3). (recommended off: not yet run live)
;OnlineStage=2
; OnlinePrivVt: 1 = a bot on the hook's private damage table (OnlineCopToBot) still counts as a ZFFActor for the carry. RT1: all 17 DM09 carries were refused 'its actor is not a ZFFActor'.
; (recommended off until benched: RT2, NOT run live)
;OnlinePrivVt=0

; Dead Men's free climb (klfreeclimb.c, luvsic's port): hold W and press E at a ledge 25 .. 220 high. Only where the
; level's .ANM has Dead Men's /Movement/Climb/Up/* clips (no stock level has them). NOT RUN IN THE GAME in this hook.
; With it on, klclimb.c's level-edge climb ([EdgeClimb]) stays off.
[Climb]
Enable=0
; 1 = probe and log every press, start nothing (the first live check)
;Dry=0
; 2 = also every ray of the probe
;Log=1
;Key=0x45
;NeedBlock=0
;MinIn=30
;Camera=1
;Snap=1

; Kane and Lynch talk (kltalk.c): on a level with a KLTalk.ini beside its archive (tools\kl_fa_talk.py) the scripted
; scenes (Retomoto: Kane's countdown to the blast, the Kane / Lynch exchanges) and idle / combat chatter are said
; through the game's own speech call, when somebody in the round wears Kane or Lynch. NOTHING OF IT HAS RUN IN THE
; GAME. Off as shipped. Needs [Character] Enable=1 and the level's PC_Def.str (the hook refuses a smaller one).
[Talk]
Enable=0
; 0 = the scenes only, no chatter
;Chatter=1
; seconds added to every 'Start' delay (may be negative): the round-start moment is one observation (re\talk.md 3.3)
;StartOffset=0
; 1 = nothing is called, every line is logged as 'would say' (the timing run, check T1)
;LogOnly=0
;Seed=0
; 2 = also the triggers (stage, aboard, join, boxes) as they are seen
;Log=1

; Hosting a System Link / Private Match Fragile Alliance lobby (kllobby.c).
[Server]
; (recommended off) 1 = this copy hosts a Quick Match / Ranked FA lobby by itself and again after each round (klserver.c, re/online_server.md). Implies [Lobby] Solo=1.
; Needs a launch WITHOUT -o DefaultScene (it starts in the menu). NOT run live.
Enable=0
; quick = Player Match 'Join Game' (public lobby)   ranked = Ranked (type 3 lobby)
Mode=quick
; humans connected (the host counts) before the wait may end in a start; 1 = start alone after the wait
MinPlayers=2
; seconds the lobby stays open for joiners before the target is lowered
WaitSec=45
BootSec=10
SearchSec=60
RehostSec=10
; 1 = RETURN / SPACE fallback when the countdown does not move the lobby on (the game window must be in front)
PressReady=0
Log=1

[Lobby]
; MinPlayers: 0 = the game's own rule; 1..8 = the host's Ready starts the round once this many are connected (NOT replicated to clients).
MinPlayers=0
; Solo (recommended off): 1 = the host can play a round ALONE. Without it the round opens "FAStatus_HostDisconnect" (all players left) 0.3 s after it starts.
; Implies MinPlayers=1. Clears the session error word only while this machine hosts a game type 4 session with at most 1 human connected;
; a real error with 2 or more humans is untouched. Gives the session manager a private vtable copy (heap data only, no code byte). Testing aid for custom matches.
Solo=0
; MaxPlayers (recommended off): 0 = stock. 9..16 = the Steam lobby member limit of a hosted lobby is raised to at least this many (CreateLobby and
; SetLobbyMemberLimit, klmm.c). ALONE it does not put a 9th player in the game: the lobby row (kllobbyopt.c) must offer it and the level needs seats
; (re/max_players.md: the engine caps at 12, a stock FA level has 8 heister seats). Experimental.
MaxPlayers=0
; KeepRound (recommended off until benched): 0 = stock. 1 = the online rules' early round cuts (fewer than 2 heisters in play -> 70 s; all humans out -> 10 s) are skipped
; while at most one human is connected or AI heisters are planned; 2 = always. KL Mod Options: no row yet.
KeepRound=0
; RoundClockFix (recommended off until benched; GUESS): 1 = [rules+0x4c] is set to the lobby heist time at the round start when it holds less. No row yet.
RoundClockFix=0
;RoundsMax=0   ; KL Mod Options row 'lobbyopts': Lobby (host): Heist time 2 to 10 minutes and up to 10 rounds (stock 3-5 minutes, 3-5 rounds); every player gets the numbers the host picks (recommended off)
;Rows12=1   ; KL Mod Options row 'lobbyrows12': Online lobby (Fragile Alliance): list shows 12 player rows instead of 8 (rows closer together; needs the file Patch01_rows12.zip in the Overlay folder, built by tools/kl_lobby12.py) (recommended on)
;TimeMax=0   ; KL Mod Options row 'lobbyopts': Lobby (host): Heist time 2 to 10 minutes and up to 10 rounds (stock 3-5 minutes, 3-5 rounds); every player gets the numbers the host picks (recommended off)
;TimeMin=0   ; KL Mod Options row 'lobbyopts': Lobby (host): Heist time 2 to 10 minutes and up to 10 rounds (stock 3-5 minutes, 3-5 rounds); every player gets the numbers the host picks (recommended off)
;TimeAuto=0   ; KL Mod Options row 'lobbytimeauto': 0 = stock; 1..20 = the host's lobby starts at this Heist time (minutes), once per lobby, clamped to TimeMin..TimeMax (stock 3..5, so 6 needs TimeMax>=6); LEFT/RIGHT still change it (recommended off)

; More people online (klnetload.c, re/max_players.md 6). Both parts are off as shipped.
[NetLoad]
; Probe (recommended off, a diagnosis): one line a second in a network session: peers, fps, longest frame gap, gaps over 50/100 ms, the sender numbers. Reads only.
Probe=0
; ScaleSend (recommended off): the sender's minimum update interval grows with the number of peers (stock x (1 + ScalePct/100 * (peers - ScaleFrom)), at most MaxFactor x).
; Not in a ranked lobby. Put it on the host and the clients: only the sender's numbers count. GUESS that bandwidth is what makes a full lobby unstable.
ScaleSend=0
ScaleFrom=4
ScalePct=12
MaxFactor=2.0
ScaleActors=0

; Cops and Robbers: each human cop leads Per AI police soldiers (klcopsquad.c, re/cop_squads.md). HOST only, C&R only. NOT RUN LIVE.
; Keys drive the LOCAL player's squad only (F follow, G hold, H attack what I aim at); every squad gets Follow at recruit and every FollowS s.
[CopSquad]
Enable=0
Per=4
Team=3
FollowS=8
MaxM=40
AttackT=5
;KeyFollow=0x46   ; (GetPrivateProfileInt reads "0x46" as 0: use [Keys] CopFollow/CopHold/CopAttack; klkeys.c parses hex and names)
;KeyHold=0x47   ; (GetPrivateProfileInt reads "0x46" as 0: use [Keys] CopFollow/CopHold/CopAttack; klkeys.c parses hex and names)
;KeyAttack=0x48   ; (GetPrivateProfileInt reads "0x46" as 0: use [Keys] CopFollow/CopHold/CopAttack; klkeys.c parses hex and names)
Log=1

; Undercover Cop suspicion messages (klucc.c, re/ucc_design.md P5 + OWNER DECISIONS 6, re/hook_netchannel.md). UCC rounds only. NOT RUN LIVE.
; Pings: the HOST names a random living heister as suspicious every PingMinS..PingMaxS s; every modded peer shows the host's line.
; Accuse: Key (F5) while aiming at another heister shows "<me> suspects <him>" to everyone; CooldownS per player (sender and receivers).
; Name: my shown name (empty = Steam persona, else "Player <n>"). Without a carrier ([NetChan] Udp=0 Steam=0) each player sees only his own lines.
; Undercover Cop: while the UCC is hidden his hits can only DOWN a heister, never kill him (klucc_down.c, re/ucc_down_only.md). NOT RUN LIVE.
; The clamp runs on the VICTIM's own PC: every heister's PC needs the same key. 1 = never under Floor health; 2 = also a would-be kill
; floors him through the game's own down trigger (GUESS). Dry=1 logs only. The reveal key (P6) is Hide / RevealKey below: without Hide=1, hidden = the whole round.
[Ucc]
Pings=0
PingMinS=60
PingMaxS=120
Accuse=0
;Key=0x74   ; F5 (rebind in [Keys] UccPing=; a line here wins over [Keys])
CooldownS=20
ConeDeg=15
RangeM=40
ShowS=4
Name=
Log=1
DownOnly=0
Floor=1
ForceSecs=2.5
Dry=0
; Undercover Cop hidden until HE reveals (klucchide.c, re/ucc_design.md P6 BUILT). NOT RUN LIVE. Hide=1: the stock crew list (Strip), our
; online rows (Rows) and the kill / friendly-fire lines (Feed) show a hidden UCC as crew to heisters; police and the other UCC still see him.
; RevealKey (Insert) pressed by the UCC: host's own UCC at once, a client's goes to the host over [NetChan] (System Link only for now).
; Bounty: [tuning+0x674] = BountyHidden while any UCC is hidden, BountyRevealed after. The reveal also ends DownOnly's cap for him.
Hide=0
;RevealKey=0x2D   ; Insert (rebind in [Keys] Reveal=)
Strip=1
Rows=1
Feed=1
Bounty=1
BountyHidden=200000
BountyRevealed=400000
HideLog=1

; The hook's shared peer message channel (klnetchan.c, re/hook_netchannel.md). Idle (no socket, nothing sent) unless a module asks for it
; (today: [Ucc] Pings / Accuse). Udp = broadcast on Port (System Link, two games on one PC). Steam = lobby member data klx_msg (installs the
; ISteamMatchmaking proxy; only while a Steam lobby exists - GUESS: the game leaves it at match start, so internet rounds may have no carrier).
[NetChan]
Udp=1
Steam=1
Port=27416
Repeat=3
RepeatMs=300

; Undercover Cop sabotage (klsabotage.c, re/ucc_sabotage.md). NOT RUN IN THE GAME. VanHold=1: on the HOST in an Undercover Cop round, when the local
; player is the hidden UCC and presses Key while the escape van is coming or waiting, the van's state timer gets HoldS more seconds (once a visit,
; never above 40 s, no announcement). A client UCC cannot use it yet. AnyMode / AnyPlayer are test keys (plain FA / C&R, any host player).
[Sabotage]
VanHold=0
;Key=0x4a   ; J (rebind in [Keys] Sabotage=)
HoldS=8
AnyMode=0
AnyPlayer=0
Log=1

; The AI heisters of an Arcade round (klbot.c; its top comment is the spec). NOTHING OF IT HAS RUN IN THE GAME.
; Off as shipped; with Enable=1 alone it only logs. Every part has its own key and does nothing outside Arcade.
[Bots]
; HoldStep: the driver holds (FollowOutHold / WaitForYouHold) add their seconds in ONE step (0, default: the time shown jumps once and counts
;   down to the real departure) or this many seconds at a time under 2 s (5 = the old saw-tooth)
HoldStep=0
Enable=0
; OnlineFill (recommended on) proven live: BO3..BO6, WK2, BP4..BP20, Q28 + Q29 21 maps (master of the online AI heisters; the owner's ini has 1 since 10-26): in a System Link / Private Match FA lobby, log the plan "AI heisters = lobby target - humans connected" and the Ally actors that
; survive the load; the host's Ready may start below the target (implies [Lobby] MinPlayers=1). READ-ONLY: it adds NO heister (klbotfill.c, reots_online_fill.md).
OnlineFill=0
; OnlineFillSquads (recommended off; needs OnlineFill=1): before the round the first `fill` map heister squads (EGameType Heist-only) get the FA bit so the online collect keeps them: WALKERS only, no loot/board (re/bots_online_fill.md, re/arcade_online_parity.md).
OnlineFillSquads=0
; OnlineEscort (recommended off): HOST only (needs [BotFill] OnlineHost=1 + OnlineTactics=1). 0 = off, 1 = an online AI heister with nothing to loot (no stack to take, holding; not while carrying, boarded, or once the van is called) stays near the host's own seat,
;   2 = near the nearest living human. Arcade's [Bots] Escort does this with the crew records; this is the online copy through the same order call (0x760e50). Not run live. Log: 'botfill: escort: online: bot N follows seat S (dist X cm)'.
OnlineEscort=0
; OnlineEscortFar (cm, 800 = Arcade EscortFar): a bot farther than this from the human is called to him, minimum 400 as Arcade (recommended off, only used with OnlineEscort on).
OnlineEscortFar=800
; OnlineEscortSide (cm, 300 = Arcade EscortSide): the place it is called to, this far from the human toward the bot (recommended off, only used with OnlineEscort on).
OnlineEscortSide=300
;TraitorFoe=0   ; KL Mod Options row 'traitors': Traitors: an AI heister can turn on you (20 % of rounds)
;Grudge=0   ; (recommended off until benched) KL Mod Options row 'grudge': 1 = AI heisters you shoot turn on you in proportion (klgrudge.c; Grudge* keys and the warning are documented further down)
;BackstabMark=0   ; (recommended off until benched) KL Mod Options row 'backstabmark': 1 = a turned bot gets the traitor bit (see the Backstab block further down)
;FoeSkipWhileFed=0   ; (recommended off until benched) 1 = no traitor booking and no cap while a human is a policeman (fed); 0 = as before. KL Mod Options row 'foeskipfed'
;StairGather=0   ; (recommended off until benched) 1 = Hasta's stair gathering: loyal bots heading down are ordered to StairGatherAt first (klmove.c; see StairGatherRadius). KL Mod Options row 'stairgather'
; --- ESCAPE-VEHICLE BOARDING AND CALLING (klmove.c, klescort.c; Arcade only; every key below defaults to 0 unless said, and none has a bench PASS of its own in re/open_work_log.md;
;     the numbers marked GUESS are suggestions from the code comments, not measured). Long text: the klmove.c header, section 4 'BoardReach'.
;BoardReach=0   ; (recommended off until benched) 100 = 1 m: an escape box takes an AI heister aboard only when THAT bot is within this of the vehicle's boarding box (where you get in), not from 30 m away. Use with FollowOutHold / FollowOutSpare. KL Mod Options row 'boardreach'
;BoardReachLast=0   ; (recommended off until benched) 1 = the same doors help also at the round's LAST vehicle (a called bot 8 m off is walked aboard). Needs BoardReach. GUESS that 8 s are enough. Row 'boardreachlast'
;BoardReachLastRange=0   ; cm; 0 = the doors range (3 m); GUESS 1000 (a jump aboard from 10 m, safe only at the last van). Only with BoardReachLast. No row
;BoardReachFight=0   ; (recommended off until benched) 1 = a called bot that was hurt in the last 4 s and is within BoardReachFightRange of the van is sent to the doors at once (a fighting bot never stands still). Needs BoardReach. Row 'boardreachfight'
;BoardReachFightRange=1500   ; cm (15 m, GUESS), at most 3000, only with BoardReachFight. No row
;BoardReachFlat=0   ; (recommended off until benched) 1 = from a boarding object that is no box, BoardReach ignores the height within 2.5 m. Needs BoardReach. Row 'boardreachflat'
;BoardReachChase=0   ; (recommended off until benched) 1 = a called bot walking off after its order is sent again every BoardReachRepeat seconds. Needs BoardReach and BoardReachRepeat. Row 'boardreachchase'
;BoardReachRepeat=0   ; seconds between repeat orders to the doors (0 = off; 3 is a GUESS), used by BoardReachChase. No row of its own
;BoardReachSettle=0   ; (recommended off until benched) cm, 0 = off, GUESS 200, at most 300: a called bot this close to the boarding box counts as within BoardReach. Needs BoardReach. Row 'boardreachsettle'
;BoardReachAim=0   ; (recommended off until benched) cm, 0 = off, GUESS 150, at most 300: the order to the doors points a little short of the van, on the bot's own floor, instead of at its node. Needs BoardReach. Row 'boardreachaim'
;BoardReachAimHeight=0   ; metres, 0 = off: with BoardReachAim, a bot more than this above or below the van gets the van's own place. No row
;BoardReachSent=0   ; (recommended off until benched) cm, 0 = off (the code limit stays 30 m), GUESS 6000, at most 10000: how far from the boarding box a called bot may stand and still get the order to the doors. Needs BoardReach. Row 'boardreachsent'
;CrewRouteHold=0   ; seconds the vehicle is held while the crew walks the route to it (0 = off; 45 is a GUESS). KL Mod Options row 'crewroutehold'
;CrewRouteRange=100   ; metres: how far from the van the crew counts for CrewRouteHold (5..300; 100 is a GUESS). No row
;CrewRouteHopHold=0   ; seconds (0 = off, GUESS 15): extra hold when the van's wait ran out while a stage-3 bot was still closing in or had just hopped to the other half of a two-part map. No row
;CrewRouteAlone=0   ; (recommended off until benched) 1 = CrewRouteHold also runs while you are in play and not aboard. Needs CrewRouteHold. Row 'crewroutealone'
;CrewRouteFed=0   ; (recommended off until benched) 1 = CrewRouteHold also runs while you are a policeman (fed), so the leaderless street crew still catches the last van. Needs CrewRouteHold. Row 'crewroutefed'
;VanCallNear=0   ; (recommended off until benched) metres, 0 = off, GUESS 40: a bot that stands this close to the exit at heist stage 1 or 2 is called (stage 3) after VanCallDelay seconds so the van does not leave without it. Row 'vancallnear'
;VanCallDelay=3   ; seconds into the van's wait before VanCallNear calls (GUESS 3). No row
;VanCallMinStage=1   ; lowest heist stage VanCallNear may call (1 or 2). No row
;VanCallLast=0   ; (recommended off until benched) 1 = at the round's last vehicle VanCallNear's distance limit is ignored (bots farther out are called too). Needs VanCallNear. Row 'vancalllast'
;LastVehicle=1   ; 1 = when the round clock runs out and no vehicle was called, the bots call one (the code default). No row: leave at 1
;LastVehicleLead=25   ; tenths of a second before the round's end at which that fallback calls (25 = 2.5 s; 150 is a GUESS for a test). No row
;LastVehicleFlagged=0   ; (recommended off until benched) 1 = a "last vehicle" flag set with no vehicle on the way (a human death set it on Last Call) no longer stops that fallback. GUESS. Row 'lastvehicleflagged'
;HalfGuard=0   ; (recommended off until benched) units of height (0 = off, GUESS 400): the crew is not re-ordered to a place on the other half of a two-part map (tower vs street) when it is that far above or below it; such an order cannot be walked. Row 'halfguard'
;WalkAwayReorder=0   ; (recommended off until benched) 0 = off, GUESS 3: a called bot whose distance to the van grew for this many 2 s samples is ordered to the van again. Row 'walkawayreorder'
;WalkAwayGoal=0   ; metres, 0 = off: with WalkAwayReorder, a bot already heading for the doors (its goal within this) is left alone. No row
;WalkAwayHeight=0   ; metres, 0 = off: with WalkAwayReorder, a bot this far above or below the van is left alone (a stair route first leads away). No row
;WalkExclusive=0   ; (recommended off until benched) GUESS: 1 = while a map-hop walk (klhop.c) moves a bot, the fed-hunt and restless orders leave it alone. Row 'walkexclusive'
;EscVisitFix=0   ; (recommended off until benched) GUESS fix: 1 = a try at repairing the first visit of the escape vehicle that boarded nobody (seen on Park II, Vault, Hot Coffee II). The exact action is a guess; see klmv_escvisit in klmove.c. Row 'escvisitfix'
;EscVisitProbe=0   ; (recommended off) 1 = log what the first escape visit looks like (diagnostic). Row 'escvisitprobe'
;BoardProbe=0   ; (recommended off) 1 = every 0.5 s while the vehicle waits write one 'boardprobe:' line to KLHook.log (diagnostic, read-only). Row 'boardprobe'
;OrderTrace=0   ; (recommended off) 1 = one 'otrace:' log line per order any module of this hook gives a crew bot (at most a few hundred a round; diagnostic). Row 'ordertrace'
;OrderGap=8   ; seconds (8 = the code default, 0 = off): an order from a different module to the same bot within this gap is refused, so two modules do not fight over one bot. No row
;PerMap=0   ; (recommended off until benched) 1 = a Dead Men map with a KLJoin.ini folder <F> reads a [Bots.<F>] section of this file before [Bots], re-read at every map load, so one map can have its own bot numbers. Row 'permap'
; --- FOLLOW-OUT extras (klescort.c; all need FollowOut=1 and, for the holds, FollowOutHold > 0)
;FollowOutCrewMoney=0   ; (recommended off until benched) 1 = the loyal crew's money in play counts toward FollowOutMoney, not only yours. Row 'followoutcrewmoney'
;FollowOutHoldAlone=0   ; (recommended off until benched) 1 = the hold also applies when you stand alone near the van, not only when you are aboard (range FollowOutHoldAloneRange, metres, 40 is a GUESS). Row 'followoutholdalone'
;FollowOutHoldAloneRange=40   ; metres, 1..100, only with FollowOutHoldAlone. No row
;FollowOutHoldUnshielded=1   ; 1 = hold a van that has no health object to shield (the code default, the old behaviour); 0 = do not hold it (Hasta loss still under investigation). No row: leave at 1
;FollowOutStopPlace=0   ; (recommended off until benched) 1 = the crew is sent to the place where the van waited the first time, not to the van while it drives in. Row 'followoutstopplace'
;FollowOutComeMoved=0   ; (recommended off until benched) 1 = a called bot that moved 2 m in 2 s counts as coming, for the holds. Row 'followoutcomemoved'
