; ---- THE AI HEISTERS AGAINST YOU (track O, 2026-10-11; klgrudge.c + klbot.c + klbalance.c; re/bots_fight.md).
; NOTHING OF IT HAS RUN IN THE GAME. These are SAMPLE LINES and they stand under [Net] here, where they do NOTHING even
; without the ';': a key only counts inside its own section, so copy a line into the [Balance] / the [Bots] section
; above (Windows reads the first section of a name only).
; into [Balance]:
;   how much of your bullet an AI heister takes (also one who has turned on you). 1.0 = Risk=2's: at 5 / 15 / 30 /
;   50 m he dies of 4 / 4 / 5 / 7 body hits of your rifle (one head shot at any range), you of 7 / 8 / 10 / 14 of his.
;   0.6 = 6 / 7 / 9 / 12. The police's hits on the crew are CopToCrew: not touched by this.
;YouToCrew=0.6
;   THE SPONGE BY RANGE: YouToCrew x 1 within YouToCrewNearAt metres, x YouToCrewFar from YouToCrewFarAt on, linear
;   between (with 0.6 and these: 6 / 8 / 14 / 23 body hits, 1 / 1 / 2 / 3 head shots). An APPROXIMATION: the game has
;   one number for all heisters, so the hook re-writes it for the one your last hit was on (for YouToCrewHold
;   seconds), else the nearest that has turned on you, else the farthest in play - the first bullet at a new target
;   can be priced for the old one. Not for a police player, not while you are the traitor. 1 or no key = off.
;YouToCrewFar=0.5
;YouToCrewNearAt=8
;YouToCrewFarAt=35
;YouToCrewHold=4
;   the same number while YOU are police (come back as a fed, FedMirror=1), flat at every range; no key = YouToCrew's
;   (track X2 proposes 0.4 with CrewToFed=1.0: see the [Balance] section's own sample lines)
;FedToCrew=1.0
;   what a heister's bullet costs you - only one who has turned shoots at you, so this is 'traitor -> you'
;CrewToYou=1.25
; into [Bots] (Enable=1 there):
;   every AI heister's health x this (252 -> 315 at 1.25). It makes them tougher against the police too: multiply
;   CopToCrew by the same number to keep that as it is. Not needed beside YouToCrew; it is the other way to it.
;   (klbot.c's Log=2 health log then says 'its maximum health changed ...' when it goes in or back: no loss.)
;CrewHealth=1.25
;   a bot that has turned (the game's own tactic or Backstab): health x this on top, accuracy raised to this per cent
;   (the crew has 50, one of the seven 90; not written when two bots share one accuracy block)
;BackstabHealth=1.5
;BackstabAim=85
;   1 = a turned bot also gets the game's 'traitor' bit in the score table, so that killing him cannot make YOU the
;   traitor (an ASSUMPTION is tested by it: read re/bots_fight.md 3.4 first). It changes the payout: a marked bot
;   that escapes keeps its own money and is out of the split.
;BackstabMark=0
;   with Tune=1: at most this many bots turn traitor in a ROUND (a dead or escaped traitor still counts; 0 = no cap;
;   four did in one round on 11 Oct)
;TraitorsMax=2
;   the picked bot's turn (Backstab=..) waits for its moment: within BackstabNear units of you (100 = 1 m), behind
;   you (a GUESS: judged by the way you MOVE, not where you look), while you are hurt - all that are set at once;
;   BackstabWait seconds after BackstabDelay was first over it turns anyway
;BackstabNear=1200
;BackstabBehind=1
;BackstabBusy=0
;BackstabWait=30
;   WHEN YOU SHOOT YOUR OWN CREW: each bot draws one of three tempers a round - ESCALATES (every hit makes him your
;   enemy for GrudgeBase + GrudgePer x per cent of his health you took seconds, GrudgeMax at most, for good from
;   GrudgeForGood per cent), SNAPS (your enemy for good at your first or second hit; GrudgeSnapHits=2 = always the
;   second, so one stray bullet is forgiven by everybody), TAKES IT (never). GrudgeMix = the three shares. The draw
;   is logged with Log=2 only.
;   KNOW BEFORE YOU SET IT: (1) KILLING a bot that fights you by Grudge makes YOU the traitor and all seven turn -
;   the game's own rule. GrudgeMark=1 gives a bot that turned on you FOR GOOD the game's traitor bit (as
;   BackstabMark; same payout effect), so killing that one is free; a bot that only answers for some seconds is
;   never marked. (2) With Escort=1 the escort is NOT turned on you while it escorts, unless klescort.c has the
;   three lines of re/bots_fight.md 4.4 (then it lets a turned escort go).
;Grudge=1
;GrudgeMix=40,30,30
;GrudgeSnapHits=2
;GrudgeMark=1
;GrudgeBase=2
;GrudgePer=0.15
;GrudgeMax=20
;GrudgeForGood=60
;GrudgeForget=45

; COME BACK AS A FED (klfed.c, re\fed.md) and THE FED'S KIT (klfedkit.c, re\fed_kit.md; the kit: NOT RUN IN THE GAME;
; a hook built before klfedkit.c was wired ignores its keys). Arcade only, never on a stock level. ONE [Fed] section:
; add further keys of it below, do not open a second one.
; Enable / Player / MinCrew / EndSeconds / Bots / Log: klfed.c's top comment.
; WHERE you come back is no key: the game draws, at random, one of the level's AFTER_DEATH spawn points that is not
; hidden (kl2 0x5614f0). The points are level data - tools\kl_fa_fedpoints.py judges and places them on a finished
; build, and on Retomoto switches the tower's off and the street's on at the join (re\fed_points.md).
; With Log=1 the place is said twice: 'fed: YOU ARE A FED ... at (x, y, z)' in the tick the game hands you the police
; body - on some maps that is before it is placed and reads (0, 0, 0) - and 'fed: YOU STAND at (x, y, z)' half a
; second later: judge by the second (a hook built before 2026-10-11 16:00 prints only the first).
; The kit acts only with Enable=1 and Player=1, and only while you ARE a police human in a running round:
;   Hunt=1       you may hurt the crew before anybody has looted (stock drops the hit and says 'No friendly fire until
;                the looting has started'): one byte of the round object, the game clears it at the next round
;   Crosshair=1  the crew red, the police green for a police human: one byte the Arcade round object never clears
;                (the cause is a reading of the code, NOT proven: the log's 'YOU ARE A FED' line prints the byte; 0
;                there = this key writes nothing). The hook puts the byte back when a heister is in play again.
;   Hunt and Crosshair are ON BY DEFAULT with a hook that has the kit as soon as Enable=1 and Player=1 stand: until
;   live checks K0 / K1 of re\fed_kit.md have run, give an ini that already has those two the line Kit=0.
;   Body=1      you wear the body the level's KLJoin.ini [FedBody] names (tools\kl_fa_fedbody.py: the park's bikers,
;                Retomoto's Japanese SWAT, Hot Coffee's FBI agents; the bank and Late Night Opening keep the SWAT body)
;                - the game's own model routine, once per respawn; 0 = the stock SWAT body everywhere
;   AkChance=N   per cent of respawns with an AK in place of the stock rifle (the owner asked for 'a chance': try 35)
;                - the game's own loadout routine with another row of its shop table, once per respawn; only when the
;                round's weapon pool has a free one of it and two free pistols. It takes the two guns the respawn gave
;                out of your hands (they are out of the pool until the next round: 2 of 16 pistols, 1 of 16 stock
;                rifles, 1 of 8 AKs a life). The riskiest key of the kit: not before live check K3.
;   AkItem=31    the rifle when the level's [FedBody] names none (31 AK-47, 32 AK-74; the owner's builds show the
;                M4A1 look on the AK-47, so their [FedBody] says 32). Never 6 or 29 (your own pistol / stock rifle:
;                refused)
;   Kit=0        none of the kit;  KitSettle=300 ms before the body changes;  KitLog=1 (2 = every write)
; A FED IS ONLY A FED (track S, 2026-10-11; re\fed_kit.md 10; NOT RUN IN THE GAME; data writes only; ON BY DEFAULT with
; Enable=1 and Player=1 like Hunt / Crosshair - Kit=0 keeps them all off):
;   NoTraitor=1  your kills of the crew leave no traitor mark and cost no 25,000. Arcade's rules make ANY human who kills
;                a loyal heister a traitor (kl2 0x8fb0d0; multiplayer's own routine leaves a policeman out, 0x41d4ac):
;                the mark is taken off again every frame and the penalty's number is held at 0 / at the pay while you
;                are a fed in play, and put back after. 0 = the game's rule (you turn 'Traitor' at the first kill)
;   Pay=1        each heister you kill pays what multiplayer pays a policeman for a criminal: the game's own number
;                (50,000), shown by the game's points pop-up ('+$50000') and put into your TOTAL at once - Arcade wipes
