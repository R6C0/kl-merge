;   Log: client "getup: beacon SENT", host "getup: beacon rx seat N" and "seat N IS DOWN ... (beacon)". See re/bot_getup_online.md section 7.
OnlineGetUpBeacon=0
; OnlineGetUpSprint (recommended on; proven live: BP18 + BP19 11-01, shipped ship1101; 0 = off): the get-up rush order is followed by the Defend move style Sprint, the mechanism of OnlineExitSprint, undone when the bot is released. GU6: a bot sent from 80 m walked 2.3 m/s and the joiner got up first. Only with OnlineGetUp 1.
; Log: "getup: bot N: rush at Sprint" and "Sprint style undone".
OnlineGetUpSprint=0
; OnlineGetUpReorderS (recommended on at 8; proven live: BP18 + BP19 11-01, shipped ship1101; 0 = off = the stock 2.5 s; 1..30 seconds; needs OnlineGetUp 1): the gap between the repeat rush orders to the same downed human. BP2: the bot was re-ordered every 3 s and ran stop-and-go (2.2 m/s on average); a downed man does not move, so the repeat only restarts the running goal (a guess; BP18 ran at 2.5 - 2.8 m/s with it).
OnlineGetUpReorderS=0
; OnlineGetUpKeepGoal (recommended on; proven live: BP18 + BP19 11-01, shipped ship1101; 0 = off = the repeat order every OnlineGetUpReorderS / 2.5 s; needs OnlineGetUp 1): after the first rush order the bot is NOT re-ordered while it still closes (>= 0.5 m between two 1 s checks) and the downed man moved < 2 m; it is re-ordered when it made no progress for 3 s or he moved. GUESS: each repeat restarts the running goal and the bot stops and starts again (closing speed 2.2 m/s in BP2/BP4).
; Log: "getup: bot N closing X m/s over 2 s" (both modes), "bot N KEEP goal at ..." and "bot N RE-ORDER at ... (target moved | stalled)".
OnlineGetUpKeepGoal=0
; OnlineGetUpDetour (recommended on; proven live: BP18 + BP19 11-01, shipped ship1101; 0 = off; needs OnlineGetUpKeepGoal 1): KeepGoal reads the straight-line distance, so a bot sent round a wall (distance grows first: 3.3 -> 12.8 m, 24.6 -> 15.9 -> 23.7 m) was called stalled and re-ordered mid-route. On: a bot that moved >= 3 m itself since its last progress counts as running (for up to 20 s after the order); a bot that stood by him and is 5 m out again is re-ordered at once; a bot standing within 1 m of the spot the game set for it and within OnlineGetUpNear of him has arrived (BP12: re-ordered every 3.5 s at 3.7 m while it stood there).
; Log: "getup: bot N RE-ORDER ..." lines should now only follow a real stall or a leave-the-seat.
OnlineGetUpDetour=0
; OnlineGetUpRecede (recommended on; proven live: BP18 + BP19 11-01, shipped ship1101; 0 = off; needs OnlineGetUpKeepGoal 1): a rushing bot (order at least 3 s old) whose distance to the downed man grows by 2 m or more between two 1 s checks, or ends more than 2 m
; beyond the distance it was ordered from, is re-ordered at once; Detour and KeepGoal no longer excuse it. BP13/BP14: the game seems to resume the bot's earlier goal (the walk to a stack or
; out to the van) under the rush order, the bot went from 14.7 m to 34 m and was never re-ordered. A bot closing in, or walking sideways, is left alone.
; Log: "getup: bot N RE-ORDER at X m (OnlineGetUpKeepGoal: receding; ...)".
OnlineGetUpRecede=0
; OnlineGetUpBusy (recommended on; proven live: BP18 + BP19 11-01, shipped ship1101; 0 = off; needs OnlineGetUp 1): as Arcade's Rush, a bot carrying money or walking out to the van also runs to a downed human (off: only an
; empty-handed bot, so late in a round nobody came). A bot taking a stack or aboard is never pulled; an exit walker walks out again once he is up.
; Log: "getup: bot N leaves its walk out (tally T) for seat S (OnlineGetUpBusy)".
OnlineGetUpBusy=0
; OnlineGetUpIgnoreVan (recommended on; proven live: IV2 + IV2OFF 11-01; 0 = off; needs OnlineGetUp 1): as Arcade (its rush ignores the van unless [Adrenaline] RushVan=1),
; a bot is still sent to a downed human while the escape van is called, waits or leaves (off: no helper then, the crew's van orders win).
; Log with it off: "getup: seat S is down while the van state is V: no helper (OnlineGetUpIgnoreVan=0)".
OnlineGetUpIgnoreVan=0
; OnlineGetUpFreeFirst (recommended on; proven live: BP18 + BP19 11-01, shipped ship1101; 0 = off; needs OnlineGetUp 1): a free bot (idle, or on its way to a stack with nothing carried) within OnlineGetUpRange is sent before any
; bot that is walking out or carrying money, however near that one is. Off: the nearest bot of any kind. Log: the "sent to seat" line names the bot's phase.
OnlineGetUpFreeFirst=0
; OnlineGetUpBusyRange (recommended on at 1500; proven live: BP18 + BP19 11-01, shipped ship1101; cm; 0 = off; needs OnlineGetUp 1 and OnlineGetUpBusy 1): a bot walking out or carrying money farther than this from the downed man is
; no candidate (a walker-out sent from 27 m ran away and back at -2.8 .. +4.3 m/s and came no nearer than 14.4 m). With none left: "no free bot is within ..." and he gets up alone.
OnlineGetUpBusyRange=0
; OnlineGetUpFlopMeter (recommended on at 3; proven live: BP18 + BP19 11-01, shipped ship1101 - the joiner saw the meter held at 3.0 7.5 s after the down; 0 = off; needs OnlineGetUp 1 on the downed machine): with [Down] Flop on, the knock-down is one long fall, so the bot's help
; never reached the meter (he got up alone after 19 s with a bot by him). On: while a bot stands within OnlineGetUpNear of his landed body, his flop mash meter is held at
; this value, as Arcade's helper does ([Adrenaline] Meter 3.0). Log: "down: online: a bot stands by him: the flop mash meter is held at 3.0".
OnlineGetUpFlopMeter=0
; OnlineGetUpHold (recommended on; proven live: BP18 + BP19 11-01, shipped ship1101 - HOLD #0/#1 at 105/116 cm (BP18), 3.1 m (BP19); 0 = off; needs OnlineGetUp 1 and, for the beacon place, OnlineGetUpBeacon 1): BP15 saw a rusher reach 3.6 m, walk off to 8 - 9 m and come back, twice, so the joiner's
; helper scan (4 m) saw it once for a moment. On: a rusher within 4 m of the downed man is ordered to a spot 1 m from him at most every 0.9 s until he is up, and the order place and distances use the
; downed machine's own place from its beacon (the host's replica of a diving body sat 1.6 - 1.9 m off). GUESS: the game pops back to the bot's earlier goal (its stack walk) when the rush goal completes.
; Once a bot has been held, it stays held while within 8 m (a held bot drifted to 4.0 m and walked off to 9 - 14 m). GUESS: 8 m.
; Log: "getup: bot N HOLD #k at X cm from seat S: ordered to ...".
OnlineGetUpHold=0
; OnlineGetUpPlateau (recommended on; proven live: BP18 + BP19 11-01, shipped ship1101, where it never had to fire; 0 = off; needs OnlineGetUp 1): BP16b (10-29) saw the rusher dither 9 - 14.7 m from the downed man for 18 s, re-ordered every ~3 s and never nearer: the order place
; (the joiner's beacon spot) was most likely unreachable for the host's path planner, which stops short (BP13 14.4 m, BP14 ~14 m, BP15 8 - 9 m the same). On: a rusher that is still more than
; stop + 5 m out and has not come a metre nearer in 5 s is given up: released, kept out of the pick for 10 s, and the seat's next bot is sent to the host's replica of the body (its feet) instead of
; the beacon place. With OnlineGetUpDetour on, a bot that moved 3 m or more itself and stands no more than 8 m beyond the distance it was ordered from is routing round something, not receding
; (no Recede re-order); a bot farther out than that is still caught (BP14's 14.7 -> 34 m). A bot carried 5 m or more back out from its nearest point starts a new 5 s clock there (else a bot
; that once stood near could never be given up). All six figures are guesses from the 10-29 note, not measured; BP17 (10-31) ran with it on and it never fired (the Hold hysteresis fixed that stall instead).
; Log: "getup: bot N GIVEN UP on seat S: nearest X m, no 1 m gained in T s ... (OnlineGetUpPlateau)"; the "closing" line now carries the bot's x,y,z, its set goal and the order place.
OnlineGetUpPlateau=0
; OnlineGetUpAnyHp (recommended off; needs OnlineGetUp 1): the downed machine's helper scan skips the bot health test (a joiner may read a replica's health as 0).
; Log: "getup: no helper by this machine's body ...: turned away: team N, health N, ..." every 10 s while nobody helps.
OnlineGetUpAnyHp=0
; OnlineVanCall (recommended on): the bots' van call (OnlineTacticsVan) accepts the hook's private rules vtable copy (klroundkeep.c). BO8c: the strict 0xbd2eb4 compare failed
;   against the copy, spent the call and the van never appeared. 0 = the old strict compare. Log: 'botfill: tactics: van: ... CALLED' or '... vtable ... vok 0 ...'.
OnlineVanCall=1
; OnlineVanState (recommended on): the bots decide "the van is here / I am aboard" from the vehicle state [rules+0x1dc] (3/4 = waiting) while standing at the exit trigger, not from the van's node
;   position (BO9: the ZAnimatedVehicle node stays at (0,0,0), so no bot ever boarded though the van cycled 1,3,5,7,0). The 60 s wait counts from the call; a van that left (7) ends it. 0 = old position test.
;   Log: 'van state A -> B (clock left ...)', 'BOARDED by van state'.
OnlineVanState=1
; OnlineLateExit (recommended on): seconds of round clock left at or below which a bot that carries money takes no new stack and goes to the van (0 = off). BO9: van call to leave is 24 s,
;   walks 2-3 m/s. GUESS 75 = 30 s door cutoff + 25 s walk + 20 s slack. Log: 'clock left ... <= OnlineLateExit'.
OnlineLateExit=75
; OnlineVanGather (recommended on): the first bot at the exit trigger no longer calls the van at once. Every living bot (also those still on a stack) walks to the box, and the van is called when all walking
;   bots are within OnlineGatherM of the box centre, or OnlineGatherMaxS seconds have passed, or the clock is at or below OnlineLateExit + 20 s. BO11: the carrier called at 189.8 s, the others were 28-41 m away and none boarded.
;   0 = the old rule (call at once). Log: 'van: gather: ...'. Calls and orders only.
OnlineVanGather=1
; OnlineGatherM (metres, GUESS 12): how close every walking bot must be to the box centre before the van is called. OnlineGatherMaxS (seconds, GUESS 25): the longest the gather waits.
OnlineGatherM=12
OnlineGatherMaxS=25
; OnlineGatherLateS (recommended 45; ran live 10-28 on stock DD04: the gather got its full 40 s, 7 of 7 bots aboard with OnlineExitCrowd=1600): seconds of round clock left at or below which the gather calls the van whatever the walkers' distance. 0 = the old rule (OnlineLateExit + 20 = 95 s left). BP_DD04: the 95 s clause called the van 18 s into a 40 s gather with walkers 59 m out at 2-3 m/s; they missed it. 45 = van call to departure is about 28 s, plus slack. GUESS 45. Log: 'the clock is low (OnlineGatherLateS)'.
OnlineGatherLateS=45
