; KLHook.ini - next to kl2.exe, beside dinput8.dll. Every key is optional; what is written here are the defaults,
; so a file with only [KLHook] behaves as before. klhook.c's top comment explains each key; klslot.c the expansion.
[KLHook]
ContinueAsserts=1
MaxDumps=4
MaxAsserts=200
; after a fatal fault was logged and dumped, end the process ourselves instead of leaving it to Windows Error
; Reporting (whose process snapshots linger as thread-less "kl2.exe" entries and keep dinput8.dll locked)
EndOnFatal=1
; log ExitProcess and the C runtime's exit / _exit; code 0x8000dead = the game's integrity check (a hashed byte
; was changed)
ExitLog=1
; drive the fixes from the game's main loop (import slot of SteamAPI_RunCallbacks); 0 = from a thread of our own
Tick=1
; the stall watch (klhook.c): the main thread gives no frame and no loader step for StallMs -> one log line with
; where it stands and KLHook_freeze.dmp; a silence over StallSayMs is logged with its length when it ends.
; StallEndMs (0 = never; at least 60000) ENDS the game after that much silence - a frozen full-screen game then
; gives the desktop back without a reset. Off: a level load without [Load] NudgeMs is silent for its whole length.
StallMs=30000
StallSayMs=3000
StallEndMs=0
; set the leaderboard row count the game never initialises (score-page crash); 0 = only log the value found
LbFix=1
; TEST build only (a SHIP build is always session-safe): 0 lets patches into hashed code, for direct-boot tests
;SessionSafe=1

; The expansion: maps in their own folders under KLExpansion\Maps, nothing stock replaced.
[Expansion]
Enable=0
;Root=KLExpansion
;Overlay=1
;Fallback=1
;Log=1
; -1 = the menu decides: the hook reads which map page is open (window HeistPlayMenu<N>) and keeps it until the
; frontend shows another page again; 0..9 = always that page (direct-boot tests, which have no menu)
;Page=-1

; <slot folder under Scenes\Locations> = <folder under KLExpansion\Maps>, on every menu page
[Redirect]
;F01=DM03

; the same for the expansion's own menu page 2 (built into KLExpansion\Overlay\Patch01.zip by mkoverlay.py)
;[Redirect.2]
;F01=DM03
;F02=DM01
;[Page.2]
;Title=Dead Men maps
;F01=Withdrawal
;F02=The Diner
;F01.Picture=LevelPicture_L09
; mkoverlay.py only: Icon= the button's icon (default Icon_Marketplace), Pictures=slot = each entry keeps the stock
; Arcade picture of its slot (default 'story': the story-mode picture LevelPicture_L0<slot>)
;Icon=Icon_Marketplace
;Pictures=story

; name mode: the engine loads another scene name for a slot (level supplied through KLExpansion\Overlay)
[Slots]
;F09=Locations/F0M03/F0M03_Main

; Steam write guard (klsteam.c): no leaderboard upload, stat or achievement from a level that is not the stock
; level of its slot; a TEST build never writes at all. There is no off switch.
[Steam]
; 1 = block on levels that are not stock (stats then stay blocked until the game is restarted), 2 = block always
Block=1
; 1 = each blocked / passed write once per level, 2 = every one, 0 = none
Log=1
; 'session: state a -> b' lines; state 0x28 = the session ends and the game uploads
State=1
; 0 = while the upload is blocked, FindOrCreateLeaderboard fails too: the score page of an expansion map then shows
; no rows of the stock map's board (not run live yet: re\hook_live.md check S5)
StockRows=1

; Jump boxes (kljoin.c): a two-part level joined by the game's own jump request. Normally they come from
; KLJoin.ini beside the level's archive (klhook\KLJoin.retomoto.ini); here for tests, active on every level
; unless Scene= names one. [KLHook] Join=0 switches all boxes off.
;[Join]
;Min=2550 19500 800
;Max=2790 19800 1100
;Entry=5
;Name=06_Exit
;Target=6272 563 -6305
;Scene=F01

; The heister the player chose (klchar.c): written by the menu page 'Heister' of the expansion's overlay, or by hand.
; Arcade only. A Dead Men body and the mix of masks need a level built with `kl_chars.py wardrobe` (KLWardrobe.ini
; beside its archive); on any other level Char 1..8 and Mask 1 / 2..9 = off / the heister's own mask still work.
[Character]
Enable=1
; 0 = whoever the game gives, 1..8 = J.C. Tommy Pierre Liam Jean Elwood Bud Mitchel, 9..16 = Kane, Lynch, Dead Men crew 1..6
Char=0
; 0 = as 'Criminal Masks' in the game's options, 1 = no mask, 2..9 = the mask of heister 1..8
Mask=0
; 0 = standard, 1 = armoured (Dead Men bodies)
Outfit=0
;Settle=300
;Tries=3
;Log=1

; Room for bigger levels (klmem.c): the game has 2 GB of address space and reads a level's models into one block.
[Memory]
Enable=1
; address space kept free in one piece from the start (klmem.c): a level's .prm block always lives in it, and so
; does any block of 1 MB or more that the heap can no longer place; 0 = off
ReserveMB=128
; NOT RUN IN THE GAME: RoomMB=128 together with ReserveMB=176 puts every block of 16 MB or more into the reserve
; once the largest free piece outside is under 128 MB (from the second level load on)
;RoomMB=0
; 0 = the game's threads keep their 4 MB stacks; 1 or 2 = that many MB for the threads the game starts itself
; (about 100 MB back with 1; not measured whether a game thread needs more - try it on purpose)
StackMB=0
;Log=1

; Load-time experiment E1 of re/loading.md (klnudge.c). Off as shipped.
[Load]
; 0 = off; 1000 = the game's cursor nudge (once per load step and per frame while it is in front) once a second only
NudgeMs=0
; 1 = control run: count the calls and log them, change nothing
Count=0

; Switchable looks of guns (klgun.c): Dead Men models on Dog Days guns, on a level built by tools/kl_guns.py (KLGuns.ini
; beside its archive). Written by the menu page 'Guns' of the expansion's overlay, or by hand.
[Guns]
Enable=1
; the starting rifle: 0 = Zastava, 1 = MP5 (Dead Men), 2 = AK-74
Start=0
; the other guns of the file: 0 = Dog Days, 1 = their Dead Men look
Set=0
;Log=1

; Random AI heisters (klcrew.c): each Arcade round the AI crew is a new draw from the level's wardrobe (the eight Dog
; Days mercenaries and the eight Dead Men heroes, outfit and mask at random), never the body the player wears or chose.
; NOTHING OF IT HAS RUN IN THE GAME. Off as shipped. Only on a level that is not the stock one of its slot, and it
; needs [Character] Enable=1 for the wardrobe (without one the level's own eight bodies are shuffled).
[Crew]
Random=0
; 0 = a new seed each start (logged); any other number repeats the same draws
;Seed=0
; weight of each Dog Days / Dead Men body (0 = none of that game)
;DogDays=1
;DeadMen=1
; characters that are always in the crew when free, e.g. 9,10 = Kane and Lynch
;Include=
; 0 = every Dead Men body in plain clothes
;Outfits=1
; 0 = faces only, 1 = each bot masked with MaskChance percent, 2 = all masked; PaydayMasks=0 = the eight Dog Days masks only
;Masks=1
;MaskChance=50
;PaydayMasks=1
; 0 = the voice table is left alone; Names=1 also renames the bots (two more game calls)
;Voice=1
;Names=0
;Settle=600
;Tries=3
;Log=1

; The AI crew follows the jump of a two-part level (klcrew_rt.c): on a level whose KLJoin.ini has a [CrewJoin] section
; (Retomoto with bots, tools\kl_fa_bots_rt.py) the AI heisters are put in front of the jump entry by the game's own
; actor teleport when the player's jump is requested. NOTHING OF IT HAS RUN IN THE GAME. Off as shipped. Needs
; [KLHook] Join=1 (the default). The full Retomoto bots build must not be played without it.
[CrewJoin]
Enable=0
; 1 = after a LATE teleport the entry's 'AITrigger' list is sent again
;Retrigger=0
;Log=1

; The AI crew gets over a place the navigation mesh does not carry it over (klhop.c): on a level whose KLJoin.ini has
; a [CrewHop] section (Withdrawal: the yard wall; tools\kl_fa_bots.py writes it) an AI heister that has stood at the
; gather place for the section's Wait seconds is put on a landing place beyond it by the game's own actor teleport.
; NOTHING OF IT HAS RUN IN THE GAME. Off as shipped. Arcade only, never on a stock level. re\bots_bank.md
[CrewHop]
Enable=0
; 1 = everything is watched and logged, nothing is called (the first live check)
;Dry=0
; 1 = half a second after a hop the soldier gets the order it already holds once more (if the bots land and stand)
;Reorder=0
; 2 = also, every 5 s, where every AI heister stands against every hop
;Log=1

; Kane and Lynch talk (kltalk.c): on a level with a KLTalk.ini beside its archive (tools\kl_fa_talk.py) the scripted
; scenes (Retomoto: Kane's countdown to the blast, the Kane / Lynch exchanges) and idle / combat chatter are said
; through the game's own speech call, when somebody in the round wears Kane or Lynch. NOTHING OF IT HAS RUN IN THE
; GAME. Off as shipped. Needs [Character] Enable=1 and the level's PC_Def.str (the hook refuses a smaller one).
[Talk]
Enable=0
; 0 = the scenes only, no chatter
;Chatter=1
; seconds added to every 'Start' delay (may be negative): the round-start moment is one observation (re\talk.md 3.3)
;StartOffset=0
; 1 = nothing is called, every line is logged as 'would say' (the timing run, check T1)
;LogOnly=0
;Seed=0
; 2 = also the triggers (stage, aboard, join, boxes) as they are seen
;Log=1

; The AI heisters of an Arcade round (klbot.c; its top comment is the spec). NOTHING OF IT HAS RUN IN THE GAME.
; Off as shipped; with Enable=1 alone it only logs. Every part has its own key and does nothing outside Arcade.
[Bots]
Enable=0
; the crew records (who is a bot, in play / aboard / dead, heist stage, money, traitor) in KLHook.log:
; 0 = none, 1 = when something changed and every 10 s, 2 = every second
;Log=1
; BACKSTAB, the game's own rule. Stock: no bot may betray on Arcade levels 1-3 (1 on 4-5, 2 on 6-8, 3 on 9-10, 4 on
; 11) and it needs 7 points of 9 (far into the heist + the bot rich + you poor). Tune=1 writes: at least Traitors
; allowed on every level and Limit points; Retaliate = damage you may do to a bot before it turns on you (0 = stock:
; 100 on level 1 down to 25 from level 7). Per level: Traitors.<1..11>= and Limit.<1..11>=
;Tune=1
;Traitors=1
;Limit=6.0
;Retaliate=0
; BACKSTAB on demand: percent per round that one bot is picked; it turns when it has reached heist stage
; BackstabStage (1 in the bank, 2 out of it, 3 at the vehicle) with BackstabMoney or more, for BackstabDelay seconds
;Backstab=25
;BackstabStage=2
;BackstabMoney=250000
;BackstabDelay=20
; PAY THE DRIVER: percent that a bot aboard for BribeDelay seconds with BribeMoney or more pays half of it and the
; vehicle leaves at once - only while you are in play and not aboard
;Bribe=30
;BribeMoney=500000
;BribeDelay=4
; LEAVE WITHOUT YOU: percent (once per vehicle) that it leaves when every bot still in play is aboard and you are
; farther than LeaveDistance (100 = 1 m) from the boarding point for LeaveDelay seconds
;Leave=50
;LeaveDistance=4000
;LeaveDelay=3
; BLOW THE VAN UP - the one part that CALLS a game rule; try Van=1 first. 1 = 'heavily damaged' (it drives off at
; once), 2 = destroyed (everybody aboard dies). A traitor bot standing at the waiting vehicle with somebody aboard,
; for VanDelay seconds, VanChance percent; VanLeftBehind=1: also a bot left behind while the vehicle drives out
;Van=0
;VanChance=50
;VanDelay=5
;VanLeftBehind=0
; ESCORT (klescort.c; NOT RUN IN THE GAME): 1 or 2 AI heisters stay near YOU and fight beside you, the others keep
; their routes. One game call per order (the soldier's own 'defend this place'), no write, never a teleport. The
; escort is called when you are farther than EscortFar (100 = 1 m) from it, to a place EscortSide beside you; it is
; let go when the vehicle waits (EscortUntil=1: already while it drives in) and then sent to the boarding place.
; EscortDry=1 chooses and logs but calls nothing - the first live check. Needs Enable=1 above.
;Escort=0
;EscortDry=0
;EscortFar=800
;EscortSide=300
;EscortRetarget=500
;EscortEvery=2
;EscortUntil=3
;EscortStage=0
;EscortBoard=1
;EscortRefill=0
;EscortRecord=-1
;EscortLog=1
; BoardAll=1: nobody is left held by loot - while the escape vehicle waits, an AI heister at heist stage 1 or 2 that has
; neither moved 1 m nor earned anything for BoardAllStill seconds gets heist stage 3 (ONE byte of its crew record; the
; game's loot tactic lets go at stage 3 and its board tactic takes the bot to the vehicle). BoardAllStill=0: every bot
; at stage 1 or 2. BoardAllStage=0: nothing is written, the pass only logs. BoardAllOrder=1: also one order to the
; boarding place per visit. Works without Escort. EscortDry=1 logs only. DO NOT combine with Van / VanLeftBehind.
;BoardAll=0
;BoardAllStill=15
;BoardAllStage=1
;BoardAllOrder=0
; FollowOut=1: THE CREW FOLLOWS YOU OUT (klescort.c section 3, re\bots_follow_out.md; NOT RUN IN THE GAME). Stock Arcade
; shoots every AI heister that is not aboard while the vehicle drives out with you (one about every second). With
; this key, once YOU have heist stage 3 (you stood in the exit trigger: the vehicle is called) and carry FollowOutMoney,
; every AI heister in play that is no traitor gets heist stage 3 (one byte: its loot tactic lets go while the vehicle
; waits, its board tactic runs to it) and, while the vehicle drives in and is 2 s or more away, one order to the
; boarding place. FollowOutAfter = seconds between your stage 3 and the call. FollowOutOrder=0: the byte only.
; FollowOutHold=N: the driver waits for them - while you sit aboard and called crew still COMES (2 m nearer to the
; boarding place in 2 s; a bot that stands, fights or walks the other way does not count), the vehicle's timer
; gets up to 5 s more each time it falls under 2 s, N seconds a visit at most (the float and the 5 s of the game's own
; 'hold the driver' rule, written more often than that rule's once; 0 = never, 15 is a fair first value; a vehicle
; that waits longer can be shot to pieces with you in it).
; FollowOutSpare=1 (works alone): whoever is still not aboard when it drives out is NOT shot - left in play; the
; round ends 3 s after your escape as ever. FollowOutDry=1: every line, nothing written or called - the first live
; check. Needs Enable=1 above. Not with VanLeftBehind=1. Your stage is never taken back: step into the exit box, go
; back inside, and the crew leaves without you.
; TWO PRICES of FollowOut / FollowOutHold (FollowOutSpare has neither):
; - YOUR CUT: at the round's end the game pays every heister who escaped and is no traitor the SAME share - what they
;   carried together, over their number. Every bot these keys get aboard joins that split: more for you if it carried
;   more than the rest, less if less. (Those shot or left in play get nothing, with or without the keys.)
; - TRAITORS: a called bot counts as 'at the vehicle' for the game's own traitor tactic. On Arcade level 4 and up
;   a bot that was inside the building, where it could not turn, now can (with Tune=1: on every level, with less money).
;FollowOut=0
;FollowOutDry=0
;FollowOutMoney=1
;FollowOutAfter=0
;FollowOutOrder=1
;FollowOutEvery=2
;FollowOutHold=0
;FollowOutSpare=0
; THE CREW KEEPS MOVING, WAITS FOR YOU, WALKS TO THE CAR (klmove.c, re\bots_move.md; NOT RUN IN THE GAME). Needs Enable=1.
; Restless=N (seconds; try 5): an AI heister that has stood N s without moving 1 m or earning -
;   on a money object that pays nothing (within RestlessLootNear of it, RestlessLoot seconds): FED UP - the object is
;   no loot candidate for any AI heister for RestlessLootBack seconds (doubled each time it sours again; back at once
;   when a case is opened or somebody takes a part; YOU can always take it; only a bot inside the heist - stage 1 or
;   more - that is not under fire and has no grab running is judged);
;   more than 3 m from the place its route ordered and not under fire: that order is given again (the third time:
;   beside you; six orders for one place at most).
;   A bot AT its ordered place is on a meant wait (a gate, a cover hold, the place beside the van) and is left alone -
;   unless RestlessHold=N: then it shifts RestlessPace round that place every N s (not under fire, not in an escape box).
; WaitForYou=1: no vehicle is called before you have heist stage WaitForYouStage (3 = only YOUR step into the exit
;   box calls it, 2 = once you have left the building, 1 = once you are inside) - a bot in the exit box gets its stage
;   and waits; released after WaitForYouMax s from the first bot that stood ready, and when you are dead / a fed /
;   aboard. WaitForYouFloor=N: no vehicle in the round's first N s whatever your stage. WaitForYouHold=N: while a
;   vehicle waits and you COME (2 m nearer in 2 s, or within 15 m), its timer gets up to 5 s more under 2 s, N s a
;   visit at most. THE ROUND CLOCK IS RED while the crew waits (the byte is also the HUD's 'last vehicle' colour), and
;   the crew stands in the open at the vehicle's stop meanwhile. The owner did not ask for this key.
; BoardNear=N (100 = 1 m): an 'ally escape box' farther than N from the vehicle's boarding place takes no AI heister
;   aboard (today a bot in such a box 43 m away in the bank's yard is 'aboard' at once). 1500 = the boxes beside the
;   van still work; 300 = no box works, a bot must run to the vehicle's doors (its own board tactic, within 3 m).
;   BoardNearVisits=N: from the Nth visit of a vehicle on every box works again (nobody is stranded for good).
;   BoardNearStage=1: a bot under heist stage 3 standing at a denied box gets stage 3, so that it walks.
;   COST: a bot the far box used to save has 8 s a visit to walk; when the vehicle leaves WITH YOU ABOARD the game
;   shoots whoever is still in play. Use it with FollowOutHold=15 (the driver waits for them) or FollowOutSpare=1.
; MoveDry=1: every line of the three, nothing written, called or wrapped - the first live check. MoveLog=2: more lines.
;Restless=0
;RestlessLoot=
;RestlessLootBack=30
;RestlessLootNear=200
;RestlessHold=0
;RestlessPace=350
;WaitForYou=0
;WaitForYouStage=3
;WaitForYouFloor=0
;WaitForYouMax=150
;WaitForYouHold=15
;BoardNear=0
;BoardNearVisits=3
;BoardNearStage=1
;MoveDry=0
;MoveLog=1

; One dial for what a bullet costs whom in an Arcade round (klbalance.c; re\balance.md). Off as shipped. Arcade only,
; and never on a stock level: the game's own numbers are kept and come back when the session ends or the level is
; stock. IN THE OWNER'S GAME since 2026-10-10: the six factors and the health part. NOT RUN YET: CrewOffStage, the
; PointBlank keys.
[Balance]
Enable=0
; 0 = no log, 1 = once per round object: the stock table, the player blocks, your health object, what was written;
; 2 = also a line for every loss of health ('you lost 6.1')
;Log=1
; 0 = stock, the default (Arcade level 1: a policeman's bullet costs you a tenth, yours costs him double), 1 = less
; lopsided, 2 = the same for everybody + your health 550 -> 400, 3 = the same + your health 280 (an AI heister's)
;Risk=2
; 1 = a later Arcade level is never easier than stock, 0 = the dial's numbers on every level
;Ramp=1
; single numbers, each beats the dial: damage factors ...
;CopToYou=1.0
;YouToCop=1.0
;CopToCrew=1.0
;CrewToCop=1.0
;CrewToYou=1.0
;YouToCrew=1.0
; ... and what is LEFT of an AI heister's hits on police while he is at another heist stage than you (stage: not in
; yet / inside / out again / at the vehicle - so with you outside and the crew inside, or the crew gone ahead to the
; van). The game: 0.5 on Arcade levels 1-3, falling to 0.1 on 10-11. 1.0 = he hits the same wherever you are;
; -1 = the game's own, also under a Risk. Risk=1 sets 0.75, Risk=2 and 3 set 1.0. With Ramp=1 it is lowered on later
; levels so that CrewToCop x this is never more than in the stock game (Risk=2: 1.0 on levels 1-3, 0.76 / 0.48 / 0.39
; on 4-6, the game's own from 7); set alone, without a Risk or a lower CrewToCop, it then changes nothing: add Ramp=0.
; One number of 0 .. 20 with a decimal POINT: '0,75' or any other text is ignored (the log says so), not read as 0
;CrewOffStage=1.0
; ... your health as a factor of what the game gives (550 + armour), and how it comes back (seconds)
;PlayerHealth=0.73
;RegenDelay=8
;RegenTime=8
; ... and the POINT-BLANK RULE (re\melee_damage.md; NOT RUN YET). What looks like a guard's melee is the game's own
; rule for a soldier whose target stands within 1.6 m: at every step of his burst (0.1 .. 0.2 s) the target gets one
; hit of his gun TIMES 100. The factors above multiply it like any bullet - CopToYou=0.02 still leaves a Type 79
; guard 151 a step, Risk=2's 1.0 makes it 7,560 - so it has keys of its own, by VICTIM: how many ordinary bullets of
; his gun one step is worth. 100 = the game's own (the steps are then only seen and logged), 1 = one bullet,
; 0 = none; no key or a negative number = left alone. No Risk sets them, Ramp does not touch them. One number of
; 0 .. 100 with a decimal point. ToCop = what an AI heister's own step costs a policeman. Needs [KLHook] Tick=1.
;PointBlankToYou=2
;PointBlankToCrew=2
;PointBlankToCop=100

; The expansion's Fragile Alliance / Arcade HUD, Version 1 (klhud.c; re\hud_hook.md): a crew list top-left (every heister
; with the cash he carries: you blue, a traitor amber, dead grey, escaped green) and a money box under the round timer
; (Total / Loot / Banked / Round), drawn with the game's own text objects; the stock top-left block hidden. Arcade only.
; NOTHING OF IT HAS RUN IN THE GAME. Off as shipped.
[HUD]
Enable=0
; 0 none, 1 on / texts made / stock block hidden / faults, 2 + every text change
;Log=1
;Crew=1
;Money=1
;HideStock=1
; drop shadows under the texts (the timer has them)
;Shadow=1
; positions on the game's 1280 x 720 virtual screen: the crew list's first row, the money box (right-aligned), pixels a row
;CrewX=64
;CrewY=36
;MoneyX=1216
;MoneyY=100
;Row=22
;Rows=8
; the texts' layer byte (15 = the timer's)
;Layer=13
; -1 = the game's 5 % inset stays; e.g. 0.03 is written to [0xceeebc] once per level
;Inset=-1

; a log of the game's vision grid and of the 16 bytes a target outside it writes behind it (klvis.c; reads only): the
; check of re\crash_686a66.md - Retomoto's parked vans. 1 = one line per level with the grid, one if the write is seen.
[Vis]
Log=0

; MULTIPLAYER, first piece (klnet.c, re\netcode_fa.md; NOT RUN IN THE GAME; a hook built before klnet.c was wired
; ignores this section). It makes and joins no lobby and has nothing to do with the level redirect.
; Log: 1 = for a network session (this machine hosts or has joined) one line each for who hosts, the rules class, the
;   level index the peers were given, the Steam lobby (a HOST: private / public / ranked, as the game derived it; a
;   machine that JOINED: the id and the ranked byte only - a client cannot see the lobby's kind) and
;   the twelve update numbers of the netcode; reads only. 2 = also for local sessions (Arcade).
; Tune: 1 = the numbers below are written (data only) - ONLY in a Fragile Alliance network session, after its load, on
;   a level that is not the stock one of its slot, and ONLY WHEN THIS MACHINE HOSTS a lobby the game itself made
;   private (friends only) and not ranked: that is read from memory. They go back when the session ends.
;   Only the SENDER's numbers count, so every player needs the same lines. -1 = that number is left as the game has it.
; TuneClient: 1 = the tune also acts when this machine has JOINED somebody's session. The game does not tell a
;   client whether the lobby is private, so this key is YOUR WORD that it is: set it only for an evening in a
;   friend's friends-only lobby joined by invitation, never use Quick Match or the server browser while it stands,
;   and take it out afterwards. (The hook still refuses when the join's ranked byte is set, and on a stock map.)
;   PlayerMs   least time between two updates of a player's position / heading (stock 100; camera 2x, aim 1.5x)
;   RefreshMs  an update is forced after this long (stock 2000): how long a remote player can keep turning on a lost packet
;   PosTol / AngTol  how far the remote prediction may be off before an update goes out (stock 20 units / 30 = 10.5 degrees)
;   Actor...   the same four for AI (the host's machine). A first try: PlayerMs=50 RefreshMs=300 AngTol=12
[Net]
Log=0
Tune=0
TuneClient=0
;PlayerMs=-1
;RefreshMs=-1
;PosTol=-1
;AngTol=-1
;ActorMs=-1
;ActorRefreshMs=-1
;ActorPosTol=-1
;ActorAngTol=-1

; ---- THE AI HEISTERS AGAINST YOU (track O, 2026-10-11; klgrudge.c + klbot.c + klbalance.c; re/bots_fight.md).
; NOTHING OF IT HAS RUN IN THE GAME. These are SAMPLE LINES and they stand under [Net] here, where they do NOTHING even
; without the ';': a key only counts inside its own section, so copy a line into the [Balance] / the [Bots] section
; above (Windows reads the first section of a name only).
; into [Balance]:
;   how much of your bullet an AI heister takes (also one who has turned on you). 1.0 = Risk=2's: at 5 / 15 / 30 /
;   50 m he dies of 4 / 4 / 5 / 7 body hits of your rifle (one head shot at any range), you of 7 / 8 / 10 / 14 of his.
;   0.6 = 6 / 7 / 9 / 12. The police's hits on the crew are CopToCrew: not touched by this.
;YouToCrew=0.6
;   THE SPONGE BY RANGE: YouToCrew x 1 within YouToCrewNearAt metres, x YouToCrewFar from YouToCrewFarAt on, linear
;   between (with 0.6 and these: 6 / 8 / 14 / 23 body hits, 1 / 1 / 2 / 3 head shots). An APPROXIMATION: the game has
;   one number for all heisters, so the hook re-writes it for the one your last hit was on (for YouToCrewHold
;   seconds), else the nearest that has turned on you, else the farthest in play - the first bullet at a new target
;   can be priced for the old one. Not for a police player, not while you are the traitor. 1 or no key = off.
;YouToCrewFar=0.5
;YouToCrewNearAt=8
;YouToCrewFarAt=35
;YouToCrewHold=4
;   the same number while YOU are police (come back as a fed, FedMirror=1), flat at every range; no key = YouToCrew's
;FedToCrew=1.0
;   what a heister's bullet costs you - only one who has turned shoots at you, so this is 'traitor -> you'
;CrewToYou=1.25
; into [Bots] (Enable=1 there):
;   every AI heister's health x this (252 -> 315 at 1.25). It makes them tougher against the police too: multiply
;   CopToCrew by the same number to keep that as it is. Not needed beside YouToCrew; it is the other way to it.
;   (klbot.c's Log=2 health log then says 'its maximum health changed ...' when it goes in or back: no loss.)
;CrewHealth=1.25
;   a bot that has turned (the game's own tactic or Backstab): health x this on top, accuracy raised to this per cent
;   (the crew has 50, one of the seven 90; not written when two bots share one accuracy block)
;BackstabHealth=1.5
;BackstabAim=85
;   1 = a turned bot also gets the game's 'traitor' bit in the score table, so that killing him cannot make YOU the
;   traitor (an ASSUMPTION is tested by it: read re/bots_fight.md 3.4 first). It changes the payout: a marked bot
;   that escapes keeps its own money and is out of the split.
;BackstabMark=0
;   with Tune=1: at most this many bots turn traitor in a ROUND (a dead or escaped traitor still counts; 0 = no cap;
;   four did in one round on 11 Oct)
;TraitorsMax=2
;   the picked bot's turn (Backstab=..) waits for its moment: within BackstabNear units of you (100 = 1 m), behind
;   you (a GUESS: judged by the way you MOVE, not where you look), while you are hurt - all that are set at once;
;   BackstabWait seconds after BackstabDelay was first over it turns anyway
;BackstabNear=1200
;BackstabBehind=1
;BackstabBusy=0
;BackstabWait=30
;   WHEN YOU SHOOT YOUR OWN CREW: each bot draws one of three tempers a round - ESCALATES (every hit makes him your
;   enemy for GrudgeBase + GrudgePer x per cent of his health you took seconds, GrudgeMax at most, for good from
;   GrudgeForGood per cent), SNAPS (your enemy for good at your first or second hit; GrudgeSnapHits=2 = always the
;   second, so one stray bullet is forgiven by everybody), TAKES IT (never). GrudgeMix = the three shares. The draw
;   is logged with Log=2 only.
;   KNOW BEFORE YOU SET IT: (1) KILLING a bot that fights you by Grudge makes YOU the traitor and all seven turn -
;   the game's own rule. GrudgeMark=1 gives a bot that turned on you FOR GOOD the game's traitor bit (as
;   BackstabMark; same payout effect), so killing that one is free; a bot that only answers for some seconds is
;   never marked. (2) With Escort=1 the escort is NOT turned on you while it escorts, unless klescort.c has the
;   three lines of re/bots_fight.md 4.4 (then it lets a turned escort go).
;Grudge=1
;GrudgeMix=40,30,30
;GrudgeSnapHits=2
;GrudgeMark=1
;GrudgeBase=2
;GrudgePer=0.15
;GrudgeMax=20
;GrudgeForGood=60
;GrudgeForget=45

; COME BACK AS A FED (klfed.c, re\fed.md) and THE FED'S KIT (klfedkit.c, re\fed_kit.md; the kit: NOT RUN IN THE GAME;
; a hook built before klfedkit.c was wired ignores its keys). Arcade only, never on a stock level. ONE [Fed] section:
; add further keys of it below, do not open a second one.
; Enable / Player / MinCrew / EndSeconds / Bots / Log: klfed.c's top comment.
; WHERE you come back is no key: the game draws, at random, one of the level's AFTER_DEATH spawn points that is not
; hidden (kl2 0x5614f0). The points are level data - tools\kl_fa_fedpoints.py judges and places them on a finished
; build, and on Retomoto switches the tower's off and the street's on at the join (re\fed_points.md).
; The kit acts only with Enable=1 and Player=1, and only while you ARE a police human in a running round:
;   Hunt=1       you may hurt the crew before anybody has looted (stock drops the hit and says 'No friendly fire until
;                the looting has started'): one byte of the round object, the game clears it at the next round
;   Crosshair=1  the crew red, the police green for a police human: one byte the Arcade round object never clears
;                (the cause is a reading of the code, NOT proven: the log's 'YOU ARE A FED' line prints the byte; 0
;                there = this key writes nothing). The hook puts the byte back when a heister is in play again.
;   Hunt and Crosshair are ON BY DEFAULT with a hook that has the kit as soon as Enable=1 and Player=1 stand: until
;   live checks K0 / K1 of re\fed_kit.md have run, give an ini that already has those two the line Kit=0.
;   Body=1      you wear the body the level's KLJoin.ini [FedBody] names (tools\kl_fa_fedbody.py: the park's bikers,
;                Retomoto's Japanese SWAT, Hot Coffee's FBI agents; the bank and Late Night Opening keep the SWAT body)
;                - the game's own model routine, once per respawn; 0 = the stock SWAT body everywhere
;   AkChance=N   per cent of respawns with an AK in place of the stock rifle (the owner asked for 'a chance': try 35)
;                - the game's own loadout routine with another row of its shop table, once per respawn; only when the
;                round's weapon pool has a free one of it and two free pistols. It takes the two guns the respawn gave
;                out of your hands (they are out of the pool until the next round: 2 of 16 pistols, 1 of 16 stock
;                rifles, 1 of 8 AKs a life). The riskiest key of the kit: not before live check K3.
;   AkItem=31    the rifle when the level's [FedBody] names none (31 AK-47, 32 AK-74; the owner's builds show the
;                M4A1 look on the AK-47, so their [FedBody] says 32). Never 6 or 29 (your own pistol / stock rifle:
;                refused)
;   Kit=0        none of the kit;  KitSettle=300 ms before the body changes;  KitLog=1 (2 = every write)
[Fed]
Enable=0
;Player=0
;Hunt=1
;Crosshair=1
;Body=0
;AkChance=0
;AkItem=31
;Kit=1
;KitSettle=300
;KitLog=1

; ---- THE PLAYER GOES DOWN AND MASHES HIS WAY UP (track R, 2026-10-11; kldown.c; re\player_down.md).
; NOTHING OF IT HAS RUN IN THE GAME. Off unless Enable=1; Arcade on a level that is not stock only; not for a police
; player (a fed); data writes only.
; The game already floors the human ('down not dead': he falls, lies, ONE press of GET UP - the Cover key, C / pad A -
; and he is up in 0.8 s). This part makes the get-up a mash and lets the game's own trigger be set.
;   Dry=1        nothing is written: the log says every fall and get-up, the speed the mash WOULD set, and where the
;                keys' trigger WOULD have floored him (an estimate from his health)
;   Log=1        the falls and get-ups;  2 = the get-up four times a second (frame, speed, meter, presses)
;   THE GET-UP: its clip is played at Base + PerPress x the mash meter, at most Top. The meter gains 1 at every press
;   of the game's own GET UP button (whatever it is bound to) and loses Decay a second. 1.0 = the game's speed (0.8 s).
;   Base=0.5     no press: 1.6 s (the owner's 'slow'; 0.25 = 3.2 s)
;   PerPress=0.3 with these four numbers (a 20-frame get-up, worked out, not seen): no press 1.6 s, 2 presses a
;                second 1.3 s, 4 a second 1.0 s, 6 a second 0.85 s, 10 a second 0.7 s
;   Top=2.0      the ceiling (0.4 s if it were held from the first frame)
;   Decay=2.0
;   THE TRIGGER, the game's own rule (each key: no key or -1 = the game's number stays): he goes down at a hit when his
;   health is at or under HealthPct per cent AND the hits of at least MinHit that he took within Window seconds add
;   up to Burst x MinHit; the hit that floors him costs nothing; he then has at least DownHealth and cannot go down
;   again for Cooldown seconds.
;   HealthPct=40   the game's 40.  60 = sooner
;   Burst=1        the game's 6 (120 health in a second). 1 = ONE counted hit floors a hurt man - the nearest this rule
;                  comes to the AI heisters' (they go down at the hit that takes their last health)
;   MinHit=20      the game's 20
;   Window=1.0     the game's 1.0
;   Cooldown=10    the game's 10
;   DownHealth=200 the game's 80 (of the owner's 401.5: a fifth). PROPOSED BESIDE Enable=1: 200. Lying and getting up
;                  he takes FULL damage (only the fall is free) and the slow get-up doubles that time; a police bullet
;                  is 75 under Risk=2, so with the game's 80 the part would only make him die more often than stock.
;                  Written as his maximum health at most. A guard at arm's length still kills a lying man at once:
;                  [Balance] PointBlankToYou is the key for that
;   The get-up always ends: at the latest after the whole clip at Base speed + 0.25 s.
;   The mash key is the Cover key: the first press AFTER he stands is an ordinary Cover press (beside a wall he goes
;   into cover).
;   THE BELLY FLOP (Flop=1; default 0 = all of the above and nothing of this; re\player_down.md 9; NOT RUN IN THE GAME).
;   The owner: 'when i go down it does that gun one, i mean the other one where its like a full belly flop dive'.
;   The game's own fall is onto his back, gun up. What the AI heisters do when shot is their death clip, the dive
;   forward onto the belly. With Flop=1 the player goes down by that clip and lives: the same trigger, the dive in
;   place of the fall (2.0 s, no press cuts it and every hit of it costs nothing), no lying on the back, then the
;   get-up from the stomach starts by itself and is the mash. Slot ids only, written into his prone movement while he
;   is up; the game plays the clips itself. Nothing is written when the level or the body has not got both clips.
;     Flop=1          the belly flop
;     FlopBase=1.5    the get-up clip's speed with no press (the clip is 202 frames: 8 s at 1.0, 5.4 s at 1.5) GUESS
;     FlopPerPress=0.6  added per unit of the mash meter (Decay is shared with the plain get-up)                 GUESS
;     FlopTop=5.0     ceiling (1.6 s)                                                                           GUESS
;     FlopTake=1.0    the share of every health loss DURING THE GET-UP that stays; 0.25 = three quarters are given
;                     back the next frame (the get-up is long and every hit of it costs in full: run D2 of 2026-10-11
;                     lost 200 health in 3.4 s on the floor). It cannot save him from one hit that takes all he has
;     FlopUpPct=0     the health he is given when he stands, per cent of his maximum; an NPC's own down state gives
;                     75 (and 25 when it falls: DownHealth is that number for the player, in health)
;     FlopFallSlot=/Damage/Death/Die_Forward   FlopUpSlot=/Movement/Rise/Rise_From_Stomach   the two slot names
;                     (to try: /Damage/Death/Die_Backwards with /Movement/Rise/Rise_From_Back)
;   Proposed for the owner beside Enable=1: Flop=1 DownHealth=200 FlopTake=0.25 FlopUpPct=75
[Down]
Enable=0
;Dry=1
;Log=1
;Base=0.5
;PerPress=0.3
;Top=2.0
;Decay=2.0
;HealthPct=40
;Burst=1
;MinHit=20
;Window=1.0
;Cooldown=10
;DownHealth=200
;Flop=1
;FlopBase=1.5
;FlopPerPress=0.6
;FlopTop=5.0
;FlopTake=0.25
;FlopUpPct=75
;FlopFallSlot=/Damage/Death/Die_Forward
;FlopUpSlot=/Movement/Rise/Rise_From_Stomach
