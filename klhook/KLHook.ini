;BackstabBehind=0   ; (recommended off until benched) 1 = the picked bot turns only while it is behind you (judged by the way you MOVE: a GUESS). Needs Backstab > 0. Row 'backstabbehind'
;BackstabBusy=0   ; (recommended off until benched) 1 = the picked bot turns only while you are hurt. Needs Backstab > 0. Row 'backstabbusy'
;BackstabNear=0   ; units (100 = 1 m, 0 = off): the picked bot turns only within this of you. See the Backstab block further down. No row
;BackstabWait=30   ; seconds after BackstabDelay after which a waiting bot turns anyway. No row
;BackstabCrew=0   ; percent per round that one bot may turn on a crewmate (not on you): when it is in play at BackstabStage or later and another bot carrying BackstabMoney is near. Needs TraitorFoe=1. No row
;BackstabCrewNear=1500   ; units (1500 = 15 m): how near that other bot must be, only with BackstabCrew. No row
;BackstabHealth=0   ; health multiplier of a turned bot (0.25..10, 0 = off); see the Backstab block further down. No row
;BackstabAim=-1   ; accuracy per cent of a turned bot (-1 = off, 0..100). No row
;CrewHealth=0   ; health multiplier of every AI heister (0.25..10, 0 = off): tougher crew. No row
