; OnlineFill (recommended off for now): in a System Link / Private Match FA lobby, log the plan "AI heisters = lobby target - humans connected" and the Ally actors that
; survive the load; the host's Ready may start below the target (implies [Lobby] MinPlayers=1). READ-ONLY: it adds NO heister (klbotfill.c, reots_online_fill.md).
OnlineFill=0
