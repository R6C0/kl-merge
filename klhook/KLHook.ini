; OnlineBrainTraitorSenseSeen (recommended off; UNTESTED; needs OnlineBrainTraitorSense=1): the feed calls the game's B::MarkSeen (0x4880d0) instead of NoteEntity, so the human entry is marked SEEN (bit0). Without it a marked bot may aim at a human but never fires (the attack goal's fire test 0x616480 needs that bit; re/traitor_slot111_gates_1103.md).
;OnlineBrainTraitorSenseSeen=0
; OnlineBrainTraitorHitLog also (still READ ONLY, UNTESTED, recommended off) writes three kinds of proof lines while a bot is marked: "brain: traitor target:" once per second per marked bot (its current target, class human / tagged bot / cop / none, distance, and its own body's +0x2723 / +0x2726 bytes; max 60 per round), "brain: traitor probe:" once per round and on change (rules byte +0x285 "looting started", the slot-15 gate [[0x168e9e4]+0x58], whether slot 15 is our wrapper), and "brain: traitor hit health:" (the human's health on the next tick and after 500 ms for a counted marked hit, attempted vs landed).
; OnlineBrainTraitorDamage (recommended off; UNTESTED; needs OnlineBrainTraitorArcade=1 and the Brain on): the Arcade meaning of the mark for DAMAGE. In the rules' damage hook (slot 15) the player body of a MARKED bot gets its traitor byte +0x2726 = 1 before the hit, so the game's friendly-fire filter (0x6e3400 step 4, which zeroes a hit between two plain heisters before the round's first loot event) leaves the delta alone. The byte is put back at round end, round change, mark clear and death. Other bots may now treat that body as hostile (expected Arcade behaviour, to verify). Log: "brain: traitor damage:" (first 5 sets and every restore). Needs slot 15 to be reached: see the "traitor probe:" gate.
;OnlineBrainTraitorDamage=0
; OnlineBrainTraitorKillMax (recommended on; default 2; 0 = no cap): a turned bot booked with that many crew deaths within OnlineBrainTraitorKillNear (default 3000 = 30 m; the killer is not read, the nearest turned
;   bot gets the death) goes back to Ally. Stock Arcade uncapped: one traitor with $1.28M killed 5 crewmates in 22 s.
;OnlineBrainTraitorKillMax=2
;OnlineBrainTraitorKillNear=3000
; OnlineBrainTraitorMax (default 0 = off): at most this many bots turn per round (the shadow rules' turned-count word [+0x338] is raised to block further rolls).
;OnlineBrainTraitorMax=0
; ArcadeDiag (recommended off; test runs only; default 0): in an OFFLINE Arcade round (not a host round) observe the stock Traitor evaluate / RUN, READ ONLY, to get Arcade's reference numbers for the online diag.
;   Logs "brain: arcade diag:" lines: first 6 zero + 6 nonzero evaluates per round (stage byte, bot row, row 0, sum vs limit, score passes or not, level), Traitor MARK lines, a round summary (evaluate calls, nonzero, RUN calls, marks).
;   The only write is the vtable dword of each Arcade Traitor tactic (pointing at a DLL copy that calls the originals). Independent of Build / Probe.
;ArcadeDiag=0
; OnlineBrainCops (recommended off; needs OnlineBrainBridge=1): research only, no behaviour.
;OnlineBrainCops=0
; OnlineBrainTraitorStage2Gate (UNTESTED (recommended off); default 0; needs OnlineBrainTraitor=1): online the stage byte the real Traitor evaluate reads was 2 from a bot's first loot, so the score reached 7.0 at about $1M
;   and the first mark came 60-90 s into the round; Arcade shows stage 2 only around the van call / exit trigger (marks at +110..+210 s). 1 = a carrying bot shows stage 1 instead, UNLESS the van has been called,
;   the van gather runs, the bot is ordered to the exit box, or its booked loot has reached OnlineBrainTraitorStage2Money. Stage 3 (aboard / Board-ready) and stage 0/1 are unchanged; 0 = byte identical to before.
;   Also logs "brain: traitor roll:" (first pass of the score) and a round-end "TraitorRoll:" line (passes, marks, passes with no mark, first pass / first mark time); those two lines also appear with OnlineBrainTraitorHitLog=1.
;OnlineBrainTraitorStage2Gate=0
; OnlineBrainTraitorStage2Money: booked loot ($) at which the gate opens anyway (default 1250000, about Arcade's mid-map stage 2 at sum 8.0); 0 = no fallback.
;OnlineBrainTraitorStage2Money=1250000
; OnlineBrainTraitorStage2MinS (UNTESTED (recommended off until benched); default 0 = today; needs Stage2Gate=1): seconds after round start before which the gate never opens, even with the van called, the gather
;   running, a bot ordered to the exit box or the money fallback reached (a carrying bot keeps showing stage 1). Suggested 150 = the lower edge of Arcade's first traitor mark (GUESS). Logged once per round.
;OnlineBrainTraitorStage2MinS=0
; OnlineBrainTraitorStage2MaxS (UNTESTED (recommended off until benched); default 0 = today; needs Stage2Gate=1): seconds after round start at which the gate opens even if no bot reached the exit and the van
;   was never called (no-gather fallback). Suggested 240 = the upper edge of Arcade's first traitor mark (GUESS). Logged once per round. Both values appear in the round-end TraitorRoll line.
;OnlineBrainTraitorStage2MaxS=0
; OnlineBrainLevel: 1..11, the Arcade level byte the traitor roll reads.  LootWinMs / BoardWinMs: ms a real tactic keeps a bot after its evaluate returned > 0 (500..60000).
;OnlineBrainLevel=6
;LootWinMs=1500
;BoardWinMs=2000
; ArcadePick (recommended off; UNTESTED, needs Build + Loot + OnlineBrainBridge): the puppeteer walks a bot to the stack the real Loot evaluate chose ([tac+0x2c]) instead of its own nearest.
;ArcadePick=0
; StackClaims (recommended off; UNTESTED, needs Build + Loot + OnlineBrainBridge; for RealRun): the loot candidates the real Loot evaluate gets skip a stack another bot is grabbing or picked
; in the last 4 s, so each bot walks to its own stack (bs4: bots shared the nearest stack, one grabbed, the rest stood until the watchdog took them back).
;StackClaims=0
; DropCands (recommended off; UNTESTED, needs Build + Loot + OnlineBrainBridge; for RealRun): slot 202 also offers valid type-1 drops (armed, amount left, unhidden, preceded by a real stack drain = the
; OnlineDropFollow rule), merged with the type-0 stacks by distance as Arcade does (StackClaims filters both). The pump may then grab a chosen drop; without it the pump never grabs one. Needs the puppeteer's drop
; tracking (OnlineDropFollow / OnlineTactics scan) to be running. bs4c DD05: cops carry the loot, every stack drains into a drop within ~20 s and slot 202 returned 0 candidates.
; Round end: 'DropCands: N drop(s) offered ..., M drop grab(s) started by the pump'.
;DropCands=0
; BoardStage (recommended off; UNTESTED, needs RealRun + OnlineBrainBoardReal): the REAL Board tactic boards the bots like Arcade. The shadow crew record's stage byte shows 3 as soon as the van waits (state 3 / 4)
; and the bot carries loot or is ordered to the exit box (not only after it boarded), and the hook's own box boarding (OnlineTactics) waits up to 6 s per bot while the real Board tactic holds it
; (a bot in the box with no Board evaluate yet waits 2.5 s for one), then boards as before.
; Round end: 'BoardStage: N boarded by the real Board tactic (slot 45), M by the fallback'.
;BoardStage=0
; BoardHold (recommended off; UNTESTED, needs BoardStage=1): the real Board tactic keeps a bot for BoardHoldMs (default 4500) after its LAST nonzero Board evaluate or RUN-resume stamp, not only BoardWinMs (2 s):
; bs6 DM03 gave 4 bots to the fallback at 12.2 s although the RUN was mid-walk. The hook's own boarding then waits (at most 6 s) for longer. GUESS: the planner re-evaluates 0-2 times a second there.
;BoardHold=0
;BoardHoldMs=4500
; BoardNode (recommended off; UNTESTED, needs BoardStage=1): maps WITHOUT an escape box, van state 3 / 4: the OnlineExitCrowd test of a bot the real Board tactic holds is against the van's boarding node ([rules+0x1e0]
; node + 500 along x, as OnlineVanBoPos) instead of the exit trigger (bs6 DD05: node 15.7 m from the trigger, the real RUN needs the bot within 3 m of it). Other bots keep the trigger test. Logs the node once per round.
;BoardNode=0
; BoardStage0 (recommended off; UNTESTED, needs BoardStage=1): maps without an escape box: a bot in the exit crowd (OnlineExitCrowd) shows stage 3 even with tally 0, not only after a gate call (bs6 DD05: tally-0 bots never got 3).
;BoardStage0=0
; BoardLog (recommended off; diagnostic, needs BoardStage=1): per bot per second in van state 3 / 4 (bnzAt age, metres to the node and to the exit trigger, stage byte), per gate call, and at the round end
; the slot-45 calls for a bot not yet aboard vs repeats for an aboard bot. At most about 330 lines per round.
;BoardLog=0
; BoardProbe (UNTESTED (recommended off); LOG ONLY, default 0, independent of BoardStage): board-fallback diagnostics (re board_fallback_1104). (1) 'brain: boardprobe:' line with the REAL rules' [+0x1e0] / [+0x1e4] raw
; pointers (readable or not), the chain [[+0x1e0]+4]+0x18 that 0x5aeb00 is believed to read, state byte, timer, kind byte, when the vehicle is first called and at each state change (24 per rules object); online it
; runs in the 1 s brain sync (needs the [Brain] shadow, i.e. Build etc. on), and in ARCADE from klmove.c's tick (needs a [Move] feature on so the tick runs, any map; the baseline for DD03 online [+0x1e0] = 0).
; (2) van state 3 / 4: one line per second per loyal bot not yet aboard (stage byte, state, timer, last Board evaluate answer + age, metres to the node, current AI goal pointer + class, plus the previous stage byte and how long ago it changed, and the visit number), max 80 per vehicle visit.
; (3) the BoardLog round-end line (needs BoardLog=1) also counts 'stale ledger' (slot 45 for a bot the ledger showed aboard since an EARLIER vehicle visit) apart from same-visit repeats.
;BoardProbe=0
; RealRun (recommended off; UNTESTED, needs Build + Loot + OnlineBrainBridge): the REAL Arcade Loot / Board RUN drives the bots. A longjmp import thunk swaps the shadow rules in at each resume of
; one of our tactic coroutines and out at each yield (no SEH across a yield; bs1 crash c0000029). Without it PuppetOff / OnlineBrainBoardReal are forced off.
;RealRun=0
; [Perf] (2026-11-05): three behaviour-preserving savings from the read-only perf sweep. A MISSING key = off = the old behaviour; the lines below turn them on.
[Perf]
OsdBackoff=1    ; (recommended on) klhud.c: after 6 empty OSD scans of a scene the next scan waits 60 s (2 s / 15 s before); a new round resets it
OsdScanSlice=1  ; (recommended on) klhud.c: the OSD memory scan runs ~24 ms per 100 ms HUD tick instead of all at once (9 seats on one PC: 50-85 s one-call scans, seats killed by the watchdog)
ScanMinFrames=1  ; (recommended on) the timed table walks (klsync Compare / Apply / Puppet / Probe, the AI-heister list, botfill census) also wait interval*20/1000 frames: unchanged at 20 fps or more, a starved seat (below ~2 fps) no longer runs every walk on every frame
OnlineCache=1   ; (recommended on) kl_online() reuses its answer within one hook tick (50 ms off the game thread)
FastRead=1      ; (recommended on) reads of kl2.exe's own code/data sections are a memcpy instead of ReadProcessMemory (heap reads unchanged)
