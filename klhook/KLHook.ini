[HUD]
ScoreboardNextHint=0  ; (recommended on) 1 = one extra line under the after-match scoreboard: NEXT: BUY WEAPONS, THEN [F2] MORE PAGES  [F3] HEISTERS (needs the page features on; with [ShopPage] PageQueue=1 it reads PRESS NOW: [F2] ... and the page opens with Buy Weapons)
