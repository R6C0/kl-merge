;   THE AI HEISTERS' OWN DOWN (Bots=1; default 0; track R4, re/player_down.md 11; NOT RUN IN THE GAME - AND NOT SHOWN
;   THAT IT MAKES ONE GO DOWN: a test key until live check B1 has printed an 'IS DOWN' line; not for the owner's ini).
;   Works with Enable=0 as well. The game has a 'down not dead' for every NPC (at the hit that takes his last health
;   he falls, lies 1.5 .. 3 s firing from the floor, is given 25 % health, stands with 75 %), and in Arcade no AI
;   heister was ever seen in it (267 of 267 died); why is not established. Bots=1 sets each AI heister's own
;   EDownNotDeadModifier to 'force', as a level's SquadModifierBehaviour would: the level-wide pause (no down within
;   5 s of ANY NPC's, a policeman's too) and his 50 % chance no longer refuse. The game's other refusals stay, and
;   one of them may be what refuses every time: a hit animation playing, not one metre of mesh free all round him,
;   a head hit from within 15 m, a hit of more than 1,000 (the point-blank step, the left-behind kill), a second
;   health 0 on the floor. When he is up the game counts him as 'arrived' at the step his route waits in: a down
;   can skip a hold, a loot stop or a gate of his route (the game's own line, not the hook's).
;   His clip is the game's NPC one - the stock fall onto his side ('the gun one'), not the belly flop.
;     Bots=1          the part
;     BotsDry=1       nothing is written: every AI heister's death prints the readable inputs of the game's test and
;                     his place ('down: bots: record N DIED at health 0 without going down at (x, y, z) ...'). It
;                     cannot tell the pause from the earlier tests: a 'g MAY have refused' is not an answer
;     BotsForce=1     the modifier 0 -> 1 (0 = the game's own pause and chance stay; the other keys still act)
;     BotsMax=2       downs a bot a round (GUESS; the game's own is 1: its 'was down once' byte is cleared n - 1 times)
;     BotsLie=0       seconds he lies (0 = the game's 1.5 .. 3.0 by a random number; 0.5 .. 15)
;     BotsFree=0.75   seconds from the down's start in which no hit costs him (the stock human's fall is free for
