KillPts=2
PolicePts=1
LootPts=1
RewardPts=1
EscapePts=6
DeadPts=-3
TraitorPts=-4
FedPts=-2
LootUnit=50000
RewardUnit=25000
LootCap=12
CutS=14
CutA=10
CutB=6
CutC=3

