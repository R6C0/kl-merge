; KLJoin.ini for Retomoto Tower (tower M09_A + lobby M09_B in one Fragile Alliance level).
; Install as  KLJoin.ini  in the folder the level's archive is opened from:
;   <Dog Days>\KLExpansion\Maps\<map>\KLJoin.ini      expansion layout ([Redirect] F0x=<map>)
;   <Dog Days>\Scenes\Locations\F01\KLJoin.ini        the F01 test slot
; KLHook (kljoin.c) reads it when that archive is opened and uses it only while that level runs, and never beside
; a stock archive. Remove it from the F01 slot when another build goes in: the Name / Target checks keep a stale
; file from firing on another level, they do not make it tidy.
;
; Box = kl_fa_author.JOIN_BOX: the floor IN FRONT of the tower's escape car, x 2550..2790, y 19500..19800 (up),
; z 800..1100. Not the inside of the car (x 2802..3142, the first version of this file): its doors are shut and stop
; the player at x 2727 (run J1). This box fired live in runs J1b, J2 and J3 at (2709..2719, 19601, 1099..1100) -
; the player crosses its z = 1100 face on the way to the car.
; Entry 5 = Specials!JumpPoints!06_Exit at (6272, 563, -6305), the lobby car (read from the game's jump list in
; run RT4). All three of Entry / Name / Target are given, so the box only fires when the sixth jump point of the
; running level has that name and stands there.
; 2026-10-15 (owner: the teleport exactly at the elevator, for whoever touches it - you, an AI heister, you as a fed): the box covers the
; whole floor in front of the elevator car, the crew gather spot (2430, 510) included (was x 2550..2790, z 800..1100). Bots: [CrewHop.2].
[Join]
Min=2330 19500 380
Max=2790 19800 1100
Entry=5
Name=06_Exit
Target=6272 563 -6305
Tolerance=8

; ---- [CrewJoin]: written by tools\kl_fa_bots_rt.py. Read by KLHook's klcrew_rt.c, and only when KLHook.ini has
; [CrewJoin] Enable=1. The tower's navigation mesh does not reach the lobby, so the AI heisters cannot walk there.
; When kljoin.c's jump request for the entry named here is pending (the tick BEFORE the game moves the player), every
; AI heister still in play is put on one of the places below by the game's own actor teleport (kl2 0x62a900). The
; game then moves the player and sends 'AITrigger' to the entry's own list, which starts the bots' street route.
; Late form (the request was not seen pending): the same when a local player stands within Radius of Target after
; he was farther than From from it.
; Places = feet on the lobby's navigation mesh in front of the car's door, record order (the n-th AI crew record
; in play gets Place.n). Lift = added to the height of every place (0: the mesh height, as the level places a bot).
[CrewJoin]
Name=06_Exit
Target=6272 563 -6305
Tolerance=8
Radius=300
From=2000
Lift=0
Places=7
Place.1=5952 570 -6305
Place.2=5912 570 -6425
Place.3=5912 570 -6185
Place.4=5832 570 -6305
Place.5=5912 570 -6545
Place.6=5912 570 -6065
Place.7=5912 570 -6665

