; Gate.7's holds x -203..1157, z -765..603, y 19600) goes DOWN BY ITSELF: the game's own actor teleport puts it in front of the lobby car's
; door (the [CrewJoin] places), whether or not you are there yet. When you come down, [CrewJoin] gathers the crew there again and the
