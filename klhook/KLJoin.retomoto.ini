; KLJoin.ini for Retomoto Tower (tower M09_A + lobby M09_B in one Fragile Alliance level).
; Install as  KLJoin.ini  in the folder the level's archive is opened from:
;   <Dog Days>\KLExpansion\Maps\<map>\KLJoin.ini      expansion layout ([Redirect] F0x=<map>)
;   <Dog Days>\Scenes\Locations\F01\KLJoin.ini        the F01 test slot
; KLHook (kljoin.c) reads it when that archive is opened and uses it only while that level runs, and never beside
; a stock archive. Remove it from the F01 slot when another build goes in: the Name / Target checks keep a stale
; file from firing on another level, they do not make it tidy.
;
; Box = kl_fa_author.JOIN_BOX, the inside of the tower's escape car (re\retomoto_fa.md 9.4): x 2802..3142,
; y 19560..19860 (up), z 789..1029. Entry 5 = Specials!JumpPoints!06_Exit at (6272, 563, -6305), the lobby car
; (read from the game's jump list in run RT4). All three of Entry / Name / Target are given, so the box only fires
; when the sixth jump point of the running level has that name and stands there.
[Join]
Min=2802 19560 789
Max=3142 19860 1029
Entry=5
Name=06_Exit
Target=6272 563 -6305
Tolerance=8
