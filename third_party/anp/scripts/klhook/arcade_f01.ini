; Unattended load test (JC's KLHook TEST build): the STOCK Arcade level in slot F01 (Subway), started from the menu
; as a real session; end the run 20 s after it has loaded. Route = kl-merge klhook\KLHook.round.ini lines 1-20
; (run live by JC on 2026-10-09), without the walk. Same rules as menu.ini; on top:
;  - a real session: Hooks=0 is required (Valve CEG's integrity check ends a session whose hashed code was patched)
;  - the run ends ~20 s into the round: the player never dies, and the TEST build's Steam guard blocks the
;    session's stat / leaderboard writes. Stop if the log says 'steam: NOT GUARDED'.
; Run (repo root, game closed):
;   py work\ext\kl-merge\tools\kl_autotest.py 1200 --tag arcade --shots 60-400:20
;      --hook work\ext\kl-merge\tools\build\klhook\test\dinput8.dll --ini scripts\klhook\arcade_f01.ini
[KLHook]
ContinueAsserts=1
MaxDumps=4
MaxAsserts=200
[Auto]
EndHooks=1
Enable=1
